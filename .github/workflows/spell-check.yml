name: Spell check

on:
  pull_request:
    branches: [main, master, v2-quarto-html]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cspell:
    name: cspell on prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: streetsidesoftware/cspell-action@v6
        with:
          # Scan prose files only; code, freeze cache, and rendered output
          # are excluded via .cspell.json's ignorePaths.
          files: |
            *.qmd
            README.md
            NEWS.md
            scripts/README.md
          config: .cspell.json
          inline: warning
          strict: false
          incremental_files_only: false
