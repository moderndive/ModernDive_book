name: Spell check

on:
  # push included so direct pushes to the deploy branch are checked too —
  # PR-only meant the path that actually publishes was never spell-checked.
  push:
    branches: [v2-quarto-html, v2]
  pull_request:
    branches: [v2-quarto-html, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cspell:
    name: cspell on prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: streetsidesoftware/cspell-action@v8
        with:
          # Scan prose files only; code, freeze cache, and rendered output
          # are excluded via .cspell.json's ignorePaths.
          # exercises/NN.yml carries all 511 student-facing exercise prompts —
          # prose, not config. (The *-solutions.yml siblings are private-repo
          # sync artifacts, untracked here and excluded in .cspell.json.)
          files: |
            *.qmd
            exercises/[0-9][0-9].yml
            README.md
            NEWS.md
            scripts/README.md
          config: .cspell.json
          inline: warning
          strict: false
          incremental_files_only: false
