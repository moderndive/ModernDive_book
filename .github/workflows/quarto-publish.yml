on:
  push:
    branches: [main, master, v2-quarto-html]
  pull_request:
    branches: [main, master, v2-quarto-html]
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # renv is active (full reproducibility). The GitHub data packages are
      # vendored into the renv cellar (git clone + R CMD build, via git protocol
      # — no api.github.com) BEFORE restore, so renv installs them from the
      # cellar (matched by name + version) and never resolves the GitHub remote,
      # i.e. the api.github.com/commits/<ref> call that used to flake (error 22).
      RENV_PATHS_CELLAR: ${{ github.workspace }}/renv/cellar
      RENV_CONFIG_SYNCHRONIZED_CHECK: "FALSE"
    steps:
      # Checkout repository
      - uses: actions/checkout@v6

      # Setup Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Setup R environment - pin to the version renv.lock was built against
      # so RSPM serves precompiled binaries (avoids source compilation against
      # mismatched R API headers).
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # Install system libraries for the V8 R package
      - name: Install system libraries for V8
        run: |
          sudo apt-get update
          # Try libv8-dev first; if not available on this Ubuntu image, fall back to libnode-dev
          sudo apt-get install -y libv8-dev || sudo apt-get install -y libnode-dev
          # ICU is a common runtime dependency for V8 on Ubuntu
          sudo apt-get install -y libicu-dev

      # Vendor the GitHub data packages into the renv cellar: clone each at the
      # exact RemoteSha recorded in renv.lock (git protocol — no api.github.com)
      # and R CMD build it into renv/cellar/. renv::restore then finds each one
      # in the cellar (by name + version) and installs locally, so it never
      # resolves the GitHub remote. The package list + SHAs are read straight
      # from renv.lock, so this stays correct as the lockfile is re-pinned.
      - name: Vendor GitHub data packages into the renv cellar
        run: |
          mkdir -p renv/cellar
          python3 -c "import json; [print(p['Package'], p['RemoteUsername'], p['RemoteRepo'], p['RemoteSha']) for p in json.load(open('renv.lock'))['Packages'].values() if p.get('Source')=='GitHub']" \
            | while read name user repo sha; do
                echo "::group::vendor $name @ ${sha:0:10}"
                git clone --quiet --filter=blob:none "https://github.com/$user/$repo.git" "/tmp/src_$name"
                git -C "/tmp/src_$name" checkout --quiet "$sha"
                R CMD build --no-build-vignettes --no-manual "/tmp/src_$name"
                mv ${name}_*.tar.gz renv/cellar/
                echo "::endgroup::"
              done
          echo "Cellar contents:"; ls -1 renv/cellar/

      # Restore the renv library: CRAN packages from P3M, the GitHub data
      # packages from the cellar above. No api.github.com.
      - uses: r-lib/actions/setup-renv@v2

      # Cache Quarto's freeze directory so chapters don't re-execute on every push.
      # Cache key now hashes ONLY the root-level book qmds + index.qmd (what
      # the main book actually renders) — not instructor-solutions/ or other
      # nested qmds, whose changes don't affect the main book's freeze.
      - name: Cache Quarto freeze
        uses: actions/cache@v5
        with:
          path: .quarto/_freeze
          key: quarto-freeze-${{ hashFiles('*.qmd', 'index.qmd', 'scripts/exercise_helpers.R', 'scripts/image_functions.R', 'exercises/*.yml') }}
          restore-keys: quarto-freeze-

      # Render Quarto book
      - name: Render Quarto Book
        run: quarto render

      # Save R package state
      - name: Save R Package State
        run: |
          R -e 'saveRDS(installed.packages(), file = "installed_packages.rds")'

      # Deploy HTML to GitHub Pages if on main or master branch
      - name: Deploy to GitHub pages from main/master 🚀
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: gh-pages
          folder: docs
          clean: false

      # Deploy to v2-publish if on v2-quarto-html branch.
      # NOTE: deliberately not deploying to gh-pages/v2 — that subfolder
      # is the live moderndive.com/v2 page and stays on the bookdown build
      # served from the v2 branch.
      - name: Deploy to v2-publish branch 🚀
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v2-quarto-html'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: v2-publish
          folder: docs
          clean: false
