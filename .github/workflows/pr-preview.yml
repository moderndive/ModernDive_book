name: PR preview artifact

# On every pull-request push to v2-quarto-html, render the book and upload
# `docs/` as a downloadable artifact. PR authors / reviewers can download
# the zip and open it locally to see the rendered version of their changes
# before merge.
#
# (Full preview-deploy infrastructure — Netlify / Cloudflare Pages — would
# be nicer but adds operational overhead. This artifact-upload approach gives
# the same review-before-merge capability with zero external dependencies.)

on:
  pull_request:
    branches: [v2-quarto-html]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # renv disabled in CI (see quarto-publish.yml): when active, renv resolves
      # the GitHub data packages via api.github.com, which flakes. We install the
      # lockfile's CRAN packages from P3M + the GitHub packages via git clone.
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true

      - name: Install system libraries for V8
        run: |
          sudo apt-get update
          sudo apt-get install -y libv8-dev || sudo apt-get install -y libnode-dev
          sudo apt-get install -y libicu-dev

      - name: Install CRAN packages from renv.lock
        run: |
          R -q -e '
            if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite")
            lock <- jsonlite::fromJSON("renv.lock", simplifyVector = FALSE)$Packages
            keep <- Filter(function(p) !identical(p$Source, "GitHub") && !identical(p$RemoteType, "github"), lock)
            need <- setdiff(names(keep), rownames(installed.packages()))
            message("Installing ", length(need), " CRAN packages from the lockfile")
            if (length(need)) install.packages(need)
          '

      - name: Install GitHub-only exercise packages
        run: |
          R -q -e 'if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")'
          ok=0
          for attempt in 1 2 3 4 5; do
          R -q -e 'for (repo in c("moderndive/olympicAthletes",
            "ismayc/steves",
            "moderndive/exoplanets",
            "moderndive/volcanoes")) remotes::install_git(
            paste0("https://github.com/", repo, ".git"), upgrade = "never", quiet = FALSE)' && { ok=1; break; }
          echo "::warning::GitHub install attempt $attempt failed; retrying in $((attempt*10))s"; sleep $((attempt*10))
          done
          [ "$ok" = 1 ] || { echo "::error::GitHub package install failed after 5 attempts"; exit 1; }

      - name: Cache Quarto freeze
        uses: actions/cache@v5
        with:
          path: .quarto/_freeze
          key: quarto-freeze-${{ hashFiles('*.qmd', 'index.qmd', 'scripts/exercise_helpers.R', 'scripts/image_functions.R', 'exercises/*.yml') }}
          restore-keys: quarto-freeze-

      - name: Render book
        run: quarto render

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-preview-${{ github.event.pull_request.number || 'manual' }}
          path: docs/
          retention-days: 14
