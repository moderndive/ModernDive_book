name: Preview Quarto Book

on:
  workflow_dispatch:
  push:
    branches: 
      - copilot/convert-bookdown-to-quarto

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Exercise dataset packages install at branch HEAD, so their SHAs drift
      # from renv.lock and renv's per-session "out-of-sync" check fires on
      # every chunk. Disable just that check; renv stays active.
      RENV_CONFIG_SYNCHRONIZED_CHECK: "FALSE"
    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Setup Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Setup R environment - pin to the version renv.lock was built against
      # so RSPM serves precompiled binaries (avoids source compilation against
      # mismatched R API headers).
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      # Install system libraries for the V8 R package
      - name: Install system libraries for V8
        run: |
          sudo apt-get update
          # Try libv8-dev first; if not available on this Ubuntu image, fall back to libnode-dev
          sudo apt-get install -y libv8-dev || sudo apt-get install -y libnode-dev
          # ICU is a common runtime dependency for V8 on Ubuntu
          sudo apt-get install -y libicu-dev

      # Setup renv if needed
      - uses: r-lib/actions/setup-renv@v2

      # Cache Quarto's freeze directory so chapters don't re-execute on every push
      - name: Cache Quarto freeze
        uses: actions/cache@v4
        with:
          path: .quarto/_freeze
          key: quarto-preview-freeze-${{ hashFiles('**/*qmd') }}
          restore-keys: quarto-preview-freeze-

      # Render Quarto book
      - name: Render Quarto Book
        run: quarto render
          
      # Deploy to quarto-preview branch
      - name: Deploy to quarto-preview branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          branch: quarto-preview
          folder: docs
          clean: true

      # Log deployment completion
      - name: Log Deployment
        run: |
          echo "✅ Quarto book built successfully"
          echo "📦 Deployed to quarto-preview branch"
          echo "📁 All files in docs/ folder have been pushed"
