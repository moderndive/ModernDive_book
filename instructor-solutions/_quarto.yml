# Standalone Quarto project for the instructor-only outputs.
#
# To render the full project: `cd instructor-solutions && quarto render`
# Output:
#   _site/index.html              — worked exercise solutions (single file)
#   _site/slides/index.html       — slide-deck landing page
#   _site/slides/NN-slides.html   — revealjs deck per chapter (11 decks)
#
# This project is independent of the book; the book deploy workflow only
# ships the repo's `docs/` folder, which never receives this output. The
# companion private `moderndive_exercise_solutions` repo renders this
# project in CI and publishes the (staticrypt-encrypted) result to its
# own gh-pages branch.

project:
  type: default
  output-dir: _site
  render:
    - index.qmd                       # NEW hub at root
    - solutions/index.qmd             # moved worked-solutions page
    - syllabus.qmd
    - slides/index.qmd
    - slides/*-slides.qmd
    - facilitator-notes/index.qmd
    - facilitator-notes/*_notes.qmd
  resources:
    - "../style.css"
    - "moderndive-instructor.scss"
    - "slides/moderndive-slides.js"
    - "slides/moderndive-slides.scss"
  # All R chunks run from the project root (instructor-solutions/), not the
  # individual file's directory. This keeps relative paths in solutions
  # YAMLs (e.g., `../data/dem_score.csv`) resolving the same way regardless
  # of whether the page lives at the project root or in solutions/.
  execute-dir: project

format:
  html:
    theme:
      light: [cosmo, moderndive-instructor.scss]
      dark: darkly
    css: ../style.css
    toc: true
    toc-depth: 3
    toc-expand: 3
    toc-location: left
    number-sections: false
    code-link: true
    code-annotations: hover
    fig-align: center
    embed-resources: true
