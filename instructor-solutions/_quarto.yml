# Standalone Quarto WEBSITE for the instructor-only outputs.
#
# Type changed from `default` to `website` so every page (including the
# standalone R-script-generated pages we drop into _site/) shares a
# top-of-page navbar with Plan / Teach / Assess dropdowns. The standalone
# pages use scripts/_hub_nav.R's hand-built navbar that mirrors the
# Quarto-generated one below — same links, same look.
#
# To render the full website: `cd instructor-solutions && quarto render`
# Output:
#   _site/index.html              — instructor hub
#   _site/NEWS.html               — changelog
#   _site/solutions/index.html    — worked exercise solutions
#   _site/slides/index.html       — slide-deck landing
#   _site/slides/NN-slides.html   — revealjs deck per chapter (11 decks)
#   _site/syllabus.html           — sample syllabus
#   _site/facilitator-notes/*     — per-chapter teaching scaffolds
#
# Standalone R-generated pages (NOT in the render list — built separately
# by scripts/build_*.R then placed into _site/):
#   concept-map, assessment-matrix, misconceptions, exam-bank,
#   pacing-calculator, cumulative-review, homework-planner,
#   lesson-plans, coverage-map

project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - NEWS.md
    - solutions/index.qmd
    - syllabus.qmd
    - slides/index.qmd
    - slides/*-slides.qmd
    - facilitator-notes/index.qmd
    - facilitator-notes/*_notes.qmd
    # Second-wave resources added 2026-05-24
    - rubrics.qmd
    - projects.qmd
    - active-learning.qmd
    - ethics-scenarios.qmd
    - ta-guide.qmd
    - posit-cloud.qmd
    - common-errors.qmd
    - diagrams.qmd
    - sampling-bootstrap-applet.qmd
  resources:
    - "../style.css"
    - "moderndive-instructor.scss"
    - "slides/moderndive-slides.js"
    - "slides/moderndive-slides.scss"
    - "_includes/hub-nav.html"
    # Posit Cloud template bundle — students/instructors download as a tar
    - "posit-cloud/"
  execute-dir: project

# freeze: true — Quarto unconditionally reuses frozen chunk output when
# _freeze/ has data for a document, regardless of source-change detection
# (which doesn't work reliably across {{< include >}} boundaries — the
# solutions index includes 11 per-chapter qmds, and freeze: auto kept
# re-executing despite the cache restoring correctly).
#
# Safety: the CI cache key for _freeze is hashFiles of exercise YAML +
# exercise_helpers.R, so when the actual content changes, the cache
# misses → no freeze data → Quarto re-executes and rebuilds the freeze.
# When YAML/helpers are unchanged, cache hits → freeze used → SKIP exec.
execute:
  freeze: true

website:
  title: "ModernDive — Instructor"
  site-url: https://moderndive-instructor-resources.netlify.app/
  favicon: ../images/logos/favicons/favicon.ico
  navbar:
    background: "#1F3A6B"   # ModernDive hex navy
    foreground: "#ffffff"
    left:
      - text: "Hub"
        href: index.html
      - text: "Plan"
        menu:
          - text: "Sample syllabus"
            href: syllabus.html
          - text: "Lesson plans"
            href: lesson-plans.html
          - text: "Concept map"
            href: concept-map.html
          - text: "Pacing calculator"
            href: pacing-calculator.html
          - text: "Assessment alignment"
            href: assessment-matrix.html
          - text: "Posit Cloud template"
            href: posit-cloud.html
      - text: "Teach"
        menu:
          - text: "Slide decks"
            href: slides/index.html
          - text: "Facilitator notes"
            href: facilitator-notes/index.html
          - text: "Active-learning prompts"
            href: active-learning.html
          - text: "Misconceptions"
            href: misconceptions.html
          - text: "Common R errors"
            href: common-errors.html
          - text: "Teaching diagrams"
            href: diagrams.html
          - text: "Sampling vs bootstrap (interactive)"
            href: sampling-bootstrap-applet.html
          - text: "Ethics & data scenarios"
            href: ethics-scenarios.html
          - text: "TA training packet"
            href: ta-guide.html
          - text: "ModernDive Labs (external)"
            href: https://moderndive.github.io/moderndive_labs/
      - text: "Assess"
        menu:
          - text: "Homework planner"
            href: homework-planner.html
          - text: "Coverage map"
            href: coverage-map.html
          - text: "Worked exercise solutions"
            href: solutions/index.html
          - text: "Rubrics library"
            href: rubrics.html
          - text: "Project prompt bank"
            href: projects.html
          - text: "Exam question bank"
            href: exam-bank.html
          - text: "Cumulative review"
            href: cumulative-review.html
          - text: "Flashcards (Anki/Quizlet)"
            href: flashcards.html
      - text: "What's new"
        href: NEWS.html
    right:
      - icon: github
        href: https://github.com/moderndive/ModernDive_book
        aria-label: "ModernDive book source on GitHub"

format:
  html:
    theme:
      light: [cosmo, moderndive-instructor.scss]
      dark: darkly
    css: ../style.css
    toc: true
    toc-depth: 3
    toc-expand: 3
    toc-location: left
    number-sections: false
    code-link: true
    code-annotations: hover
    fig-align: center
    embed-resources: true
    # Pagefind sitewide search modal injected on every page. Matching
    # snippet in scripts/_hub_nav.R injects the same modal into the
    # R-generated standalone pages, so the search UI is identical
    # across the two render paths.
    include-after-body: _includes/pagefind-search.html
