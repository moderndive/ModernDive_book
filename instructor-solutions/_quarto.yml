# Standalone Quarto project for the instructor-only solutions HTML.
#
# To render: `cd instructor-solutions && quarto render`
# Output: instructor-solutions/_site/index.html (single self-contained file).
# This project is independent of the book; the book deploy workflow only
# ships the repo's `docs/` folder, which never receives this output.

project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - "../style.css"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: ../style.css
    toc: true
    toc-depth: 3
    toc-expand: 3
    toc-location: left
    number-sections: false
    code-link: true
    code-annotations: hover
    fig-align: center
    embed-resources: true
