# Slide-deck MCQ variants for Chapter 10 (Inference for Regression).
# Scenarios use palmerpenguins regression instead of the book's
# olympic_athletes / Saratoga-houses / coffee examples.

chapter: 10
title: Inference for regression

variants:
  - n: 1
    stem: "What does a 95 % confidence interval for a regression slope $\\beta_1$ tell you?"
    options:
      a: "The slope's value with certainty"
      b: "A range of values consistent with the observed data at the 95 % level — what the TRUE slope $\\beta_1$ plausibly is, with 5 % allowance for error"
      c: "The R² of the model"
      d: "The model's predictive accuracy"
    correct: b
    explanation: "CI for $\\beta_1$ = plausible range for the population's true slope. If the CI excludes 0, we have evidence the relationship is real (not just noise). The CI also gives EFFECT SIZE plausibility, not just yes/no."

  - n: 2
    stem: "Which of the LINE conditions can be assessed using a *residuals vs. fitted values* plot?"
    options:
      a: "Only L (Linearity)"
      b: "L (Linearity, curved pattern) AND E (Equal variance, fan-shape widening)"
      c: "Only N (Normality)"
      d: "I (Independence)"
    correct: b
    explanation: "Residuals-vs-fitted is THE workhorse plot. Look for: random-looking band (good — L + E hold) vs. curved pattern (L violated — wrong functional form) vs. fan/funnel (E violated — heteroscedasticity). Normality is checked with a QQ plot; Independence usually requires domain knowledge (or time-series tests)."

  - n: 3
    stem: "A theory-based $t$-test and a simulation-based permutation test for a regression slope often yield similar $p$-values when:"
    options:
      a: "Sample size is small"
      b: "The LINE assumptions hold (especially Normality and Equal variance) — both methods are then valid and converge"
      c: "There's no slope"
      d: "There's a strong slope"
    correct: b
    explanation: "When LINE holds, theory-based (assumed-normal sampling distribution) and simulation-based (empirically observed via permutation) inference are both valid, and they agree numerically. When LINE breaks (heavy tails, fan-shape, etc.) they diverge — and the simulation-based answer is usually more trustworthy."

  - n: 4
    stem: "A penguin-bill-vs-body-mass regression has slope 90 g/mm and $p$-value 0.001. The MOST precise conclusion:"
    options:
      a: "Bill length CAUSES body mass"
      b: "Evidence is strong against the null of 'zero slope'; in the population, body mass appears to rise about 90 g per extra mm of bill — CAUSATION not addressed by this data alone"
      c: "Slope is 0.001"
      d: "The model is 99.9 % accurate"
    correct: b
    explanation: "$p$-value addresses 'evidence against the slope being zero.' Effect size = 90 g/mm. Causation requires a randomised design or strong domain reasoning, neither of which is in a regression coefficient by itself."

  - n: 5
    stem: "A residuals-vs-fitted plot shows residuals fanning OUT (small at low fitted values, large at high). This violates which LINE assumption?"
    options:
      a: "Linearity"
      b: "Equal variance (Equal-spread / homoscedasticity) — residuals' spread should be roughly the same across all fitted values"
      c: "Normality"
      d: "Independence"
    correct: b
    explanation: "Fan-shape = changing variance with the fit = heteroscedasticity. The classical regression assumes constant residual variance; without it, theory-based standard errors miscalibrate (CIs and $p$-values become unreliable). Common fix: transform $y$ (often log), use heteroscedasticity-robust SEs, or bootstrap."

  - n: 6
    stem: "A QQ-plot of residuals shows points sharply deviating from the diagonal at both tails. This suggests:"
    options:
      a: "The model fits perfectly"
      b: "Residuals are HEAVY-TAILED (more extreme values than a Normal would predict) — N in LINE is in trouble; theory-based CIs/$p$-values may be unreliable"
      c: "Linearity is violated"
      d: "Independence is violated"
    correct: b
    explanation: "QQ-plot diagnoses normality. Diagonal-along-the-middle, tails-pulling-away = heavy-tailed residuals (excess outliers). Theory-based regression inference assumes near-normal residuals; deviations make $p$-values miscalibrate. Bootstrap CIs are more robust here."

  - n: 7
    stem: "When checking the *Independence* assumption, the most common diagnostic is:"
    options:
      a: "A QQ-plot"
      b: "DOMAIN KNOWLEDGE about how the data was collected — were observations independent? (For time-series, plot residuals against time and look for patterns.)"
      c: "Residuals vs fitted"
      d: "A scatterplot matrix"
    correct: b
    explanation: "Independence is the hardest LINE condition to test from the data alone — it's primarily about COLLECTION DESIGN. Clusters (students in classrooms), time (repeated daily measures), spatial proximity all violate independence. Time-series residuals can be plotted vs. time for autocorrelation, but the right question is usually 'how were these data sampled?'"

  - n: 8
    stem: "A 95 % CI for a slope is $(0.2, 0.8)$. What can you conclude about the $p$-value for $H_0 : \\beta_1 = 0$?"
    options:
      a: "$p > 0.05$"
      b: "$p < 0.05$ — zero is outside the 95 % CI, so a two-sided test at $\\alpha = 0.05$ REJECTS $H_0 : \\beta_1 = 0$"
      c: "$p = 0.05$ exactly"
      d: "Can't tell from a CI alone"
    correct: b
    explanation: "Duality: a 95 % CI contains the $\\beta_0$ values that two-sided tests at $\\alpha = 0.05$ FAIL to reject. Since 0 is OUTSIDE, the test rejects, so $p < 0.05$. (Exact $p$-value can't be pinpointed from just a CI's endpoints, but the comparison to $\\alpha$ is exact.)"

  - n: 9
    stem: "You bootstrap a regression slope 2,000 times and get a roughly normal distribution. The standard error of the slope (estimated from the bootstrap) is:"
    options:
      a: "The standard deviation of the response variable"
      b: "The standard deviation of the 2,000 bootstrap slope estimates — empirically describes how much the slope would vary across re-samples"
      c: "The R²"
      d: "The mean of the bootstrap distribution"
    correct: b
    explanation: "Bootstrap SE = SD of the bootstrap statistics. That's the empirical version of the 'expected variability of the slope across hypothetical re-samples', without needing classical-theory assumptions. Use it to build a normal-approximation CI ($\\hat{\\beta_1} \\pm 1.96 \\times \\mathrm{SE}_{boot}$)."

  - n: 10
    stem: "A theory-based $t$-test gives $p = 0.002$ for a slope. A simulation-based permutation test gives $p = 0.04$. How to read this disagreement?"
    options:
      a: "One of the tests is wrong"
      b: "Likely a LINE-assumption issue in the theory-based test (heavy-tailed residuals, heteroscedasticity, or both); the simulation-based test makes fewer assumptions and is usually the safer bet when they diverge"
      c: "The data is wrong"
      d: "$p$-values should always agree"
    correct: b
    explanation: "Theory-based inference assumes LINE; when those break, theory $p$-values can be too small (overstate evidence). Simulation/bootstrap methods are asymptotically valid under weaker conditions and are typically the right tiebreaker when the two disagree."

  - n: 11
    stem: "Section 10.5 fits a multi-predictor model on the coffee data. Reading any one slope's $p$-value answers the question:"
    options:
      a: "Whether ALL predictors are useful"
      b: "Whether THIS predictor adds explanatory power BEYOND the others already in the model — the 'partial' contribution"
      c: "Whether the model overall has predictive value"
      d: "What R² is"
    correct: b
    explanation: "Each coefficient's $p$-value is for the partial test: 'after accounting for the other predictors, does this one still add information?' For an 'overall model is useful' question, look at the F-statistic and its $p$-value, not individual coefficients."

  - n: 12
    stem: "In Section 10.6, you build a bootstrap distribution for the coffee model's partial slopes using `specify(...) |> generate(reps = …, type = 'bootstrap') |> fit()`. The width of the resulting CI for each slope:"
    options:
      a: "Will be similar to theory-based CIs when LINE holds, and different when it doesn't"
      b: "Is exactly the same as theory-based"
      c: "Is always wider"
      d: "Is unrelated to the theory-based CI"
    correct: a
    explanation: "When residuals are well-behaved, theory and bootstrap converge — same CI essentially. When residuals are heavy-tailed or heteroscedastic, theory-based CIs miscalibrate and the bootstrap CI is the trustworthy one. The two methods agreeing is itself a piece of LINE diagnostic information."
