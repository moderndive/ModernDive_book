# Slide-deck MCQ variants for Chapter 9 (Hypothesis Testing).
# Scenarios use medical trials, A/B website tests, and food taste tests
# instead of the book's promotions / Spotify / Bob Ross / IMDb examples.

chapter: 9
title: Hypothesis testing

variants:
  - n: 1
    stem: "A drug-trial $p$-value of $p = 0.002$ means:"
    options:
      a: "The drug works with 99.8 % probability"
      b: "IF the drug had no effect (under $H_0$), data this extreme or more extreme would arise just 0.2 % of the time by chance alone"
      c: "The probability the result was due to chance is 0.002"
      d: "The drug has a 0.2 % effect size"
    correct: b
    explanation: "$p$-value = $\\Pr(\\text{data this extreme} \\mid H_0)$ — the conditioning direction matters. (a) reverses it, (c) confuses 'chance' with 'under-the-null', (d) confuses tail probability with effect size."

  - n: 2
    stem: "A *Type I error* in hypothesis testing is:"
    options:
      a: "Failing to reject $H_0$ when it's actually false"
      b: "REJECTING $H_0$ when it's actually true — a 'false positive' / false alarm"
      c: "Computing the p-value wrong"
      d: "Using too small a sample"
    correct: b
    explanation: "Type I = reject true $H_0$ (false alarm). Type II = fail to reject false $H_0$ (missed detection). The significance level $\\alpha$ is the *probability* of a Type I error — you choose $\\alpha = 0.05$ when you're willing to make false alarms 5 % of the time."

  - n: 3
    stem: "A permutation test for 'is there a difference between two groups' computes the $p$-value as the share of *null* statistics at least as extreme as the observed one. For a *two-sided* test:"
    options:
      a: "Use the share more positive than the observed"
      b: "Use the share with |statistic| at least as extreme as |observed| — count both tails"
      c: "Use the smaller tail only"
      d: "Permutation doesn't work two-sided"
    correct: b
    explanation: "Two-sided test: 'difference in either direction is interesting.' Compute $\\Pr(|\\text{null stat}| \\geq |\\text{observed stat}|)$ — fold both tails together. One-sided would take only the direction you specified before seeing data."

  - n: 4
    stem: "A hypothesis test has $\\alpha = 0.05$ and you obtain $p = 0.04$. The correct conclusion:"
    options:
      a: "$H_0$ is definitely false"
      b: "Reject $H_0$ at the $\\alpha = 0.05$ level — the data are unusual enough under $H_0$ to warrant abandoning it; this is a *probabilistic* decision rule, not certainty"
      c: "Fail to reject $H_0$"
      d: "Significance level should be raised"
    correct: b
    explanation: "$p = 0.04 < 0.05$ → reject. But 'reject' doesn't mean 'disprove'. There's still a 4 % chance of seeing data this extreme if $H_0$ were true; we accept that as low enough to act on. A different $\\alpha$ (e.g., 0.01) would change the decision."

  - n: 5
    stem: "A 95 % CI for a parameter $\\theta$ is $(0.8, 4.2)$. Which value of $\\theta_0$ would the test of $H_0 : \\theta = \\theta_0$ FAIL to reject at $\\alpha = 0.05$?"
    options:
      a: "$\\theta_0 = 0$ (outside the CI)"
      b: "$\\theta_0 = 2$ (inside the CI)"
      c: "$\\theta_0 = 5$ (outside the CI)"
      d: "$\\theta_0 = 6$ (outside the CI)"
    correct: b
    explanation: "Duality: a 95 % CI contains exactly the $\\theta_0$ values that a two-sided test at $\\alpha = 0.05$ would FAIL TO REJECT. Inside the CI ↔ data consistent with $\\theta_0$; outside ↔ data would reject $\\theta_0$. This is the bridge between confidence intervals and hypothesis tests."

  - n: 6
    stem: "Increasing the **sample size** in a study primarily affects:"
    options:
      a: "Effect size"
      b: "POWER — the probability of correctly rejecting $H_0$ when $H_0$ is false (more data → more chance to detect a real effect)"
      c: "Significance level"
      d: "Type I error rate"
    correct: b
    explanation: "$\\alpha$ (Type I) is set by you; effect size is a property of reality. Sample size primarily affects POWER ($1 - \\beta$). Larger samples shrink standard errors, making smaller real effects detectable — bigger samples don't change reality, they reveal it more clearly."

  - n: 7
    stem: "A medical team reports a 'statistically significant' new treatment with $p = 0.03$ and $\\alpha = 0.05$. Which is **NOT** an immediate follow-up question?"
    options:
      a: "How big was the effect (effect size)?"
      b: "How was the trial designed (randomized? blinded?)"
      c: "Is the effect clinically meaningful, not just statistically significant?"
      d: "What was the EXACT $p$-value to 10 decimal places?"
    correct: d
    explanation: "Precision of $p$ to 10 decimals tells you nothing useful — what matters is effect size, clinical relevance, study design, and reproducibility. 'Statistical significance' is the START of evaluation, not the end. Even fans of $p$-values reject the $p$-as-decision-totem framing."

  - n: 8
    stem: "A permutation test for 'is there a difference between groups' works by:"
    options:
      a: "Bootstrapping with replacement"
      b: "SHUFFLING (without replacement) the group labels across observations, recomputing the test statistic each time — this physically enforces the null of 'no group difference' on the observed data"
      c: "Adding noise to the data"
      d: "Comparing to a normal distribution"
    correct: b
    explanation: "Permutation = shuffle the group labels. Under $H_0$ (no group difference), any assignment of group labels is exchangeable — so the observed labeling shouldn't produce a more extreme statistic than a random labeling. The fraction of shuffled statistics ≥ observed = the $p$-value."

  - n: 9
    stem: "You run 20 independent hypothesis tests at $\\alpha = 0.05$. ALL 20 nulls are actually TRUE. How many 'significant' results do you expect?"
    options:
      a: "0 (since all nulls are true)"
      b: "ABOUT 1 — at $\\alpha = 0.05$ each test has a 5 % false-alarm rate, so $20 \\times 0.05 = 1$ expected false positive"
      c: "20"
      d: "5"
    correct: b
    explanation: "Each test has a built-in 5 % false-alarm rate; running many tests inflates the chance of at least one false positive. This is the *multiple-comparisons problem* — when you fish 20 times, expect about 1 catch even if no fish are actually there. Bonferroni and FDR corrections exist exactly for this reason."

  - n: 10
    stem: "Two studies report different outcomes: Study A rejects $H_0$ with $p = 0.001$. Study B FAILS to reject with $p = 0.20$. The cleanest comparison:"
    options:
      a: "A is more correct than B"
      b: "A had stronger evidence against THIS null in THIS sample; B's failure to reject doesn't prove the null — could be a real effect that B's sample was too small to detect"
      c: "B disproved the effect"
      d: "B was poorly designed"
    correct: b
    explanation: "Failing to reject is NOT evidence FOR the null. A study with too few observations can produce $p > 0.05$ on a real effect (low power). A and B together suggest looking at SAMPLE SIZES and EFFECT SIZES, not just $p$-values."

  - n: 11
    stem: "An A/B website test shuffled the 'shown control vs. variant' labels across users and recomputed the click-through rate difference 5,000 times. The observed difference of +1.8 pp ranks 47th of 5,001. The $p$-value is approximately:"
    options:
      a: "$47 / 5001 \\approx 0.009$, two-sided after folding the absolute-difference tail"
      b: "$0.05$"
      c: "$1.8 \\%$"
      d: "$5000 / 47$"
    correct: a
    explanation: "Permutation $p$-value = (# null statistics at least as extreme as observed) / (# total). 47 of 5001 null statistics matched-or-exceeded → roughly 0.009 one-sided; the two-sided test folds in the opposite-tail extremes for an answer near 0.018-0.02. Either way, much smaller than 0.05 → reject the null."

  - n: 12
    stem: "A taste-test compares two snack brands and finds 'no significant difference' ($p = 0.43$, $n = 30$). Can you conclude the brands taste the same?"
    options:
      a: "Yes — failure to reject means $H_0$ is true"
      b: "No — failing to reject $H_0$ is NOT evidence FOR $H_0$. The data don't rule out a real difference; with $n = 30$, only big effects would have been detectable"
      c: "Yes, but only with $p > 0.5$"
      d: "Only if $\\alpha = 0.01$"
    correct: b
    explanation: "Absence of evidence is not evidence of absence. A small $n$ + a real-but-modest effect easily produces $p > 0.05$. The honest reading: 'this study didn't find a significant difference; bigger studies or different designs might.' Failure to reject is informative about the test, not about the truth."
