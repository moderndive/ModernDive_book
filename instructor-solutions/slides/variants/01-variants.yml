# Slide-deck MCQ variants for Chapter 1.
#
# Each variant covers the SAME concept as the matching Q in the book's
# `## Quick checks` section, but uses a different example/scenario so the
# in-class poll doesn't duplicate the textbook. The book is the student's
# reference; these are the instructor's classroom retrieval prompts.
#
# Author guidance:
#  - Keep the concept identical (same learning objective being assessed).
#  - Swap the dataset/situation for one students haven't seen in the book.
#  - Keep four options (a–d) with one correct answer.
#  - Wrong options should still encode plausible misconceptions (lift the
#    misconception, change the surface details).
#  - Aim for the same difficulty as the book's Q.
#
# When this file is present, scripts/build_slide_decks.R uses these MCQs
# in place of the book's Quick checks; remove or rename to fall back.

chapter: 1
title: Getting started

variants:
  - n: 1
    stem: "A colleague says they're 'opening Python in PyCharm to run the analysis.' By analogy, what's the equivalent claim in the R world?"
    options:
      a: "'Opening RStudio to use R-Studio'"
      b: "'Opening R in RStudio' — R is the language; RStudio is the IDE"
      c: "'Opening RStudio in R' — R is the IDE; RStudio is the language"
      d: "'Opening R in R' — they're the same thing"
    correct: b
    explanation: "R is to RStudio as Python is to PyCharm: the *language* runs inside an *integrated development environment* that makes writing and inspecting code more pleasant."

  - n: 2
    stem: "An online store records each transaction's `order_id` as a five-digit number like `47291`. Should `order_id` be treated as numerical or categorical?"
    options:
      a: "Numerical, because the values are digits"
      b: "Categorical — it's an identifier, not a measurement; averaging two order IDs is nonsense"
      c: "Numerical, because you could compute the mean of the IDs"
      d: "Both — depends on context"
    correct: b
    explanation: "The test for *numerical* is whether arithmetic on the values is meaningful. Two order IDs don't add up to anything useful — they label distinct orders, just like ZIP codes label distinct postal regions."

  - n: 3
    stem: "Last week you ran `install.packages('readr')` on your laptop. Today you reopen RStudio and want to use `read_csv()`. What do you need to do?"
    options:
      a: "Run `install.packages('readr')` again — installs reset between sessions"
      b: "Run `library(readr)` — the install persists across sessions, but the load doesn't"
      c: "Nothing — `read_csv()` is always available"
      d: "Type `read_csv()` and R will auto-load the package"
    correct: b
    explanation: "*Installing* puts the package on your machine (one-time). *Loading* with `library()` attaches it to your current R session (every session). This is why scripts often start with a block of `library()` calls."

  - n: 4
    stem: "Which of these object names will R **reject**?"
    options:
      a: "`student.grades`"
      b: "`studentGrades`"
      c: "`3rd_quarter_sales`"
      d: "`sales_q3`"
    correct: c
    explanation: "R object names can't start with a digit. `3rd_quarter_sales` errors at parse time; the others all start with a letter (or `.` followed by a non-digit) and are fine."

  - n: 5
    stem: "Both `temperature <- 72` and `temperature = 72` assign 72 to `temperature`. Why does the ModernDive style guide prefer `<-`?"
    options:
      a: "`=` is slower"
      b: "Using `<-` for assignment and `=` for function arguments (e.g., `mean(x, na.rm = TRUE)`) keeps the two roles visually distinct"
      c: "`=` doesn't actually work for assignment"
      d: "`<-` is required by R"
    correct: b
    explanation: "Both work. The convention is *visual*: `<-` for binding a value to a name, `=` for naming arguments. Mixing them up makes code harder to scan but not wrong."

  - n: 6
    stem: "What's the difference between `penguins` and `\"penguins\"` in R?"
    options:
      a: "None"
      b: "`penguins` (no quotes) refers to the OBJECT named `penguins`; `\"penguins\"` (with quotes) is the literal six-character string `penguins`"
      c: "`penguins` works; `\"penguins\"` errors"
      d: "`\"penguins\"` is the data frame; `penguins` is the column"
    correct: b
    explanation: "Quotes turn something into a literal text string. Without quotes, R looks for an object by that name. This is why `library(dplyr)` (no quotes) and `library(\"dplyr\")` (with quotes, special case) both work — `library` accepts either."

  - n: 7
    stem: "Which of these is a *quantitative* variable?"
    options:
      a: "Country of birth"
      b: "Student ID"
      c: "Resting heart rate (beats per minute)"
      d: "Blood type (A, B, AB, O)"
    correct: c
    explanation: "Heart rate has meaningful arithmetic — the average of 60 and 80 is 70 bpm, and that's a real value. The others either identify (ID), label (blood type), or categorise (country)."

  - n: 8
    stem: "A user runs `View(students)` to inspect a data frame, then clicks into a cell and changes the value. What happens to the in-memory `students` object?"
    options:
      a: "It updates with the edits"
      b: "Nothing — `View()` is a read-only display; the spreadsheet pane doesn't write back"
      c: "R errors"
      d: "A new data frame `students_edited` appears in the environment"
    correct: b
    explanation: "`View()` is for inspection only — like opening a CSV in Preview, not in Numbers. To modify the data you have to assign a new version with `<-`."

  - n: 9
    stem: "How does a `tibble` differ from a base R `data.frame`?"
    options:
      a: "A tibble can hold mixed-type columns; a data frame cannot"
      b: "A tibble truncates printing to ~10 rows by default and shows each column's type — the differences are usability, not capability"
      c: "A tibble can be passed to dplyr verbs; a data frame cannot"
      d: "They are identical"
    correct: b
    explanation: "Both can hold mixed types; both work with dplyr. The differences are display (tibble prints fewer rows + column types) and subsetting (tibble's `[` always returns a tibble; data.frame's `[` may simplify to a vector)."

  - n: 10
    stem: "`glimpse(starwars)` reports `87 Rows` and `14 Columns`. Each row of `starwars` represents:"
    options:
      a: "A movie in the franchise"
      b: "**One character** (Luke, Leia, R2-D2, etc.) with their attributes"
      c: "A planet"
      d: "A film appearance"
    correct: b
    explanation: "The *observational unit* — what one row represents — is the most important question to answer about any new dataset. Here each row is one character; `starwars$species` and `starwars$homeworld` are attributes of that character."
