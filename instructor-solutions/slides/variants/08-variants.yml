# Slide-deck MCQ variants for Chapter 8 (Confidence Intervals).
# Scenarios use restaurant tips, commute times, and battery-life data
# instead of the book's pennies / age-at-marriage / Mythbusters yawning.

chapter: 8
title: Confidence intervals

variants:
  - n: 1
    stem: "What does it mean to construct a 95 % confidence interval?"
    options:
      a: "There's a 95 % chance the true value is in the interval"
      b: "If we repeated this study many times and constructed a 95 % CI each time, about 95 % of those CIs would contain the true population value"
      c: "The interval contains 95 % of the data"
      d: "The estimate is 95 % accurate"
    correct: b
    explanation: "The 95 % is a property of the PROCEDURE, not of any one interval. For a particular interval, the true value either IS or ISN'T in it — we just don't know which. Saying 'there's a 95 % chance the truth is in this interval' is the single most common misinterpretation."

  - n: 2
    stem: "In bootstrapping, you generate replicate samples by:"
    options:
      a: "Drawing fresh observations from the population"
      b: "RESAMPLING (with replacement) from your one observed sample, the same size as the original — each bootstrap sample is a 'what if we'd drawn slightly different data?' replicate"
      c: "Simulating from a Normal distribution"
      d: "Permuting the original data"
    correct: b
    explanation: "Bootstrap = resampling YOUR sample, with replacement, $B$ times. Each resample is the same size as the original. The variability across resample-statistics approximates the variability of the statistic across hypothetical fresh samples from the population. No assumption needed about the population's shape."

  - n: 3
    stem: "A wider confidence interval generally means:"
    options:
      a: "More precise estimate"
      b: "LESS precise estimate — more uncertainty about the true parameter (could be a smaller sample, more variability in the data, or both)"
      c: "Better study design"
      d: "Lower confidence level"
    correct: b
    explanation: "CI width is the visual estimate of uncertainty. Wider = less precise (we know less about the parameter); narrower = more precise. Two ways to get a narrower CI without losing confidence level: (1) collect more data (n up), or (2) reduce variability in the measurement (better instrument, more careful protocol)."

  - n: 4
    stem: "As a rough rule, **doubling** your sample size (with everything else unchanged) typically:"
    options:
      a: "Halves the CI width"
      b: "NARROWS the CI by a factor of about $1 / \\sqrt{2} \\approx 1.41$ — not quite half"
      c: "Doesn't change the CI"
      d: "Doubles the CI width"
    correct: b
    explanation: "CI width scales like $1 / \\sqrt{n}$, so doubling $n$ shrinks the CI by $\\sqrt{2} \\approx 1.41$x — about 30 % narrower. To HALVE the CI width you need to QUADRUPLE the sample size. Classic diminishing returns."

  - n: 5
    stem: "To **narrow** a 95 % confidence interval **without changing the data**, you can:"
    options:
      a: "Re-collect data"
      b: "LOWER the confidence level (e.g., 95 % → 80 %) — narrower interval, but you're now less confident the truth is captured"
      c: "Increase the confidence level"
      d: "Nothing — CI width is fixed"
    correct: b
    explanation: "Trade-off: a 95 % CI is wider than an 80 % CI on the same data. Narrowing the interval by lowering the confidence level means accepting more risk that the interval misses. The 'cost-free' way to narrow a CI is to collect more (or better) data."

  - n: 6
    stem: "A 95 % CI for the difference in two group means (Group A − Group B) is $(-2.1, +5.3)$. What can you conclude about the difference?"
    options:
      a: "Group A is clearly higher than Group B"
      b: "Inconclusive — zero is inside the CI, so we CAN'T rule out 'no difference' at the 5 % level; A could be higher, B could be higher, or they could be equal"
      c: "There's no difference"
      d: "Group B is higher"
    correct: b
    explanation: "CIs for differences are read by checking whether zero is inside. If zero is inside, the data are consistent with 'no difference' — we don't reject the null at the corresponding significance level. The CI also gives us a *range of plausible differences*, which is more informative than a binary reject/fail-to-reject decision."

  - n: 7
    stem: "A bootstrap distribution has mean $\\approx$ the original sample's statistic and looks roughly normal. Why does this work for inference?"
    options:
      a: "Coincidence"
      b: "Because the SAMPLING distribution (which we can't directly observe) tends to be normal by CLT, and the BOOTSTRAP distribution from one sample tends to mimic that sampling distribution's shape and spread"
      c: "Because all data is normal"
      d: "It doesn't work"
    correct: b
    explanation: "The bootstrap is essentially asking 'what would the sampling distribution look like, using just my one sample?' Under regularity conditions, the bootstrap distribution converges in shape to the sampling distribution. Center it at the observed statistic and read off percentiles — the resulting CIs are calibrated."

  - n: 8
    stem: "The percentile-method 95 % CI is the (2.5, 97.5) percentiles of the bootstrap distribution. The standard-error method gives:"
    options:
      a: "Exactly the same thing"
      b: "$\\widehat{stat} \\pm 1.96 \\times SE_{boot}$ — using the bootstrap's SD as $SE_{boot}$. Works well when the bootstrap distribution is symmetric and roughly normal"
      c: "A different CI computed from the population"
      d: "Always a wider interval"
    correct: b
    explanation: "Standard-error method = point estimate $\\pm 1.96 \\times \\mathrm{SE}_{boot}$. Same idea as a classical $z$-interval, but with $\\mathrm{SE}$ taken empirically from the bootstrap distribution's SD. Identical to the percentile method when the bootstrap is symmetric and normal; can differ when it's skewed."

  - n: 9
    stem: "A correct, plain-English interpretation of '95 % CI for the mean tip is $(\\$3.50, \\$5.25)$' is:"
    options:
      a: "95 % of all tips are between $3.50 and $5.25"
      b: "We're 95 % confident the population mean tip is between $3.50 and $5.25 — generated by a procedure that covers the truth 95 % of the time across hypothetical re-studies"
      c: "There's a 95 % probability the true mean is in this interval"
      d: "95 % of waiters will earn at least $3.50 per check"
    correct: b
    explanation: "Three traps here: (a) is about the DATA distribution (95 % of observations) not the SAMPLING distribution; (c) reverses the conditioning (the probability is about the procedure, not this one interval); (d) is a per-waiter prediction. (b) is the careful frequentist statement."

  - n: 10
    stem: "A 95 % bootstrap CI for the **difference** in mean commute time (Public Transit − Driving) is $(-3, +12)$ minutes. The cleanest reading:"
    options:
      a: "Driving is clearly faster"
      b: "Inconclusive — zero is in the CI, so the data are consistent with 'no average difference'; transit could plausibly be up to 3 min faster or 12 min slower"
      c: "Transit is clearly faster"
      d: "There's exactly no difference"
    correct: b
    explanation: "When zero is inside a CI for a DIFFERENCE, you can't rule out 'no difference at the population level.' The CI is also informative as a RANGE — the data don't support claims of large differences in either direction beyond what the interval allows."

  - n: 11
    stem: "Section 8.4 (Mythbusters yawning) compared two yawn-rates. A 95 % bootstrap CI for the difference in *population* yawning proportions (control vs. seed) might be $(-0.20, +0.30)$. What does this tell you about the show's headline 'yawning is contagious'?"
    options:
      a: "Confirms the headline"
      b: "Doesn't support it — zero is well inside the CI, so the data are consistent with 'no real difference'; sample sizes were small, leaving lots of uncertainty"
      c: "Disproves it"
      d: "The data was bad"
    correct: b
    explanation: "Mythbusters' study was a small experiment ($n \\approx 50$); the CI accordingly spans a wide range that comfortably includes 'no difference.' One can't *prove* yawning is NOT contagious — only that this study didn't provide convincing evidence FOR contagion. Bigger studies could refine the answer; this one is genuinely inconclusive."
