# Slide-deck MCQ variants for Chapter 6 (Multiple Regression).
# Scenarios use `palmerpenguins` (with species as categorical) and
# `mtcars` instead of the book's exoplanet examples.

chapter: 6
title: Multiple regression

variants:
  - n: 1
    stem: "In a *parallel-slopes* model `lm(body_mass_g ~ bill_length_mm + species, data = penguins)`:"
    options:
      a: "Each species has its own slope and intercept"
      b: "Each species gets its own intercept; the slope on `bill_length_mm` is SHARED across species"
      c: "There's only one line for all species"
      d: "The output is the same as the simple-LR model"
    correct: b
    explanation: "Parallel-slopes (`+`) gives each level of the categorical its own intercept but forces a common slope. Interaction models (`*`) allow each level its own slope AND intercept. Parallel slopes is the right pick when you believe the relationship's *strength* is the same across groups, only the *level* shifts."

  - n: 2
    stem: "In an *interaction* model `lm(mpg ~ hp * cyl_label, data = mtcars)`, what does the interaction term capture?"
    options:
      a: "Just the slope of `hp`"
      b: "How the slope on `hp` DIFFERS across levels of `cyl_label` — i.e., does horsepower's effect on mpg depend on the number of cylinders?"
      c: "The intercept"
      d: "The model's predictive accuracy"
    correct: b
    explanation: "Interaction = the effect of one predictor depends on the level of another. In `y ~ x * group`, the model fits a separate slope for each group; the interaction coefficients describe how each group's slope DIFFERS from the reference group's."

  - n: 3
    stem: "Why might a coefficient *flip sign* when you add a second predictor to a regression model?"
    options:
      a: "Random noise"
      b: "**Simpson's paradox** / confounding — the second predictor was confounded with the first; controlling for it reveals that the within-group relationship goes the opposite direction from the marginal one"
      c: "Mathematical error"
      d: "Coefficients never flip sign"
    correct: b
    explanation: "When predictors are correlated, the marginal effect (one predictor alone) and the partial effect (one predictor controlling for the other) can differ — sometimes dramatically, even flipping sign. Penguin bill length looks negatively related to body mass overall (smaller species have longer bills); within a species it's positively related."

  - n: 4
    stem: "In `lm(body_mass_g ~ bill_length_mm + species, data = penguins)`, the coefficient on `bill_length_mm` represents the change in body mass per:"
    options:
      a: "1 mm increase in bill length, ignoring species"
      b: "1 mm increase in bill length, **holding species fixed** — within any one species, predicted body mass rises by this many grams per extra mm of bill"
      c: "1 g increase in body mass"
      d: "1 unit increase in any predictor"
    correct: b
    explanation: "This is the partial slope — the standard interpretation of a coefficient in multiple regression is 'change in $y$ per unit change in $x$, with all other predictors held fixed.' The 'other predictors held fixed' clause is what distinguishes partial from marginal effects."

  - n: 5
    stem: "A categorical predictor `species` has three levels: `Adelie`, `Chinstrap`, `Gentoo`. After fitting, the output shows TWO species coefficients (e.g., `speciesChinstrap`, `speciesGentoo`). Where is `Adelie`?"
    options:
      a: "It was dropped due to missingness"
      b: "It's the **reference (baseline) level** absorbed into the intercept; the other two coefficients are offsets RELATIVE to Adelie"
      c: "It's hidden — show with `summary()`"
      d: "There must be a bug"
    correct: b
    explanation: "Categorical predictors with $K$ levels add $K-1$ dummy columns to the model; one level is absorbed into the intercept as the baseline. The other levels' coefficients tell you how that group differs from the baseline. R defaults to alphabetical order for the baseline."

  - n: 6
    stem: "Adding a predictor to a regression model can **never** make the sum of squared residuals (the quantity least squares minimizes) larger. True or false?"
    options:
      a: "False — it can go either way"
      b: "True — adding a predictor can only DECREASE (or leave unchanged) the in-sample sum of squared residuals; the worst-case fit is just to set its coefficient to zero, replicating the smaller model"
      c: "True only for orthogonal predictors"
      d: "False — only matters with > 30 observations"
    correct: b
    explanation: "Mathematically: adding a column is a strictly more flexible model. Setting the new coefficient to zero recovers the smaller model exactly, so the optimizer can never do WORSE. This is also why training R² always rises with more predictors — and why we need ADJUSTED R² for honest model comparison."

  - n: 7
    stem: "In `lm(body_mass_g ~ bill_length_mm + flipper_length_mm, data = penguins)`, the two predictors are themselves strongly correlated. What might happen?"
    options:
      a: "The model can't be fit"
      b: "**Multicollinearity**: coefficient estimates become unstable, standard errors inflate, and individual slopes are hard to interpret — though the model's predictions are unaffected"
      c: "The model overfits"
      d: "R refuses to compute"
    correct: b
    explanation: "Multicollinearity inflates individual coefficient standard errors (the model can't decide *which* of the correlated predictors gets credit), but it doesn't bias predictions — the joint effect is still captured. Predictions are fine; per-coefficient interpretation is shaky."

  - n: 8
    stem: "What's the syntactic difference between `lm(y ~ x1 + x2, data)` and `lm(y ~ x1 * x2, data)`?"
    options:
      a: "None"
      b: "`+` is additive (each predictor's effect adds independently → parallel slopes); `*` includes both main effects AND the interaction (each predictor's effect can depend on the other)"
      c: "`*` is multiplication of variables; `+` is addition"
      d: "`+` is older syntax"
    correct: b
    explanation: "In R formula syntax, `*` is *not* multiplication of values — it means 'include both main effects AND the interaction term.' Equivalent to `x1 + x2 + x1:x2`. The `+` form omits the interaction (parallel slopes); `*` form allows interaction (varying slopes)."

  - n: 9
    stem: "When SHOULD you prefer the parallel-slopes model over the interaction model?"
    options:
      a: "Never"
      b: "When a scatterplot (and reasoning) suggest the relationship's *strength* is similar across groups — only the *level* differs. Fewer parameters → tighter CIs, more interpretable."
      c: "Always — interaction models are too complex"
      d: "Only with small samples"
    correct: b
    explanation: "Parsimony principle: a simpler model is easier to interpret and gives tighter CIs *when* the simplification is reasonable. If the slope genuinely varies by group, parallel-slopes is wrong and you should use interaction. Visual + domain knowledge guides the choice."

  - n: 10
    stem: "An interaction model `lm(mpg ~ hp * cyl_label)` reports that 4-cylinder cars have a slope on `hp` 1.5× bigger (in magnitude) than 8-cylinder cars. What does this mean?"
    options:
      a: "4-cyl cars have more horsepower"
      b: "For every extra unit of horsepower, 4-cyl cars' predicted mpg changes 1.5× as much as 8-cyl cars' — the *sensitivity* to horsepower differs by cylinder count"
      c: "The slope is 1.5 mpg/hp"
      d: "4-cyl is the reference level"
    correct: b
    explanation: "Interactions describe how one variable's slope depends on another variable. Here, the per-horsepower-unit change in mpg has different magnitude across cylinder classes — domain-plausible since 4-cyl cars are lighter and feel hp differences more, while 8-cyl cars have heavier baseline mass."
