# Slide-deck MCQ variants for Chapter 11 (Tell Your Story With Data).
# Scenarios use Boston housing, restaurant tips, and gym-membership data
# instead of the book's Seattle house-prices case study.

chapter: 11
title: Tell your story with data

variants:
  - n: 1
    stem: "When a numerical variable like income is *right-skewed* (a long right tail of high values), a common useful transformation is:"
    options:
      a: "$x^2$ (squaring)"
      b: "A logarithm — $\\log_{10}(x)$ or $\\log(x)$ — which compresses the long tail and makes the distribution more symmetric"
      c: "Standardising (z-score)"
      d: "Truncating at the median"
    correct: b
    explanation: "Logs work well on right-skewed positive quantities because they compress the high tail more than the low tail. Income, prices, populations, response times — all classically log-transformed. Resulting variables play nicer with linear regression (residuals more normal, variance more equal)."

  - n: 2
    stem: "What's the most important reason to communicate uncertainty (e.g., confidence intervals) alongside point estimates in a final report?"
    options:
      a: "Statistical conventions demand it"
      b: "Decision-makers need to know how much wiggle room the estimate has — a +$2,000 average effect with CI $(−1,500, +5,500)$ is very different from $+2,000$ with CI $(+1,800, +2,200)$"
      c: "Reports are graded on length"
      d: "It's required by law"
    correct: b
    explanation: "Point estimates without uncertainty give a false sense of precision. The same '+$2,000 average effect' can mean 'we know it pretty well' or 'we hardly know anything' depending on the CI width — and the correct decision differs. Communication of uncertainty is the core deliverable of a statistical analysis, not an afterthought."

  - n: 3
    stem: "Before fitting a regression model on real data, the chapter recommends:"
    options:
      a: "Just run `lm()` and inspect coefficients"
      b: "EDA first — plot the response distribution, check for skew, inspect scatterplots of $y$ vs each predictor, look for outliers and missing values"
      c: "Compute R² right away"
      d: "Use multiple regression even if you only need one predictor"
    correct: b
    explanation: "Exploratory data analysis is mandatory before modeling — you may discover the response needs transformation, a predictor has clusters that interact with the relationship, or there are data-quality issues to address. `lm()` works on garbage too; it's the human's job to notice."

  - n: 4
    stem: "After fitting `lm(log10(price) ~ log10(size), data = housing)` on a Boston housing dataset, the slope is 1.05. What does that slope mean?"
    options:
      a: "Each extra square foot adds $1.05"
      b: "Each 1 % increase in size is associated with a ~1.05 % increase in price (log-log slopes are interpreted as elasticities — percentage-per-percentage)"
      c: "$R^2 = 1.05$"
      d: "It's nonsense"
    correct: b
    explanation: "Log-log regressions yield ELASTICITIES — the slope is the percentage change in $y$ per percentage change in $x$. Very common in economics and engineering: e.g., 1 % more lab-equipment yields 1.05 % more publications. The 'unit' makes interpretation natural across orders of magnitude."

  - n: 5
    stem: "After fitting `lm(log10(price) ~ log10(size) * condition)` to Boston housing and plotting residuals vs fitted values, you see a slight U-shape. What does this suggest?"
    options:
      a: "The model is perfect"
      b: "Linearity in the log-log space is mildly violated — a quadratic in `log10(size)` or a more flexible model might fit better; modest curvature, so the linear model is still informative but not the last word"
      c: "Heteroscedasticity"
      d: "Independence is violated"
    correct: b
    explanation: "Curvature in residuals-vs-fitted = the relationship in $y$ vs $x$ isn't quite linear (even after log-transforming both). Mild curvature → linear is a useful approximation but consider non-linear extensions (splines, polynomials, GAMs). Severe curvature → switch to a non-linear model."

  - n: 6
    stem: "When presenting a fitted regression line to stakeholders alongside the raw data, why is showing the *data points* (not just the line) usually a good idea?"
    options:
      a: "It looks more impressive"
      b: "Data points convey UNCERTAINTY and the FIT QUALITY visually — sparse vs dense regions, outliers, and points scattered around the line are all instantly visible"
      c: "Lines without points are wrong"
      d: "Stakeholders prefer dots"
    correct: b
    explanation: "A line alone projects false confidence; with data points overlaid, the audience sees where the model has lots of support, where it extrapolates, where outliers might be driving the slope. Honest visualisation = data + summary."

  - n: 7
    stem: "A regression uses interaction: `lm(price ~ size * condition, data = housing)`. The interpretation 'for HIGHER-condition houses, price rises FASTER with size' means:"
    options:
      a: "The intercept is higher for higher-condition houses"
      b: "The slope on `size` is LARGER (steeper) for higher-condition houses than for lower-condition houses — each extra sq-ft buys you more price in a higher-condition home"
      c: "Higher-condition houses are more expensive"
      d: "Condition doesn't matter"
    correct: b
    explanation: "Interaction = the slope of one variable depends on the level of another. 'Faster' in the prompt refers to the slope (rate of change), not the intercept (level). Domain-plausible: a sq-ft of marble adds more to price in a luxury home than in a fixer-upper."

  - n: 8
    stem: "Of the data-science pipeline phases (wrangling, visualisation, modeling, communication), which is often the **most time-consuming**?"
    options:
      a: "Modeling"
      b: "WRANGLING — the colloquial '80/20' figure says 80 % of analyst time is spent cleaning/preparing data, 20 % on actual analysis; real datasets are messy"
      c: "Visualisation"
      d: "Communication"
    correct: b
    explanation: "The '80/20' figure is approximate but folkloric — for good reason. Real-world data has missing values, inconsistent encodings, outliers, joins-to-reconcile, time-zone bugs, encoding issues, etc. Tidy-data conventions and reproducible wrangling pipelines aim to shorten this phase."

  - n: 9
    stem: "A stakeholder asks: 'If I list a 2,500 sq-ft house in Boston in average condition, what price should I expect?' Using a fitted Boston-housing case-study model, the cleanest answer is:"
    options:
      a: "Read the predicted price for size = 2,500"
      b: "Compute the point prediction AND a prediction interval — the latter conveys how much variation around the prediction is expected for individual houses; bare point estimates over-promise"
      c: "Refuse to answer"
      d: "Use the mean price of all houses"
    correct: b
    explanation: "Point predictions hide the spread of individual outcomes around the mean. Prediction intervals (wider than confidence intervals, which are for the *average* outcome at given $x$) convey 'a typical individual house at that size will list between X and Y' — the right interval for a single-listing decision."

  - n: 10
    stem: "A reader of your case study asks: 'Could there be a CONFOUNDING variable affecting the relationship you found?' The honest answer is usually:"
    options:
      a: "No — we controlled for it"
      b: "Yes, probably — observational data is full of unmeasured variables. Naming a few plausible candidates and discussing how they might affect interpretation is HONEST, not weak — it tells the reader the limits of what the analysis can claim"
      c: "Only randomised experiments have confounding"
      d: "Statistically impossible"
    correct: b
    explanation: "Observational data + regression coefficients = associations, not causes. Confounding is almost always plausible. Naming specific candidates ('we didn't measure neighborhood school quality, which is plausibly correlated with both house size and price …') and discussing direction-of-bias keeps your analysis honest and useful — and is part of doing data science well."
