# Slide-deck MCQ variants for Chapter 4 (Tidy data).
# Scenarios use a fictional `sales_quarterly` table + `iris` instead of
# the book's `dem_score` / `drinks` / `bob_ross` data.

chapter: 4
title: Tidy data

variants:
  - n: 1
    stem: "A dataset is in *tidy* format when:"
    options:
      a: "It has no missing values"
      b: "Each variable forms a column, each observation forms a row, and each cell holds a single value"
      c: "It's sorted alphabetically"
      d: "It uses the `tibble` class"
    correct: b
    explanation: "Tidy data is a structural concept (one variable per column, one observation per row, one value per cell), not about cleanliness or class. Tidy data plays nicely with ggplot, dplyr, and the rest of the tidyverse because every verb assumes this shape."

  - n: 2
    stem: "What does `pivot_longer()` do to a data frame?"
    options:
      a: "Spreads one column across many"
      b: "Collapses multiple columns into TWO new columns: one for the original column names and one for their values — making 'wide' data 'long'"
      c: "Filters rows"
      d: "Adds new columns"
    correct: b
    explanation: "`pivot_longer()` is for the 'spreadsheet-style' situation where columns encode a variable (e.g., one column per year, or one column per indicator). It stacks those columns into a single `name`-`value` pair, increasing rows and decreasing columns."

  - n: 3
    stem: "When would you use `readr::read_csv()` instead of base R's `read.csv()`?"
    options:
      a: "They are identical"
      b: "`read_csv()` is faster, doesn't auto-convert strings to factors, returns a tibble with column-type inference, and shows a progress bar for large files"
      c: "`read_csv()` is the only one that reads CSVs"
      d: "`read.csv()` is for `.csv.gz` files"
    correct: b
    explanation: "Both read CSVs; `readr::read_csv()` from the tidyverse is generally faster and friendlier (better default behavior). For most modern R workflows, `read_csv()` is the recommended starting point."

  - n: 4
    stem: "A `sales_quarterly` table has columns `region`, `Q1`, `Q2`, `Q3`, `Q4` — revenue per region per quarter. Why is this NOT tidy?"
    options:
      a: "It is tidy"
      b: "The four quarter columns encode the SAME variable (the quarter); a tidy version has columns `region`, `quarter`, `revenue`"
      c: "It has too many rows"
      d: "It needs `na.rm = TRUE`"
    correct: b
    explanation: "Whenever column NAMES encode a variable's values (Q1, Q2, … are values of the variable 'quarter'), the data is wide — not tidy. Use `pivot_longer(cols = Q1:Q4, names_to = 'quarter', values_to = 'revenue')` to fix."

  - n: 5
    stem: "When using `pivot_longer()`, what does the `names_to` argument do?"
    options:
      a: "Names the new value column"
      b: "Names the new column that will hold the OLD column-name labels (the values that used to be column names)"
      c: "Renames the data frame"
      d: "Specifies which columns to pivot"
    correct: b
    explanation: "`names_to` is the name of the new column that holds the OLD column NAMES. `values_to` names the column that holds the OLD column VALUES. Together they unpack 'columns as a variable' into a proper two-column representation."

  - n: 6
    stem: "After `pivot_longer()`, the resulting data frame typically has:"
    options:
      a: "Fewer rows"
      b: "MORE rows (one per [original-row, pivoted-column] combination) and FEWER columns"
      c: "The same shape"
      d: "More NAs"
    correct: b
    explanation: "If you pivot K columns into longer form, each original row becomes K rows (one per pivoted column). Width goes down, height goes up by a factor of K. The data is the same — just reshaped."

  - n: 7
    stem: "`read_csv('data.csv')` errors with `could not find function 'read_csv'`. The most likely cause is:"
    options:
      a: "The file is missing"
      b: "`readr` is installed but not loaded — run `library(readr)` (or `library(tidyverse)`) first"
      c: "The CSV is malformed"
      d: "`read_csv` is deprecated"
    correct: b
    explanation: "'could not find function' means R doesn't know the name — almost always because the package that provides it isn't loaded. Installing puts the function on your machine; `library()` makes it usable in the current session."

  - n: 8
    stem: "A table has `country` (string), `population` (number), and `is_un_member` (TRUE/FALSE). How many *variables* and *observations* does it have if there are 200 rows?"
    options:
      a: "3 variables, 200 observations"
      b: "200 variables, 3 observations"
      c: "600 variables, 1 observation"
      d: "Depends on the data type"
    correct: a
    explanation: "Variables are the columns (country, population, is_un_member — three of them). Observations are the rows (200 countries). 'Variable' is a measured/recorded property; 'observation' is one entity you measured those properties on."

  - n: 9
    stem: "Is 'wide format' always wrong?"
    options:
      a: "Yes — tidy is always the right choice"
      b: "No — wide is often preferable for human-readable summary tables and many statistical procedures (e.g., the input to `cor()`); tidy is preferred for ggplot2 + dplyr operations"
      c: "Wide doesn't exist in modern R"
      d: "Only wide works in Excel"
    correct: b
    explanation: "Tidy is a *programming* convenience; humans often find wide easier to scan. Many R functions (e.g., correlation matrices) want wide input. The skill is being able to move between the two with `pivot_longer()` / `pivot_wider()`."

  - n: 10
    stem: "`library(tidyverse)` loads which packages (among others)?"
    options:
      a: "Only `ggplot2`"
      b: "A curated set: `ggplot2`, `dplyr`, `tidyr`, `readr`, `purrr`, `tibble`, `stringr`, `forcats`"
      c: "Every R package on your machine"
      d: "Just `tidyr`"
    correct: b
    explanation: "`tidyverse` is a *meta-package* — calling `library(tidyverse)` is shorthand for attaching the eight core packages above. Each is also installable / loadable individually."
