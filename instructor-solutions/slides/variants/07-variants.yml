# Slide-deck MCQ variants for Chapter 7 (Sampling).
# Scenarios use coin flips, dice rolls, and a fictional "library checkouts"
# population instead of the book's red-balls / volcanoes / exoplanets.

chapter: 7
title: Sampling

variants:
  - n: 1
    stem: "The *sampling distribution* of a statistic describes:"
    options:
      a: "The distribution of values in one sample"
      b: "The distribution of the statistic across MANY hypothetical samples of the same size drawn from the population"
      c: "The population distribution"
      d: "A bootstrap distribution"
    correct: b
    explanation: "Sampling distribution = distribution of a SAMPLE STATISTIC (like $\\bar{x}$) over many imagined re-samples from the same population. The data distribution describes individual values in one sample; the sampling distribution describes the variability you'd see in the STATISTIC if you repeated the sampling many times."

  - n: 2
    stem: "As sample size $n$ increases, the standard error (SE) of the sample mean:"
    options:
      a: "Increases proportional to $n$"
      b: "Decreases proportional to $1 / \\sqrt{n}$ — larger samples give tighter sampling distributions"
      c: "Stays constant"
      d: "Increases proportional to $\\sqrt{n}$"
    correct: b
    explanation: "$\\mathrm{SE}(\\bar{x}) = \\sigma / \\sqrt{n}$. To halve the SE you need to QUADRUPLE the sample size — the diminishing-returns nature of precision is why huge polls reach a 'pretty good' MOE but rarely pursue 'extremely good.'"

  - n: 3
    stem: "The Central Limit Theorem says:"
    options:
      a: "The data must be normal"
      b: "For large enough $n$, the SAMPLING DISTRIBUTION of $\\bar{x}$ is approximately normal — even when the underlying population isn't normal"
      c: "The population mean equals the sample mean"
      d: "Confidence intervals are exact"
    correct: b
    explanation: "CLT is about the distribution of the SAMPLE MEAN, not the data. Even with a skewed or bimodal population, $\\bar{x}$ becomes approximately normal as $n$ grows. This is why so much classical inference (t-tests, z-intervals) 'works' on non-normal data — once $n$ is large enough."

  - n: 4
    stem: "A population of library-checkout-counts-per-month is HEAVILY right-skewed (most patrons check out 0-5 books; a few power-users check out 80+). According to CLT, the sampling distribution of $\\bar{x}$ for $n = 50$ patrons:"
    options:
      a: "Will be right-skewed like the population"
      b: "Will be APPROXIMATELY NORMAL despite the population's skew — that's what CLT promises"
      c: "Won't exist"
      d: "Will be bimodal"
    correct: b
    explanation: "The exact 'large enough $n$' for CLT to kick in depends on how skewed the population is. For very heavy skew you might need $n > 100$; for mild skew $n > 30$ often suffices. The KEY point is that the SAMPLING distribution's shape comes to NORMAL even when the population's doesn't."

  - n: 5
    stem: "You roll a fair die 30 times, average the results, and repeat the whole process 1,000 times. The histogram of those 1,000 averages is centered approximately:"
    options:
      a: "At 1"
      b: "At the population mean of a fair die roll, 3.5"
      c: "At 6"
      d: "Anywhere — random"
    correct: b
    explanation: "The expected value of $\\bar{X}$ equals the population mean — that's *unbiasedness*. For a fair die, the population mean is $(1+2+3+4+5+6)/6 = 3.5$, so the sampling distribution of $\\bar{X}$ is centered there."

  - n: 6
    stem: "To **halve** the standard error of the sample mean (e.g., go from SE = 4 to SE = 2), you need to:"
    options:
      a: "Double the sample size"
      b: "QUADRUPLE the sample size (because SE shrinks like $1 / \\sqrt{n}$)"
      c: "Halve the population SD"
      d: "Halve the sample size"
    correct: b
    explanation: "$\\mathrm{SE} = \\sigma / \\sqrt{n}$. Halving SE requires $\\sqrt{n}$ to double — i.e., $n$ to quadruple. This is the fundamental diminishing-returns cost of precision in sampling."

  - n: 7
    stem: "A 'sample statistic' is:"
    options:
      a: "A property of the population (e.g., $\\mu$)"
      b: "A number computed from the data in ONE sample (e.g., $\\bar{x}$, $\\hat{p}$)"
      c: "The size of the sample"
      d: "The standard error"
    correct: b
    explanation: "Statistic = function of the data in one sample. Parameter = fixed (often unknown) feature of the population. $\\bar{x}$ (sample mean) is a statistic; $\\mu$ (population mean) is a parameter. We use the former to estimate the latter."

  - n: 8
    stem: "The notation $\\widehat{p}$ refers to:"
    options:
      a: "The population proportion"
      b: "The SAMPLE proportion — an estimate of the population proportion $p$ computed from sample data"
      c: "The standard error"
      d: "The p-value"
    correct: b
    explanation: "Statistical convention: Greek letters ($\\mu$, $\\sigma$, $p$) for population parameters; Latin letters with hats ($\\bar{x}$, $s$, $\\hat{p}$) for sample estimates. The hat reminds you 'this is an estimate, not the truth.'"

  - n: 9
    stem: "Why is sampling **without replacement** usually preferred for collecting real-world data?"
    options:
      a: "It's faster"
      b: "It avoids selecting the same individual twice, which would inflate apparent agreement and waste resources — each new draw adds NEW information"
      c: "Theoretical reasons; with-replacement is fine"
      d: "It's the only valid method"
    correct: b
    explanation: "In practice we want each observation to count once and add information. (Sampling WITH replacement is essential for the BOOTSTRAP, where we deliberately resample WITH replacement to mimic 'what if we'd sampled differently?'.)"

  - n: 10
    stem: "A poll of 200 voters reports 52 % support for candidate A. The TRUE population proportion happens to be 50 %. What's most surprising or unsurprising about the 52 % result?"
    options:
      a: "Unsurprising — 52 % is well within the natural sampling variability around 50 % at $n = 200$ (SE $\\approx \\sqrt{0.5 \\times 0.5 / 200} \\approx 3.5$ pp)"
      b: "Surprising — the poll must be biased"
      c: "Surprising — the true value should be 52 %"
      d: "Impossible"
    correct: a
    explanation: "Sampling variability means even a perfect (unbiased) poll of 200 will rarely hit the true 50 % exactly. A standard error around 3.5 percentage points means 52 % is well within '1 SE of truth'. This is exactly why confidence intervals and 'margin of error' matter."
