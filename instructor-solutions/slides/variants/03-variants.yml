# Slide-deck MCQ variants for Chapter 3 (Wrangling).
# Scenarios use `starwars`, `storms`, `band_members` / `band_instruments`
# instead of the book's `flights` examples.

chapter: 3
title: Wrangling

variants:
  - n: 1
    stem: "Which `dplyr` verb keeps only the rows of `starwars` where `species == 'Human'`?"
    options:
      a: "`select()`"
      b: "`filter()`"
      c: "`mutate()`"
      d: "`group_by()`"
    correct: b
    explanation: "`filter()` keeps rows that meet a logical condition. `select()` keeps columns; `mutate()` creates new columns; `group_by()` partitions rows for a subsequent verb."

  - n: 2
    stem: "What does this pipeline return?  ```r\nstorms |>\n  group_by(category) |>\n  summarize(avg_wind = mean(wind, na.rm = TRUE))\n```"
    options:
      a: "One row per storm with the average wind"
      b: "One row PER CATEGORY with the average wind across storms in that category"
      c: "A vector of length `nrow(storms)`"
      d: "An error"
    correct: b
    explanation: "`group_by() |> summarize()` collapses rows to one per group. Here the grouping variable is `category`, so you get one row per category and a summary statistic computed within each category."

  - n: 3
    stem: "Why do many `summarize()` calls include `na.rm = TRUE`?"
    options:
      a: "Performance — it makes the calculation faster"
      b: "Functions like `mean()` and `median()` return `NA` if any input value is `NA`; `na.rm = TRUE` drops missings before computing"
      c: "It's required syntax"
      d: "It silences warnings"
    correct: b
    explanation: "R is conservative about missing data: any arithmetic involving `NA` returns `NA`. `na.rm = TRUE` says 'ignore missings for THIS computation' — but doesn't remove rows from your data frame."

  - n: 4
    stem: "What's the difference between `filter(storms, category == 5)` and `filter(storms, category = 5)`?"
    options:
      a: "None"
      b: "`==` is comparison (keep rows where category equals 5); `=` is assignment / argument-naming (R treats it as naming the `category` argument)"
      c: "`==` only works for strings"
      d: "`=` is the older syntax"
    correct: b
    explanation: "`==` tests equality and returns `TRUE`/`FALSE`. `=` in this position would try to bind 5 to an argument named `category` — which `filter()` doesn't have, so you'd get an error or a wrong result. The single-vs-double-equals confusion is one of R's most common gotchas."

  - n: 5
    stem: "After running `storms |> mutate(wind_kmh = wind * 1.852)` *without* assigning the result, the `storms` data frame:"
    options:
      a: "Now has a `wind_kmh` column"
      b: "Is unchanged — without `<-`, the result is computed and immediately discarded"
      c: "Errors"
      d: "Is silently overwritten"
    correct: b
    explanation: "dplyr verbs are pure — they return a NEW data frame and never modify the input. Without `storms <- storms |> mutate(...)` (or a new name), the result prints and is discarded. R's environment is unchanged."

  - n: 6
    stem: "`starwars |> arrange(height)` returns rows sorted ascending by height. The first row is most likely:"
    options:
      a: "The tallest character"
      b: "The shortest character (Yoda, R2-D2, etc.)"
      c: "A random row"
      d: "The character with `NA` height"
    correct: b
    explanation: "`arrange()` defaults to ascending order. To sort descending, wrap in `desc()`: `arrange(desc(height))`. Rows with `NA` are placed at the END by default in dplyr."

  - n: 7
    stem: "`band_members |> inner_join(band_instruments, by = 'name')` returns:"
    options:
      a: "All rows from both tables"
      b: "Only rows where the `name` value appears in BOTH tables (the intersection on `name`), with columns from both"
      c: "Only rows from `band_members`"
      d: "An error"
    correct: b
    explanation: "`inner_join` returns the intersection on the join key — rows where `name` exists in BOTH inputs, with columns from both. `left_join` would keep everyone in `band_members` (NAs where no instrument match); `full_join` keeps everyone from both."

  - n: 8
    stem: "`storms |> filter(wind > 100 | pressure < 950)` returns rows where:"
    options:
      a: "Wind > 100 AND pressure < 950"
      b: "Wind > 100 OR pressure < 950 (or both)"
      c: "Wind > 100 XOR pressure < 950 (exactly one)"
      d: "Wind > 100 only"
    correct: b
    explanation: "`|` is inclusive OR. Use `&` for AND. The pipe-character vs `||` distinction: `|` is vectorised (operates element-by-element across the column), `||` is scalar (short-circuits to one value). For dplyr filter conditions, you almost always want `|`."

  - n: 9
    stem: "After `starwars |> group_by(species)`, what visible change happens to the data frame?"
    options:
      a: "Rows are reordered"
      b: "Almost nothing — the data still prints normally, but a 'Groups: species [N]' tag appears at the top; subsequent verbs operate per-group"
      c: "It collapses to one row per species"
      d: "An error"
    correct: b
    explanation: "`group_by()` is structural metadata, not a data operation. It tells the data frame 'partition by species for the next verb.' You see the change when you pipe into `summarize()`, `mutate()`, etc. — each grouping computes separately."

  - n: 10
    stem: "Compare these two pipelines on `storms`:\n\n* (i) `storms |> filter(category == 5) |> summarize(avg_wind = mean(wind))`\n* (ii) `storms |> group_by(category) |> summarize(avg_wind = mean(wind))`\n\nWhich is correct?"
    options:
      a: "(i) returns one row with the avg wind for cat-5 storms only"
      b: "(ii) returns one row per category with avg wind in each"
      c: "Both are correct — they answer different questions"
      d: "Both are wrong; you need both `filter` and `group_by`"
    correct: c
    explanation: "Pipeline (i) restricts to category 5 then computes ONE average. Pipeline (ii) computes the average within EACH category. Both are valid R; which one you want depends on the question — 'avg wind in cat-5 storms' is (i); 'avg wind by category, including cat-5' is (ii)."
