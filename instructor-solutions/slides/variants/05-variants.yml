# Slide-deck MCQ variants for Chapter 5 (Simple Linear Regression).
# Scenarios use the `palmerpenguins` data (bill_length, body_mass, species)
# instead of the book's `bball` / `UN_data_ch5`.

chapter: 5
title: Simple linear regression

variants:
  - n: 1
    stem: "In `lm(body_mass_g ~ bill_length_mm, data = penguins)`, what does the **slope** coefficient represent?"
    options:
      a: "The average penguin body mass"
      b: "The change in body mass (g) associated with a one-mm increase in bill length"
      c: "The predicted body mass when bill length is zero"
      d: "The correlation coefficient"
    correct: b
    explanation: "The slope is *change in $y$ per one-unit change in $x$* — units are response-units divided by predictor-units. Here, grams per millimeter. The intercept is the prediction at $x = 0$ (often nonsensical to interpret); $\\bar{y}$ is the average response; correlation is unitless."

  - n: 2
    stem: "A *residual* in linear regression is:"
    options:
      a: "The slope coefficient"
      b: "The difference between an observed $y$ and the fitted (predicted) $\\hat{y}$ from the line — i.e., $y - \\hat{y}$, the part the model didn't capture"
      c: "The R-squared value"
      d: "The standard error of the slope"
    correct: b
    explanation: "Residual = observed − fitted. Positive residual = the model under-predicted that observation; negative = over-predicted. Least-squares regression chooses the slope/intercept that minimize the sum of squared residuals."

  - n: 3
    stem: "A correlation of $r = +0.85$ between `bill_length_mm` and `body_mass_g` in penguins means:"
    options:
      a: "Bill length CAUSES body mass"
      b: "Strong positive linear association — longer-billed penguins tend to be heavier; an 85 % perfect linear fit by an informal benchmark"
      c: "The slope is 0.85"
      d: "85 % of penguins have longer-than-average bills"
    correct: b
    explanation: "Correlation is a unitless number between −1 and 1 measuring linear association. $|r|$ closer to 1 = stronger linear trend; sign = direction. $r$ doesn't tell us anything about CAUSE — just about co-variation."

  - n: 4
    stem: "A regression of `body_mass_g` on `bill_length_mm` produces an intercept of −1500 g. Should you read this as 'penguins with zero bill length weigh −1500 g'?"
    options:
      a: "Yes — that's literally what the intercept says"
      b: "No — bill length zero is far outside the observed range (penguins have ~30-60 mm bills); extrapolating the line that far isn't justified"
      c: "Yes, but only if r > 0.9"
      d: "No — the intercept has no interpretation"
    correct: b
    explanation: "Intercepts are mathematical objects defined at $x = 0$. Whether $x = 0$ corresponds to a real, observable scenario in your data determines whether the intercept has a sensible interpretation. For bill length, $x = 0$ is far outside any real penguin — extrapolation."

  - n: 5
    stem: "For one penguin, the **observed** body mass is $y = 4{,}200$ g and the **fitted** value from `lm(body_mass_g ~ bill_length_mm)` is $\\hat{y} = 3{,}900$ g. The residual is:"
    options:
      a: "$+300$ g — the model under-predicted by 300 g"
      b: "$-300$ g"
      c: "$4{,}200 / 3{,}900$"
      d: "$0$"
    correct: a
    explanation: "Residual = observed − fitted = $4{,}200 - 3{,}900 = +300$. Sign of the residual is the direction of the model's miss: positive = observed is *above* the line = model under-predicted; negative = observed is *below* = over-predicted."

  - n: 6
    stem: "A regression of `body_mass_g` on `bill_length_mm` has slope 90. The correct interpretation:"
    options:
      a: "Bill length is 90 times more important than body mass"
      b: "For each additional 1 mm of bill length, predicted body mass is 90 g higher"
      c: "Body mass is 90 g"
      d: "The model has 90 % accuracy"
    correct: b
    explanation: "Slope = predicted change in $y$ per unit change in $x$, and it carries units (grams/millimeter here). The plain-English template: 'for each additional one [unit-of-x] of [x-name], predicted [y-name] is [slope] [units] higher.'"

  - n: 7
    stem: "A correlation of $r = 0.95$ between `bill_length_mm` and `body_mass_g` guarantees:"
    options:
      a: "A strong CAUSAL relationship"
      b: "A strong LINEAR association — no causal claim, and a strong NON-linear pattern could still hide here"
      c: "That body mass is normally distributed"
      d: "That the slope is 0.95"
    correct: b
    explanation: "Correlation measures linear association strength only. $r = 0.95$ is strong evidence of a strong straight-line relationship in your data — not evidence of causation, and not evidence that a curve wouldn't fit even better."

  - n: 8
    stem: "A scatterplot of two variables shows a clean inverted-U shape (rises then falls). You compute correlation and get $r \\approx 0$. Why is this misleading?"
    options:
      a: "$r = 0$ means no relationship, period"
      b: "$r$ only captures LINEAR association — a perfectly symmetric inverted-U has zero linear trend even though there's a strong nonlinear relationship"
      c: "The data is bimodal"
      d: "The correlation formula is wrong"
    correct: b
    explanation: "Correlation is the slope of the best-fit line; symmetric nonlinearity (U-shape, inverted-U, sine wave) integrates to zero linear trend. Always plot before trusting $r$ alone — Anscombe's quartet is the canonical demo of this trap."

  - n: 9
    stem: "'Least squares' regression chooses the slope and intercept that:"
    options:
      a: "Maximize correlation"
      b: "Minimize the SUM OF SQUARED residuals — each miss is squared so positive and negative cancel and big misses are penalised quadratically"
      c: "Minimize the sum of residuals"
      d: "Minimize the maximum residual"
    correct: b
    explanation: "Least-squares minimises $\\sum (y_i - \\hat{y}_i)^2$. Squaring (1) ensures positive and negative misses don't cancel, and (2) penalises a few big misses more than many small misses. It also gives a closed-form solution — no iteration needed."

  - n: 10
    stem: "In `lm(body_mass_g ~ sex, data = penguins)` (a regression with one categorical predictor, levels `female`/`male`), the **fitted value** for a male penguin equals:"
    options:
      a: "Intercept × Slope"
      b: "Intercept + Slope-on-`sexmale` — i.e., the MEAN body mass of male penguins in the data"
      c: "Just the intercept"
      d: "The grand mean across both sexes"
    correct: b
    explanation: "With one categorical predictor, the model literally returns the group mean for each level. The 'slope' on `sexmale` is the *offset* from the reference level (female): female mean = intercept; male mean = intercept + slope. This makes group-mean comparison and linear regression equivalent."
