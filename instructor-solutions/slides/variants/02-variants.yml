# Slide-deck MCQ variants for Chapter 2 (Visualization).
# Scenarios use `penguins`, `mpg`, `diamonds` instead of the book's
# `flights`/`gapminder`/`weather` so class doesn't re-run textbook examples.

chapter: 2
title: Visualization

variants:
  - n: 1
    stem: "In `ggplot(penguins, aes(x = bill_length_mm, y = body_mass_g)) + geom_point()`, which piece of the grammar of graphics tells `ggplot2` *what kind* of mark to draw?"
    options:
      a: "`aes()` — the aesthetic mapping"
      b: "`geom_point()` — the geometric object"
      c: "`penguins` — the data layer"
      d: "`ggplot()` — the chart constructor"
    correct: b
    explanation: "The `geom_*()` family decides whether you draw points, lines, bars, etc. `aes()` is the mapping (which variable goes to which channel); `ggplot()` initialises the plot; the data is just the source."

  - n: 2
    stem: "Why does `ggplot(data = mpg, mapping = aes(x = displ, y = hwy))` (no `+ geom_*`) produce a blank plot?"
    options:
      a: "The data is empty"
      b: "Without a `geom_*` layer ggplot2 doesn't know which mark to draw — the data + mapping define the *what*, the geom defines the *how*"
      c: "`displ` is non-numeric"
      d: "`ggplot` requires at least one filter call first"
    correct: b
    explanation: "ggplot draws the canvas with the right axes, but a `geom_*()` layer is what actually plots marks. Until you add one, the panel is empty by design."

  - n: 3
    stem: "Which named graph is most appropriate for showing the *distribution* of a single numerical variable?"
    options:
      a: "Scatterplot"
      b: "Histogram"
      c: "Side-by-side boxplot"
      d: "Bar chart"
    correct: b
    explanation: "Histograms (and density plots) show a single numerical variable's distribution. Scatterplots show pairs of numerical variables; boxplots compare distributions across groups; bar charts count categorical observations."

  - n: 4
    stem: "A student writes `geom_point(aes(color = 'red'))` expecting all points to be red. Instead they get a legend titled `'red'` and a single colour from the default palette. What happened?"
    options:
      a: "ggplot doesn't recognise 'red' as a colour"
      b: "Anything inside `aes()` is treated as a data-driven mapping; for a constant cosmetic choice the argument belongs OUTSIDE `aes()`, e.g., `geom_point(color = 'red')`"
      c: "You need `theme(color = 'red')` instead"
      d: "Quotes are required around `color`"
    correct: b
    explanation: "Inside `aes()`, every argument is a *mapping from data* — even a literal string becomes a one-level categorical variable. Cosmetic choices that don't depend on data go OUTSIDE `aes()`."

  - n: 5
    stem: "What's the difference between `geom_bar()` and `geom_col()` in ggplot2?"
    options:
      a: "They're identical aliases"
      b: "`geom_bar()` counts rows in each category (`stat = 'count'`); `geom_col()` plots a pre-computed `y` value verbatim (`stat = 'identity'`)"
      c: "`geom_bar()` is for numeric `y`; `geom_col()` is for character `y`"
      d: "`geom_col()` is deprecated"
    correct: b
    explanation: "Use `geom_bar()` when you want ggplot to count for you (one bar per category, height = count). Use `geom_col()` when you've already computed the heights (e.g., from a `summarize()`) and just want them drawn."

  - n: 6
    stem: "A donut chart shows revenue share for six product lines, with slices ranging from 12% to 19%. The chapter argues this is a poor choice. Why?"
    options:
      a: "Donut charts are unreadable on phones"
      b: "Humans are bad at comparing arc lengths and angles; a bar chart of the same six values is much easier to read accurately"
      c: "Donut charts require Adobe Illustrator"
      d: "ggplot2 can't draw donut charts"
    correct: b
    explanation: "Position-along-a-common-scale (a bar chart) is the most accurate visual encoding; angle/area (pie & donut) are among the least accurate. Six similar slices are exactly the worst case for a donut."

  - n: 7
    stem: "In `ggplot()`, why must the `+` come at the **end** of a line, not at the **beginning** of the next?"
    options:
      a: "Style preference — both work"
      b: "R evaluates one line at a time; an unfinished expression must end with an operator so R knows to keep reading"
      c: "`+` is reserved for arithmetic; `&` is the ggplot operator"
      d: "RStudio errors on leading `+`"
    correct: b
    explanation: "R's parser decides a statement is complete when a line ends *without* an operator that demands more input. Trailing `+` signals 'keep reading'; leading `+` on the next line is too late — R has already evaluated the first line on its own."

  - n: 8
    stem: "A scatterplot of `bill_length_mm` vs `body_mass_g` in `penguins` shows a dense black cluster of overlapping points. Which technique does **NOT** address overplotting?"
    options:
      a: "Set `alpha = 0.3` so overlapping points darken cumulatively"
      b: "Switch to `geom_jitter()` to perturb positions slightly"
      c: "Increase `size = 5` on `geom_point()`"
      d: "Use `geom_hex()` to bin into hexagonal cells"
    correct: c
    explanation: "Bigger points make the overplotting WORSE, not better. Transparency, jittering, and hex/2d binning all help by revealing density; sizing up just deepens the blob."

  - n: 9
    stem: "What does `+ facet_wrap(~ species)` do to a `penguins` plot?"
    options:
      a: "Filters to one species"
      b: "Splits the plot into one panel per `species` value, with shared axes — easy comparison across groups"
      c: "Colors points by species"
      d: "Adds a legend"
    correct: b
    explanation: "Faceting creates a small-multiples layout: one panel per level of the faceting variable. Same axes across panels means visual comparison is honest. `color = species` would put everyone on one panel; `facet_wrap` separates them."

  - n: 10
    stem: "In a side-by-side boxplot of `body_mass_g` by `species` for `penguins`, you see a few isolated dots above and below the whiskers. What are these?"
    options:
      a: "Errors in the data — they should be deleted"
      b: "Outliers (by ggplot's default rule, points more than 1.5×IQR from the box) — they're shown individually instead of being absorbed into a whisker"
      c: "Means of each group"
      d: "Sample-size indicators"
    correct: b
    explanation: "ggplot's boxplots draw the IQR box and whiskers out to 1.5×IQR. Points beyond that are shown as individual dots so you can see them; they're not 'errors' — they're real observations the boxplot summary chose not to absorb."
