# Instructor-authored EXTRAS pool for the exam bank.
#
# Questions beyond the book's `## Quick checks` and end-of-chapter exercises —
# anything you want to test that the book doesn't already assess. Use this
# for: applied scenarios, written-response items, real-world data
# interpretation tasks, "explain to a non-statistician" prompts, etc.
#
# `build_exam_bank.R` reads this file (if present) and mixes the items into
# the appropriate exam templates by chapter. MCQs join Section A (concepts);
# short and essay items join Section B (free response).
#
# Schema per item:
#   chap:       1..11 — which chapter the question targets
#   kind:       mcq | short | essay
#   difficulty: 1 (★, 1 pt), 2 (★★, 2 pts), 3 (★★★, 3 pts)
#   prompt:     question text (markdown supported, including $...$ math)
#   options:    a/b/c/d (only if kind: mcq)
#   correct:    a | b | c | d (only if kind: mcq)
#   rubric:     short instructor-only grading note (optional, shown on
#               the exam-bank page; staticrypt-encrypted in deploy)
#
# Edit this file directly; the next build picks up your additions. Add as
# many items as you like — the sampler will fold them into the relevant
# templates automatically.

items:
  - chap: 2
    kind: short
    difficulty: 2
    prompt: |-
      A non-technical colleague sends you a pie chart of website traffic by
      country (35 country slices). Briefly justify why a bar chart sorted
      by traffic share would be a better choice, and sketch how you'd
      describe the conversion in one sentence to them.
    rubric: |-
      Look for: angles/arcs hard to compare across many similar slices;
      bars give common baseline; sorting reveals ranking instantly.

  - chap: 5
    kind: short
    difficulty: 2
    prompt: |-
      A news headline reads: "Study finds that for every additional hour
      of weekly exercise, life expectancy rises by 0.4 years." Identify
      (a) the explanatory variable, (b) the outcome variable, (c) the
      slope's units, and (d) one reason this *correlational* slope
      shouldn't be read as a causal effect.
    rubric: |-
      (a) Hours of weekly exercise (b) Life expectancy in years
      (c) Years per (hour-per-week) (d) Confounding: people who exercise
      also tend to have access to better healthcare, eat better, etc. —
      pre-existing differences, not the exercise itself.

  - chap: 8
    kind: essay
    difficulty: 3
    prompt: |-
      A reporter writes: "The poll found 52 % of voters favor candidate
      A, with a margin of error of 3 percentage points." A reader asks
      what that "margin of error" actually means. In 3-5 sentences,
      explain what's behind the number — refer to the bootstrap idea
      from the chapter, what 95 % confidence means, and at least one
      common misinterpretation to avoid.
    rubric: |-
      Should mention: (1) MoE is the half-width of a CI; (2) "95 %
      confident" is a statement about the long-run behavior of the
      *procedure* (95 % of CIs constructed this way would cover the
      true value), NOT the probability the true value is in this
      particular interval; (3) bootstrap / normal-approximation
      simulates what would happen across many hypothetical re-polls.
      Common misinterpretation: "there's a 95 % chance the true value
      is between 49 % and 55 %" — wrong; the true value is fixed.

  - chap: 9
    kind: mcq
    difficulty: 2
    prompt: |-
      A drug trial reports $p = 0.001$ for "the new drug works better
      than placebo." The most accurate plain-English reading is:
    options:
      a: "There's a 99.9 % chance the new drug actually works."
      b: "If the new drug truly didn't work, we'd expect data this extreme by chance less than 1 in 1000 times."
      c: "The probability that the result was due to chance is 0.001."
      d: "The treatment effect is very large."
    correct: b
    rubric: |-
      Standard p-value framing: probability of observed-or-more-extreme
      data UNDER the null. Does NOT translate to probability the null is
      true, nor to effect size — common error even among practitioners.

  - chap: 10
    kind: short
    difficulty: 2
    prompt: |-
      Your colleague fits `lm(salary ~ years_experience)` on 30 data
      scientists at one company and reports a 95 % CI for the slope of
      ($1,800, $3,400) per year. Without doing any math, name two
      things you'd want to check before using this slope to set
      starting-salary policy across the whole company.
    rubric: |-
      Plausible answers: (1) Independence — were the 30 chosen randomly,
      or all from one team / cohort? (2) Linearity — does the salary–
      experience relationship really look linear in a scatterplot, or
      are there nonlinearities (e.g., a flattening curve)? (3) Outliers
      — one founder with 25 years and huge salary could drive the
      slope. (4) Confounding — experience is correlated with role,
      education, etc. Any TWO of these earn full credit.
