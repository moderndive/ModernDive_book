<!-- Pagefind sitewide search — modal overlay
     Included via _quarto.yml's `include-after-body` so it appears on every
     Quarto-rendered page. Matches the modal injected by scripts/_hub_nav.R
     into the standalone R-generated pages so the search UI is identical
     across both render paths.

     The pagefind index is built in companion CI:
         npx pagefind --site instructor-solutions/_site
     after BOTH Quarto render + R-script-generated reports land in _site/.
     The index covers everything in _site/ (.qmd-rendered + R-emitted). -->
<link rel="stylesheet" href="/pagefind/pagefind-ui.css">
<script src="/pagefind/pagefind-ui.js" defer></script>
<style>
  .quarto-search-btn { background: rgba(255,255,255,0.12); color: #fff;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 4px;
    padding: 0.35em 0.9em; cursor: pointer; font: inherit; font-size: 0.9em;
    margin: 0 0.5em; }
  .quarto-search-btn:hover { background: rgba(255,255,255,0.22); }
  .insthub-search-modal { display: none; position: fixed; inset: 0;
    background: rgba(31, 58, 107, 0.45); z-index: 2000; padding: 6vh 1em; }
  .insthub-search-modal.open { display: block; }
  .insthub-search-modal-inner { background: white; max-width: 780px;
    margin: 0 auto; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 1.3em 1.3em 0.6em 1.3em; max-height: 80vh; overflow-y: auto; }
  .insthub-search-close { float: right; background: none; border: 0;
    color: #1F3A6B; font-size: 1.4em; cursor: pointer; line-height: 1; }
  .insthub-search-close:hover { color: #1A6FBE; }
  .pagefind-ui__search-input { border-radius: 4px !important; border-color: #C5D5E5 !important; }
  .pagefind-ui__result-link { color: #1F3A6B !important; font-weight: 600; }
  .pagefind-ui__result-link:hover { color: #1A6FBE !important; }
  .pagefind-ui__message { color: #555; }
</style>
<div class="insthub-search-modal" id="insthub-search-modal" role="dialog" aria-label="Search instructor hub" aria-modal="true">
  <div class="insthub-search-modal-inner">
    <button class="insthub-search-close" aria-label="Close search" onclick="document.getElementById('insthub-search-modal').classList.remove('open')">&times;</button>
    <div id="insthub-pagefind-search"></div>
  </div>
</div>
<script>
  // Inject a search button into Quarto's navbar after page load.
  // Wire Pagefind UI once script loads; Escape closes the modal.
  window.addEventListener("DOMContentLoaded", function() {
    if (typeof PagefindUI !== "undefined") {
      new PagefindUI({ element: "#insthub-pagefind-search",
        showSubResults: true, resetStyles: false,
        translations: { placeholder: "Search the instructor hub..." } });
    }
    // Inject search button into the navbar's right side
    var navRight = document.querySelector(".navbar .navbar-nav.ms-md-auto, .navbar-nav.navbar-nav-scroll.ms-auto");
    if (!navRight) {
      // Fallback: just before the GitHub icon link
      var ghLink = document.querySelector(".navbar .quarto-navbar-tools a[aria-label*='GitHub'], .navbar a[href*='github.com/moderndive']");
      if (ghLink && ghLink.parentNode) navRight = ghLink.parentNode;
    }
    if (navRight) {
      var btn = document.createElement("button");
      btn.className = "quarto-search-btn";
      btn.setAttribute("aria-label", "Search the instructor hub");
      btn.title = "Search";
      btn.innerHTML = "\u{1F50D} Search";
      btn.onclick = function() {
        document.getElementById("insthub-search-modal").classList.add("open");
        setTimeout(function() {
          var i = document.querySelector(".pagefind-ui__search-input");
          if (i) i.focus();
        }, 100);
      };
      navRight.insertBefore(btn, navRight.firstChild);
    }
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        document.getElementById("insthub-search-modal").classList.remove("open");
      }
    });
  });
</script>
