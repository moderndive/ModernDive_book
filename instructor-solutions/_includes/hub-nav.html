<!-- Hub-back navigation for Quarto-rendered instructor pages. The matching
     R helper for standalone-script-generated pages is scripts/_hub_nav.R.
     Both produce the same look. Wired via include-before-body in
     instructor-solutions/_quarto.yml so it lands at the top of every
     rendered page (right under <body>). -->
<style>
  .hub-nav { position: sticky; top: 0; z-index: 1000;
             background: linear-gradient(180deg, #1F3A6B 0%, #1A6FBE 100%);
             color: #fff; padding: 0.55em 1em;
             font: 500 0.92em/1.3 -apple-system, system-ui, sans-serif;
             box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .hub-nav a { color: #fff; text-decoration: none; }
  .hub-nav a:hover { text-decoration: underline; }
  .hub-nav .hub-arrow { display: inline-block; margin-right: 0.3em; }
  .hub-nav .hub-tag { background: rgba(255,255,255,0.18); padding: 0.1em 0.5em;
                       border-radius: 3px; font-size: 0.82em;
                       margin-left: 0.6em; letter-spacing: 0.04em; }
  @media print { .hub-nav { display: none; } }
</style>
<nav class="hub-nav" aria-label="Hub navigation">
  <!-- Pages inside subdirectories (solutions/, slides/, facilitator-notes/)
       need ../index.html; root-level pages (index, NEWS, syllabus) use
       just index.html. We use a tiny script that prefers ../index.html
       only when the current path has at least one slash after the host. -->
  <a id="hub-back-link" href="index.html"><span class="hub-arrow">&larr;</span> ModernDive instructor hub</a>
  <span class="hub-tag">INSTRUCTOR</span>
</nav>
<script>
  (function () {
    var path = window.location.pathname;
    // Count slashes after the last one that ends a directory. If the page
    // lives in /slides/01-slides.html, we need ../index.html; if it lives
    // at /syllabus.html, plain index.html is right.
    var segments = path.split('/').filter(function (s) { return s.length > 0; });
    // If the URL ends in a filename (has a dot), drop it for depth calc.
    if (segments.length && segments[segments.length - 1].indexOf('.') > -1) {
      segments.pop();
    }
    var depth = segments.length;
    var link = document.getElementById('hub-back-link');
    if (link && depth > 0) {
      link.setAttribute('href', '../'.repeat(depth) + 'index.html');
    }
  })();
</script>
