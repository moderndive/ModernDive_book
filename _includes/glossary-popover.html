<!-- Initialise Bootstrap popovers for auto-linked glossary terms.
     The glossary-autolink Lua filter tags first-mention glossary links with
     class `glossary-term` and data-bs-* attributes; Bootstrap (bundled by
     Quarto's Bootstrap themes) needs each one explicitly instantiated. -->
<script>
(function () {
  function initGlossaryPopovers() {
    if (typeof bootstrap === "undefined" || !bootstrap.Popover) return false;
    document
      .querySelectorAll('a.glossary-term[data-bs-toggle="popover"]')
      .forEach(function (el) {
        if (!bootstrap.Popover.getInstance(el)) {
          new bootstrap.Popover(el, { container: "body" });
        }
      });
    return true;
  }
  // Bootstrap's bundle is loaded near the end of <body>; retry briefly in
  // case this runs before it is defined.
  if (!initGlossaryPopovers()) {
    var tries = 0;
    var timer = setInterval(function () {
      if (initGlossaryPopovers() || ++tries > 40) clearInterval(timer);
    }, 50);
  }

  // Definitions may contain inline math (rewritten to \(...\) by the
  // glossary-autolink filter). Bootstrap inserts the content after page
  // load, so MathJax has not seen it — typeset the popover when it opens.
  // Bootstrap 5 popover events bubble to document.
  document.addEventListener("shown.bs.popover", function () {
    if (window.MathJax && typeof MathJax.typesetPromise === "function") {
      document
        .querySelectorAll(".popover.glossary-popover")
        .forEach(function (tip) {
          MathJax.typesetPromise([tip]).catch(function () {});
        });
    }
  });
})();
</script>
