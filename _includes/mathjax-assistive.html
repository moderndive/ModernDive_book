<script>
  // MathJax accessibility configuration. Loads before MathJax itself
  // (Quarto's MathJax script reads `window.MathJax` at startup).
  //
  // - `assistiveMml`: emit a parallel MathML version of every equation
  //   so screen readers can speak the math semantically rather than
  //   reading character-by-character.
  // - `menuOptions.settings.collapsible`: false so equations don't
  //   collapse on focus (would otherwise interfere with keyboard nav).
  window.MathJax = {
    options: {
      enableEnrichment: true,
      enableExplorer: false,
      menuOptions: {
        settings: {
          assistiveMml: true,
          collapsible: false
        }
      }
    },
    loader: {
      load: ['a11y/assistive-mml']
    }
  };
</script>
