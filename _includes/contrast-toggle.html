<script>
// High-contrast toggle. Saves user's choice to localStorage so the
// preference persists across page navigations.
(function () {
  var KEY = 'mdt-contrast';
  function apply(state) {
    document.documentElement.setAttribute('data-mdt-contrast', state);
  }
  // Restore previously-chosen state ASAP (before paint) so there's no flash.
  try {
    var saved = localStorage.getItem(KEY);
    if (saved === 'high') apply('high');
  } catch (e) {}

  // Inject the toggle button once the DOM is ready.
  function injectButton() {
    if (document.getElementById('mdt-contrast-toggle')) return;
    var btn = document.createElement('button');
    btn.id = 'mdt-contrast-toggle';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Toggle high-contrast mode');
    btn.textContent = 'High contrast';
    btn.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-mdt-contrast');
      var next = current === 'high' ? '' : 'high';
      apply(next);
      try {
        if (next) localStorage.setItem(KEY, next);
        else localStorage.removeItem(KEY);
      } catch (e) {}
    });
    document.body.appendChild(btn);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectButton);
  } else {
    injectButton();
  }
})();
</script>
