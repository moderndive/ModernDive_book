    aov_fit <- aov(elevation ~ region, data = sub)
    summary(aov_fit)
  prompt: |-
    **ANOVA for 3+ group means.** The two-sample t-test handles two groups. **ANOVA** (Analysis of Variance) generalizes to *three or more*. The null is "all group means are equal" against the alternative "at least one differs." Run it on elevation across the three most-common volcano regions, in the two ways Chapter 10 presents it: (1) as a regression on dummy variables, fitting `lm(elevation ~ region)` and reading `get_regression_table()`, and (2) as the traditional F-test, `aov()` piped into `anova()`. Compare both to this exercise's original `summary(aov_fit)` approach: which numbers match, and what does the regression version tell you that the F-test alone does not? What do you do *next* when ANOVA tells you "at least one group differs"? ANOVA is treated formally in Chapter 10 (inference for regression).
