- ex_num: 42
  hash: "ce19"
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    ath <- olympic_athletes |> filter(sport == "Athletics", !is.na(height))
    # Two groups identical in every way, then nudge one by a *tiny* 0.5 cm:
    # with n in the tens of thousands, even that is "significant"
    tiny <- ath |>
      mutate(grp = sample(c("A", "B"), n(), replace = TRUE),
             height_perturbed = height + if_else(grp == "A", 0.5, 0))
    tiny |>
      t_test(formula = height_perturbed ~ grp,
             order = c("A", "B"),
             alternative = "two-sided")
  prompt: |-
    **Practical vs statistical significance: a worked example.** The starter code randomly splits the athletes into two groups that are *identical* in every way, then nudges one group's heights up by a *tiny* **0.5 cm**, so that 0.5 cm is the entire true difference between them. Run the test. With $n$ in the thousands, the p-value is essentially zero, *statistically significant*. But 0.5 cm is *not practically significant*: it's smaller than the difference made by wearing socks, and below the precision with which heights are recorded. In a 2-sentence write-up, how would you communicate this result honestly to a non-statistical audience?
