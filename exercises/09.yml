  hash: "d9b4"
  difficulty: 3
  group: Misuses and critical thinking
  webr: '# your exploration here'
  prompt: |-
    Open exploration: pose a yes/no question of your choice using one of the chapter's three datasets, `bob_ross`, `volcanoes` (joined with `eruptions`), or `olympic_athletes`, set up the hypothesis test, run it via `infer`, and interpret in plain language. The starting points below are all two-group *association* questions, so the permutation logic needs no sampling step even though each dataset is a complete catalog; if you instead pose a one-sample question about a single parameter, use the seeded sample-then-reveal device from EX 9.1 and EX 9.4.

    Reasonable starting points:

    - `bob_ross`: does one common element (say `snow` or `clouds`) appear at a different rate in episodes featuring another element?
    - `volcanoes` joined to `eruptions`: does mean VEI, or the eruption count per volcano, differ between two regions of your choice?
    - `olympic_athletes`: does mean `age` (or `height`) differ between two sports, or between medalists and non-medalists within one sport?

    A few traps to steer clear of:

    - Identifier columns (`episode` and `title` in `bob_ross`; `volcano_number` and `volcano_name`; `id` and `name` in `olympic_athletes`) label rows rather than measure anything, so "testing" them is meaningless.
    - Huge-cardinality categoricals: `event` in `olympic_athletes` has about 1,270 distinct values; a two-group test needs two groups, not a thousand.
    - Very rare `bob_ross` elements: several (e.g., `apple_frame`, `dock`) appear in exactly one episode and `lakes` in none, so a test involving them has essentially no power (recall the 17-episode `barn` caveat in EX 9.17).
    - Long free-text columns like `geological_summary` in `volcanoes` are prose, not categories.
  book_section: Misuses / critical thinking (cross-section)
  book_subsection: Misuses / critical thinking
