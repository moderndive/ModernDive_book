    **Statistical power and sample-size planning.** Before running a study, you can compute the *sample size required* to reliably detect an effect of a given size. The `pwr` package's `pwr.t.test()` does this for two-sample t-tests (the package is beyond what this book covers; its CRAN page at <https://cran.r-project.org/package=pwr> documents variants for proportions, ANOVA, and more). Run it for a "medium" Cohen's *d* of 0.5, $\alpha = 0.05$, 80 % power. The output `n` is the required *per-group* sample size. Briefly, why is "compute required $n$ before running the experiment" a healthier practice than "collect what you can, then test"?
