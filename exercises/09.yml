      chisq_test(formula = has_tree ~ has_mountain)
  prompt: |-
    **`prop_test()` and `chisq_test()` for category tests.** The `infer` package wraps base R's two most useful theory-based category tests in its familiar formula interface: `infer::prop_test()` compares proportions between groups (a theory-based cousin of the permutation diff-in-props tests you ran above), and `infer::chisq_test()` tests independence in a two-way contingency table. Both questions here are association questions between columns of the full catalog, and these theory-based tests approximate their permutation counterparts, so, as with EX 9.15 and EX 9.17, no sampling step is needed. Run `prop_test()` on long-form tree-vs-mountain data (pivoted as in EX 9.15) to compare the two elements' rates, and `chisq_test()` on tree and mountain presence to test whether the two are independent. Briefly, when would you reach for `chisq_test()` over `prop_test()` (think, how many categories and what kind of question)?
