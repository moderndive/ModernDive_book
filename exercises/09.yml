    vei_asia_sa <- eruptions |>
      inner_join(volcanoes |> select(volcano_number, region),
                 by = "volcano_number") |>
      filter(region %in% c("Arabia-Central Asia Volcanic Regions",
                           "Eastern Asia Volcanic Regions",
                           "South America Volcanic Regions"),
             !is.na(vei)) |>
      mutate(group = if_else(region == "South America Volcanic Regions",
                             "South America", "Asia"))
    # Two-sided: H_A: mu_Asia != mu_South_America
    vei_asia_sa |>
      t_test(formula = vei ~ group, order = c("Asia", "South America"),
             alternative = "two-sided") |>
      pull(p_value)
    # One-sided: H_A: mu_Asia > mu_South_America (direction chosen BEFORE the data)
    vei_asia_sa |>
      t_test(formula = vei ~ group, order = c("Asia", "South America"),
             alternative = "greater") |>
      pull(p_value)
  prompt: |-
    **One- vs two-sided alternatives.** Chapter 9's worked example (§ 9.2/§ 9.4) actually used a *right-sided* alternative (is metal *more* popular than deep house?) while the § 9.6 case study used a *two-sided* one ($H_A: \mu_1 \neq \mu_2$). A **one-sided** alternative ($H_A: \mu_1 > \mu_2$ or $H_A: \mu_1 < \mu_2$) is appropriate when the *direction* of effect was decided **before** looking at the data (e.g., "new drug improves outcomes"). Run both forms from the starter code on the mean eruption **VEI** comparison between Asian and South American volcanoes (the same two-group association question as EX 9.14's permutation test, so the full eruption catalog needs no sampling step), a deliberately weak effect, so the p-values are far from 0 and the halving is visible. *Critical rule, never choose one-sided after peeking at the data*; that's a form of p-hacking. When would a pre-specified one-sided alternative be the honest choice?
