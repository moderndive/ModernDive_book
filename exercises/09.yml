    # ANOVA: compare mean elevations across 3+ regions
    top_regions <- volcanoes |> count(region, sort = TRUE) |> head(3) |> pull(region)
    sub <- volcanoes |> filter(region %in% top_regions, !is.na(elevation))

    # Chapter 10's regression framing: dummy variables show WHICH groups differ
    mod_anova <- lm(elevation ~ region, data = sub)
    get_regression_table(mod_anova)

    # Chapter 10's traditional F-test: aov() piped into anova()
    aov(elevation ~ region, data = sub) |>
