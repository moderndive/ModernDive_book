chapter_meta:
  coverage_note: |-
    **A note on coverage.** *Section 9.6, the IMDb action-vs-romance case study, has no dedicated exercise here, but it is **structurally** mirrored by EX9.10–EX9.14 (a complete two-sample permutation workflow: mean last-eruption year and elevation across volcano types, then eruption VEI across regions)*; running EX9.10 and writing it up in the case-study narrative form is the natural way to exercise 9.6's pedagogy. EX9.18 gives Section 9.3, the *short conceptual* section that introduces the vocabulary of hypothesis testing, a dedicated comprehension prompt.

    **A note on the data.** Each dataset here (`bob_ross`, `volcanoes`/`eruptions`, `olympic_athletes`) is a *complete catalog*, effectively the population, so a parameter like "the true tree rate" is directly countable and testing hypotheses about it on the full table would be incoherent. The one-sample tests therefore use the same sample-then-reveal device as the Chapter 8 exercises: draw a seeded random sample, test from the sample alone, then check the verdict against the population truth. The two-group **permutation** tests keep the full data on purpose: a permutation test asks whether the observed association between two variables exceeds what chance pairing of the labels would produce (exchangeability under $H_0$), a question that needs no larger population; the theory-based versions of those same comparisons (`t_test()`, `prop_test()`, `chisq_test()`) approximate the permutation tests, so the same randomization-inference framing carries over.

    Difficulty: ★ warm-up · ★★ standard · ★★★ critical thinking.
