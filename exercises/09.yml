  webr: |-
    ath <- olympic_athletes |> filter(sport == "Athletics", !is.na(height))

    # Welch's t-test (infer's default, var.equal = FALSE):
    ath |>
      t_test(formula = height ~ sex,
             order = c("M", "F"),
             alternative = "two-sided")

    # Student's pooled t-test: t_test() forwards var.equal = TRUE through to
    # stats::t.test(), so the pooled version stays inside the infer workflow.
    ath |>
      t_test(formula = height ~ sex,
             order = c("M", "F"),
             alternative = "two-sided",
             var.equal = TRUE)
  prompt: |-
    **Welch's *t* vs Student's pooled *t*.** Chapter 9's `infer::t_test()` wraps base R's `t.test()` and runs **Welch's t-test** by default (`var.equal = FALSE`), which doesn't assume equal variances across groups. Setting `var.equal = TRUE` switches to **Student's pooled t-test**, which does; and because `t_test()` passes extra arguments straight through to `stats::t.test()`, the pooled version works without leaving the `infer` workflow. Run both forms on Athletics height by sex; the full catalog is fine here, since this two-group comparison, like the chapter's permutation tests, asks whether the sex labels are associated with height beyond what chance pairing would produce, and the t-test approximates that permutation ask. The test statistics, degrees of freedom, and CIs differ slightly, why is Welch's the safer default in practice? (If you cross-check against base R's `t.test()`, a flipped sign on the estimate just reflects group ordering (align the groups with `t_test()`'s `order` argument), not a real discrepancy.)
