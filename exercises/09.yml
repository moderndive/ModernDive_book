  prompt: |-
    **Three things a $p$-value is *not*.** Section 9.3 carefully defines the $p$-value as the probability of seeing a test statistic at least as extreme as the observed one *if $H_0$ were true*. But it is commonly misread in three specific ways:

    - (i) as "the probability that $H_0$ is true,"
    - (ii) as "the probability the result was due to chance," and
    - (iii) as a measure of *effect size*.

    Pick one of these three misreadings and explain in 2–3 sentences both *why* it is wrong and *what* a reader should say instead. (Like EX 9.45, this sits with the Extensions because it synthesizes and stress-tests the chapter's vocabulary rather than introducing a new tool.)
