  group: Extensions
  prompt: |-
    **Equivalence testing (TOST), when "no difference" *is* the claim.** A standard hypothesis test treats "no difference" as the null, which you can only ever *fail to reject*, not affirmatively support. Sometimes "the difference is *practically* zero" *is* what you want to claim (e.g., "the generic drug is bioequivalent to the brand"). **Two One-Sided Tests (TOST)** flips the framing: $H_0$ becomes "the difference is meaningfully large", and you try to *reject* it in favor of "the difference is negligibly small". In 2-3 sentences, describe a real-world setting where TOST would be the appropriate framework, and what you'd need to specify *before* running it.
