- ex_num: 34
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Multiple-testing problem and Bonferroni correction.** EX 9.27 showed that running 20 tests at $\alpha = 0.05$ produces ~1 false positive on average under all-true-nulls. The **Bonferroni correction** controls the *family-wise error rate* (probability of *any* false positive across all tests) by tightening the per-test threshold to $\alpha/m$ when running $m$ tests. Compute the Bonferroni-corrected $\alpha$ for 20 tests. The catch, Bonferroni is *conservative* (low Type I error rate but inflated Type II error). When would you accept that tradeoff?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 35
  difficulty: 3
  group: Extensions
  webr: |-
    # Benjamini-Hochberg's procedure: control the expected proportion of FALSE
    # discoveries (FDR) rather than the chance of ANY false positive.
    set.seed(76)
    pvals <- sort(c(0.001, 0.008, 0.039, 0.041, 0.045, 0.10, 0.21, 0.41, 0.55, 0.99))
    p.adjust(pvals, method = "BH")
  prompt: |-
    **False discovery rate (FDR) as a less-conservative alternative.** Bonferroni protects against *any* false positive, strict, but rejects many real effects too. The **Benjamini-Hochberg (BH) procedure** instead controls the *expected proportion* of discoveries that are false (the FDR). For genomics / high-throughput contexts where 1000s of tests run, BH is the standard choice. Run `p.adjust()` to see how a sorted list of p-values gets BH-corrected. When is FDR control more appropriate than family-wise control?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 36
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Effect size, Cohen's *d* for two-sample mean tests.** A p-value tells you "is the difference unlikely under $H_0$?", but says *nothing* about how big the difference is in standardized terms. **Cohen's *d*** is the difference of means divided by their pooled SD, a unitless measure where 0.2 is "small", 0.5 is "medium", 0.8 is "large." Compute it for height difference between male and female Athletics athletes. How does this complement the p-value from the chapter's t-test?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 37
  difficulty: 3
  group: Extensions
  webr: |-
    library(pwr)
    # How big a sample do we need to detect a "medium" effect (d = 0.5) at α = 0.05 with 80% power?
    pwr.t.test(d = 0.5, sig.level = 0.05, power = 0.80, type = "two.sample")
  prompt: |-
    **Statistical power and sample-size planning.** Before running a study, you can compute the *sample size required* to reliably detect an effect of a given size. The `pwr` package's `pwr.t.test()` does this for two-sample t-tests. Run it for a "medium" Cohen's *d* of 0.5, $\alpha = 0.05$, 80 % power. The output `n` is the required *per-group* sample size. Briefly, why is "compute required $n$ before running the experiment" a healthier practice than "collect what you can, then test"?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 38
  difficulty: 2
  group: Extensions
  webr: |-
    # prop.test for two-sample proportions:
    tree_count    <- sum(bob_ross$tree    == 1)
    mountain_count <- sum(bob_ross$mountain == 1)
    n <- nrow(bob_ross)
    prop.test(c(tree_count, mountain_count), c(n, n))

    # chisq.test for two-way independence:
    chisq.test(table(bob_ross$tree, bob_ross$mountain))
  prompt: |-
    **`prop.test()` and `chisq.test()` for category tests.** Two of base R's most useful theory-based test functions. `prop.test()` compares two (or more) proportions; `chisq.test()` tests independence in a contingency table. Run both on `bob_ross`. Briefly, when would you reach for `chisq.test()` over `prop.test()` (think, how many categories and what kind of question)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  difficulty: 3
  group: Extensions
  webr: |-
    # ANOVA: compare mean elevations across 3+ regions
    top_regions <- volcanoes |> count(region, sort = TRUE) |> head(3) |> pull(region)
    sub <- volcanoes |> filter(region %in% top_regions, !is.na(elevation))
    aov_fit <- aov(elevation ~ region, data = sub)
    summary(aov_fit)
  prompt: |-
    **ANOVA for 3+ group means.** The two-sample t-test handles two groups. **ANOVA** (Analysis of Variance) generalizes to *three or more*. The null is "all group means are equal" against the alternative "at least one differs." Run it on elevation across the three most-common volcano regions. ANOVA returns a single F-statistic and p-value, what do you do *next* when ANOVA tells you "at least one group differs"?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  difficulty: 3
  group: Extensions
  webr: |-
    ath <- olympic_athletes |> filter(sport == "Athletics", !is.na(height))

    # Welch's t-test via infer (which wraps base t.test with var.equal = FALSE):
    ath |>
      t_test(formula = height ~ sex,
             order = c("M", "F"),
             alternative = "two-sided")

    # Pooled t-test, infer's wrapper doesn't expose var.equal, so fall back to
    # base R here. This is the only Ch 9 case where the infer wrapper can't
    # carry the full message.
    t.test(height ~ sex, data = ath, var.equal = TRUE)
  prompt: |-
    **Welch's *t* vs Student's pooled *t*.** Chapter 9's `infer::t_test()` wraps base R's `t.test()` with `var.equal = FALSE`, i.e., it always runs **Welch's t-test**, which doesn't assume equal variances across groups. Setting `var.equal = TRUE` switches to **Student's pooled t-test**, which does. `infer::t_test()` doesn't expose that toggle, so the pooled comparison requires base R's `t.test()` directly. Run both forms on Athletics height by sex. The estimates and CIs differ slightly, why is Welch's the safer default in practice?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  difficulty: 3
  group: Extensions
  prompt: |-
    **Equivalence testing (TOST), when "no difference" *is* the claim.** A standard hypothesis test treats "no difference" as the null, which you can only ever *fail to reject*, not affirmatively support. Sometimes "the difference is *practically* zero" *is* what you want to claim (e.g., "the generic drug is bioequivalent to the brand"). **Two One-Sided Tests (TOST)** flips the framing: $H_0$ becomes "the difference is meaningfully large", and you try to *reject* it in favor of "the difference is negligibly small". In 2-3 sentences, describe a real-world setting where TOST would be the appropriate framework, and what you'd need to specify *before* running it.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  difficulty: 3
  group: Extensions
  webr: |-
    ath <- olympic_athletes |> filter(sport == "Athletics", !is.na(height))
    # Tiny height difference, but with n in the thousands, it's "significant"
    tiny <- ath |> mutate(height_perturbed = height + ifelse(sex == "M", 0.05, 0))
    tiny |>
      t_test(formula = height_perturbed ~ sex,
             order = c("M", "F"),
             alternative = "two-sided")
  prompt: |-
    **Practical vs statistical significance: a worked example.** The snippet adds a *tiny* 0.05 cm bias to male heights, far smaller than typical measurement error. Run the test. With $n$ in the thousands, the p-value is essentially zero, *statistically significant*. But 0.05 cm (half a millimeter) is *not practically significant*. It's smaller than the difference made by wearing socks. In a 2-sentence write-up, how would you communicate this result honestly to a non-statistical audience?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 43
  difficulty: 3
  group: Extensions
  webr: |-
    # Run 2000 simulated one-sample t-tests where the null is TRUE.
    # The resulting p-values should be approximately UNIFORM on [0, 1].
    # (2000 reps is plenty to see the pattern; 10000 produces a cleaner
    # histogram but takes much longer to render.)
    set.seed(76)
    null_pvals <- replicate(2000, {
      tibble(x = rnorm(30, mean = 0)) |>
        t_test(response = x, mu = 0, alternative = "two-sided") |>
        pull(p_value)
    })
    ggplot(data.frame(p = null_pvals), aes(x = p)) +
      geom_histogram(bins = 20, color = "white") +
      labs(title = "P-values under the null are uniformly distributed")

    # Fraction below 0.05? Should be about 5%.
    mean(null_pvals < 0.05)
  prompt: |-
    **The replication crisis (with the uniform-p-value demo).** A surprising fact, when $H_0$ is *true*, the p-value's distribution across many studies is *uniform* on $[0, 1]$. Roughly 5 % of true nulls produce $p < 0.05$ purely by chance. In a research field running thousands of underpowered studies, a flood of "$p < 0.05$" results will appear even if most underlying nulls are true, many of those will fail to replicate. Run the simulation and check the histogram shape + the fraction $< 0.05$. How does this connect to the **publication bias** problem where journals preferentially publish $p < 0.05$ results?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 44
  difficulty: 3
  group: Extensions
  webr: |-
    ath <- olympic_athletes |> filter(sport == "Athletics", !is.na(height))
    # Two-sided: H_A: mu_M ≠ mu_F
    ath |>
      t_test(formula = height ~ sex, order = c("M", "F"),
             alternative = "two-sided") |>
      pull(p_value)
    # One-sided: H_A: mu_M > mu_F (predict direction BEFORE seeing the data)
    ath |>
      t_test(formula = height ~ sex, order = c("M", "F"),
             alternative = "greater") |>
      pull(p_value)
  prompt: |-
    **One- vs two-sided alternatives.** Chapter 9 defaulted to *two-sided* alternatives ($H_A: \mu_1 \neq \mu_2$). A **one-sided** alternative ($H_A: \mu_1 > \mu_2$ or $H_A: \mu_1 < \mu_2$) is appropriate when the *direction* of effect was decided **before** looking at the data (e.g., "new drug improves outcomes"). Run both forms above and compare p-values. *Critical rule, never choose one-sided after peeking at the data*; that's a form of p-hacking. When would a pre-specified one-sided alternative be the honest choice?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 45
  difficulty: 2
  group: Extensions
  prompt: |-
    **Six terms from Section 9.3, in one paragraph.** Section 9.3 names the building blocks of every test in this chapter: **null hypothesis ($H_0$)**, **alternative hypothesis ($H_A$)**, **test statistic**, **null distribution**, **$p$-value**, and **significance level ($\alpha$)**. Write a single short paragraph that uses all six terms in the context of the music-popularity activity from Section 9.2, what was each *concretely* for that test? The goal is to anchor the abstract vocabulary to a worked example so the rest of Chapter 9's mechanics read as the same recipe with new ingredients.
