- ex_num: 52
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`case_when()` for multi-level conditional mutates.** When you want to derive a *new categorical column* from a numeric one with more than two buckets, `case_when()` is cleaner than nesting `ifelse()`s. Build an `age_group` column on `olympic_athletes` with buckets `"under 20"`, `"20s"`, `"30s"`, `"40+"`, then count athletes in each.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 53
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`if_else()` for boolean conditional mutates.** When the condition has exactly *two* outcomes, `if_else(condition, value_if_TRUE, value_if_FALSE)` is the cleanest tool. It's strict about both branches having the same type, which catches subtle bugs that base R's `ifelse()` silently lets through. Try building an `is_medalist` column on `olympic_athletes` (`"yes"` if `medal` is not `NA`, `"no"` otherwise) — then count how many athlete-rows are in each.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 54
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **The `slice_*()` family.** Section 3.6 introduced `top_n()`; the dplyr ecosystem now favors a family of `slice_*()` verbs that read more clearly and have explicit variants. `slice_max(col, n)`/`slice_min(col, n)` for top/bottom by a column, `slice_head(n)`/`slice_tail(n)` for first/last rows, `slice_sample(n)` for a random subset. Try each above. For "top 10 NOCs by medals at Paris 2024," which would you reach for first?
  book_section: Extensions
  book_subsection: Extensions
