  prompt: |-
    **Medal efficiency (a `group_by()` → `summarize()` → `mutate()` → `arrange()` pipeline).** The USA and China win the most *total* medals, but which countries are most *efficient*, turning the fewest athletes into the most medals? For the **2024 Summer** Games, `group_by(noc)` and `summarize()` each country's number of athletes (`n_distinct(id)`) and number of medal-winners (distinct `id`s with a non-`NA` `medal`), then `mutate()` a `medal_per_participant` percentage and `arrange()` by it. Re-run keeping only countries that brought **at least 50 athletes**, so one athlete winning a single medal can't read as 100%. Which country tops the efficiency ranking, and how does it compare with the USA and China?
  book_section: 3.6 `arrange`
