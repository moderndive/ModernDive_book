  webr: '# your exploration here'
  prompt: |-
    **`count()` as a `summarize(n = n())` shortcut.** The pattern `group_by(col) |> summarize(n = n()) |> arrange(desc(n))` is so common dplyr provides `count(col, sort = TRUE)` as a one-liner. Use it on `olympic_athletes` to find the 5 most-represented sports. When you need *more than one* summary stat per group (e.g., mean and SD), stick with `group_by()` + `summarize()`; for pure row counts, `count()` wins.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 56
  difficulty: 3
  group: Extensions
  webr: |-
    olympic_athletes |>
      summarize(across(c(age, height, weight),
                       list(mean = \(x) mean(x, na.rm = TRUE),
                            sd   = \(x) sd(x,   na.rm = TRUE))))
  prompt: |-
    **`across()` for applying a function to many columns.** Writing `summarize(mean_age = mean(age, na.rm = TRUE), mean_height = ..., mean_weight = ...)` for many columns is tedious. `across(<cols>, <fn>)` applies the same function to multiple columns at once. The snippet above computes mean *and* SD for `age`, `height`, `weight` all in one summarize. (We mentioned this in passing in EX 3.50 — here's the dedicated walk-through.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 57
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`bind_rows()` and `bind_cols()`.** When you have two data frames with the *same columns* and want to stack them vertically, use `bind_rows()`. For two frames with the *same rows* in the same order that you want to glue side-by-side, use `bind_cols()` (rare — usually a join is safer). Try `bind_rows()` to combine 2024 Summer and 2022 Winter medal tables. Why is `bind_rows()` safer than `rbind()` (the base-R equivalent)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 58
  difficulty: 3
  group: Extensions
  webr: |-
    library(stringr)
    olympic_athletes |>
      mutate(
        is_team_event = str_detect(event, "Team|Doubles|Relay"),
        event_clean   = str_replace(event, "^Men's | ", " ")
      ) |>
      count(is_team_event)
  prompt: |-
    **String manipulation with `stringr`.** Real-world data is full of *text* that needs cleaning. The `stringr` package provides a consistent family of `str_*()` functions: `str_detect()` (does the string match this pattern?), `str_replace()` (swap one pattern for another), `str_to_lower()`, `str_trim()`. Use the snippet above to flag team events in `olympic_athletes$event`. Briefly: when would you want regular expressions in the pattern argument vs. literal strings?
  book_section: Extensions
