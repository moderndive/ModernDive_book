  group: The pipe operator `|>`
  webr: |-
    # nested form (run first):
    head(filter(olympic_athletes, year == 2024, !is.na(height)), 10)

    # piped form — write yours below:
  prompt: |-
    Take this **nested** expression and rewrite it as a `|>`-piped chain. Verify the two produce identical output.

    ```r
    head(filter(olympic_athletes, year == 2024, !is.na(height)), 10)
    ```

    In one sentence, why does the piped version usually read more naturally for *humans* than the nested one?
  book_section: 3.1 The pipe operator `|>`
  book_subsection: 3.1 The pipe operator `|>`
