  prompt: |-
    **`rowwise()` for row-by-row computation.** Most dplyr verbs are *vectorized* (operate on whole columns at once), which is fast but awkward when you need a per-row reduction across multiple columns. `rowwise()` switches dplyr to per-row mode. The snippet finds, for each (Games × NOC) row, which medal color the country won the most of. Always pair `rowwise()` with `ungroup()` when you're done — otherwise subsequent verbs stay slow.
