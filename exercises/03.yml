chapter_meta:
  coverage_note: |-
    **A note on coverage.** Sections 3.8.2 (`relocate`) and 3.8.3 (`rename`) are short (≈10–15 lines each), both verbs are *trivial reorderings* of an existing data frame, so a single combined exercise (EX3.28) exercises them alongside `select()` rather than padding three near-duplicate prompts. The pipe operator (3.1) is implicitly practiced in every other exercise; EX3.4 makes the *nested-vs-piped* equivalence explicit.

    Difficulty stars on each exercise: ★ warm-up, ★★ standard application, ★★★ critical thinking.
  data_note: |-
    **Data source (`episodes`, from the `steves` package).** Source: Rick Steves' Europe (compiled dataset). Note: This dataset was created from public sources for teaching purposes and is not an official or verified Rick Steves' Europe dataset.
