- ex_num: 35
  hash: "o2ma"
  difficulty: 3
  group: Critical thinking and synthesis
  webr: '# your exploration here'
  prompt: |-
    Open exploration: pick a numerical variable in `volcanoes`, `eruptions`, or `planets`, build its sampling distribution, and write a 2-sentence finding (population skewness, simulated SE, comparison to theoretical SE).

    Good candidates: `volcanoes$elevation` (no missing values, modest skew), `eruptions$vei` (drop the missing values first with `filter(!is.na(vei))`), `planets$radius_earth` or `planets$mass_earth` (heavily right-skewed, a good stress test of the CLT), `planets$orbital_period_days` (even more extreme skew).

    Steer clear of:

    - *identifiers* like `volcano_number` or `eruption_number`: they're labels, so their "mean" is meaningless;
    - *map coordinates* (`latitude`, `longitude`, `ra_deg`, `dec_deg`): an average of positions scattered around the globe or sky isn't a quantity you can interpret, and longitude wraps around at ±180°;
    - *year columns* (`last_eruption_year`, `start_year`, `discovery_year`): they mark *when*, not *how much*, and `last_eruption_year` is also missing for roughly a third of volcanoes;
    - *mostly-missing columns* like `planets$insolation_earth` or `planets$eq_temp_k` (each missing for roughly a quarter or more of planets): heavy missingness makes the "population" you're actually sampling unclear.
  book_section: Critical thinking / synthesis / open exploration
  book_subsection: Critical thinking / synthesis / open exploration
