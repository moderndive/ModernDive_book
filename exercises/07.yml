  webr: '# your exploration here'
  prompt: |-
    **Finite-population correction (FPC).** The "$SE = \sigma / \sqrt{n}$" formula from § 7.4.5 implicitly assumes you're sampling from an *infinite* population (or sampling *with* replacement). For sampling *without* replacement from a finite population, the true SE is smaller, multiply by the **FPC factor** $\sqrt{(N - n)/(N - 1)}$. Compute the FPC for $n = 50$ from `volcanoes`. Is the correction meaningful here, and roughly when does it become meaningful (think about the ratio $n/N$)?
  book_section: Extensions
  book_subsection: Extensions
