    **When $n = 30$ is nowhere near enough.** § 7.4.6 said the sampling distribution of $\bar{X}$ is approximately normal for "large enough" $n$, and *how large* depends on how skewed the population is. The snippet builds a deliberately extreme population with `rlnorm(10000, meanlog = 0, sdlog = 2)`, a new-to-us base-R function that draws 10,000 values from a **lognormal** distribution, here a violently right-skewed one where most values sit near 1 but rare values run into the thousands. It then builds the sampling distribution of $\bar{x}$ at $n = 30$ with the same `rep_slice_sample()` workflow as EX 7.9. Run it and inspect the histogram of `samp_dist_heavy`. Does $n = 30$ look "large enough" here? What does this tell you about treating $n = 30$ as a magic number for CLT-based inference?
