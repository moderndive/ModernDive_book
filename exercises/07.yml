    **How many `reps` are 'enough'?** The book's virtual sampling (§ 7.1.3, and again § 7.4.3) used `reps = 1000` for the sampling distribution. *Why that number, and not 100, or 10,000?* The simulated SE is itself an estimate. It stabilizes as `reps` grows. Run the snippet that estimates SE at five different `reps` values. At what point does the estimate stop moving meaningfully? What does that tell you about a reasonable default for `reps`?
  book_section: Extensions
  book_subsection: Extensions
