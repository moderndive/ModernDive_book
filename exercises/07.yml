- ex_num: 35
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # your exploration here
  prompt: |-
    **Stratified sampling.** A simple random sample can under-represent small subgroups by chance. *Stratified* sampling fixes this by drawing a fixed number from each group. Use `group_by(region) |> slice_sample(n = 5)` on `volcanoes` to get 5 volcanoes per region. Compare to a plain `slice_sample(n = 5 * n_regions)` of the same total size, when would the stratified version give more accurate per-region summaries?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 36
  difficulty: 2
  group: Extensions
  webr: |-
    set.seed(76)
    s_with    <- volcanoes |> slice_sample(n = 50, replace = TRUE)
    s_without <- volcanoes |> slice_sample(n = 50, replace = FALSE)
    c(unique_with    = length(unique(s_with$volcano_number)),
      unique_without = length(unique(s_without$volcano_number)))
  prompt: |-
    **With- vs without-replacement sampling.** `slice_sample(replace = TRUE)` can pick the same volcano twice; `slice_sample(replace = FALSE)` cannot. Run the snippet and count the *distinct* volcanoes selected in each. The book's bootstrap (Ch 8) uses with-replacement on purpose, for what reason? For collecting fresh real-world data (a survey), which mode would you want?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 37
  difficulty: 3
  group: Extensions
  webr: |-
    # A heavy-tailed (Cauchy) population, extreme values are common
    set.seed(76)
    heavy_pop <- rcauchy(10000)
    # Build a sampling distribution of the mean
    samp_dist <- replicate(1000, mean(sample(heavy_pop, 30)))
    ggplot(data.frame(xbar = samp_dist), aes(x = xbar)) +
      geom_histogram(bins = 50, color = "white") +
      coord_cartesian(xlim = c(-5, 5))   # crop to make plot readable
  prompt: |-
    **When the CLT *fails*.** § 7.4 said the sampling distribution of $\bar{X}$ is approximately normal for "large enough" $n$. *How* large depends on the population's tails, for heavy-tailed populations like the **Cauchy**, the CLT never kicks in (the mean of a Cauchy sample has the *same* distribution as a single Cauchy draw, no matter how large $n$ gets). Run the snippet and inspect the histogram of `samp_dist`. Does it look normal? What does this tell you about blindly applying CLT-based inference?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 38
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Finite-population correction (FPC).** The "$SE = \sigma / \sqrt{n}$" formula from § 7.4.3 implicitly assumes you're sampling from an *infinite* population (or sampling *with* replacement). For sampling *without* replacement from a finite population, the true SE is smaller, multiply by the **FPC factor** $\sqrt{(N - n)/(N - 1)}$. Compute the FPC for $n = 50$ from `volcanoes`. Is the correction meaningful here, and roughly when does it become meaningful (think about the ratio $n/N$)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    sim_se <- function(reps) {
      sd(replicate(reps, mean(sample(volcanoes$elevation, 30, replace = TRUE))))
    }
    reps_grid <- c(50, 200, 1000, 5000, 20000)
    se_estimates <- sapply(reps_grid, sim_se)
    data.frame(reps = reps_grid, simulated_SE = se_estimates)
  prompt: |-
    **How many `reps` are 'enough'?** § 7.4 used `reps = 1000` for the virtual sampling distribution. *Why that number, and not 100, or 10,000?* The simulated SE is itself an estimate. It stabilizes as `reps` grows. Run the snippet that estimates SE at five different `reps` values. At what point does the estimate stop moving meaningfully? What does that tell you about a reasonable default for `reps`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  difficulty: 2
  group: Extensions
  webr: |-
    set.seed(76)
    x1 <- replicate(5, mean(sample(volcanoes$elevation, 30, replace = TRUE)))
    set.seed(76)
    x2 <- replicate(5, mean(sample(volcanoes$elevation, 30, replace = TRUE)))
    identical(x1, x2)   # TRUE, same seed, same outputs
  prompt: |-
    **`set.seed()` and reproducibility.** Any code that uses random number generation produces *different* numbers each time, unless you call `set.seed(N)` first, which makes the random sequence deterministic. Run the snippet to verify the two `replicate()` calls produce identical results when seeded the same. Why is reproducibility especially important in *published* statistical work?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  difficulty: 3
  group: Extensions
  prompt: |-
    **Cluster sampling vs stratified sampling.** Both are alternatives to simple random sampling. **Stratified** divides the population into groups and samples from *each* group (good for representativeness across groups). **Cluster** sampling picks whole groups at random and surveys *everyone* in the chosen groups (cheaper logistically, e.g., pick 20 schools rather than 1000 random students from 500 schools, then survey all the students in the chosen schools). In 2-3 sentences, give a realistic scenario where you'd choose cluster sampling over simple random sampling, and a different scenario where you'd choose stratified.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # Population mean of elevation
    mu <- mean(volcanoes$elevation, na.rm = TRUE)

    # Track running mean as n grows
    ns <- seq(10, 5000, by = 50)
    running_means <- sapply(ns, function(n) mean(sample(volcanoes$elevation, n, replace = TRUE)))

    ggplot(data.frame(n = ns, mean_n = running_means), aes(x = n, y = mean_n)) +
      geom_line() +
      geom_hline(yintercept = mu, color = "red") +
      labs(y = "Sample mean (m)", title = "Sample mean → population mean as n grows")
  prompt: |-
    **The Law of Large Numbers.** The CLT describes the *shape* of the sampling distribution. The **Law of Large Numbers (LLN)** says something different and more basic, the sample mean $\bar{X}_n$ *converges to* the population mean $\mu$ as $n \to \infty$. Run the snippet. The black line wanders early when $n$ is small but eventually tracks the red population-mean line tightly. That's the LLN in action. The CLT and LLN often get conflated; how would you explain the difference in one sentence each?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 43
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    samp_dist <- replicate(1000, mean(sample(volcanoes$elevation, 30, replace = TRUE)))
    # Five-number summary of the sampling distribution:
    quantile(samp_dist, c(0.025, 0.25, 0.5, 0.75, 0.975))
  prompt: |-
    **Quantile summaries of a sampling distribution.** § 7.4 emphasized the *mean* and *SD* of the sampling distribution. You can summarize it differently with **quantiles**, the 2.5 % and 97.5 % quantiles together describe the middle 95 % of typical sample means, regardless of the distribution's shape. Run the snippet on volcanoes. Why is the quantile-based "middle 95 %" *more honest* than $\bar{X} \pm 2 \cdot SE$ when the sampling distribution is skewed or has heavy tails?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 44
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # moderndive's rep_slice_sample:
    md <- volcanoes |> rep_slice_sample(n = 30, reps = 200)

    # Hand-rolled equivalent with replicate():
    set.seed(76)
    handrolled <- map_dfr(seq_len(200), function(r) {
      volcanoes |> slice_sample(n = 30) |> mutate(replicate = r)
    })

    list(rep_slice_sample = head(md, 3),
         handrolled       = head(handrolled, 3))
  prompt: |-
    **`rep_slice_sample()` vs. a hand-rolled `replicate()` sampler.** § 7.3 used `rep_slice_sample(n, reps)` for the virtual sampling distribution. Under the hood, that's essentially a `replicate(reps, slice_sample(n))` chained with a `replicate` column. Run both versions. Where does `rep_slice_sample()` simplify the workflow? When would you *want* to hand-roll the sampling loop (think, what control does the `replicate()` form give you that `rep_slice_sample()` doesn't)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 45
  difficulty: 2
  group: Extensions
  prompt: |-
    **Sampling framework vocabulary in one paragraph.** Section 7.2 introduces a tight cluster of terms: **population**, **sample**, **simple random sampling**, **population parameter** ($p$, $\mu$), **sample statistic** ($\widehat{p}$, $\bar{x}$), and **sampling distribution**. Write a single paragraph that uses *all six* terms in context of the volcanoes activity (e.g., "the **population** is …; we take a **simple random sample** of 30 volcanoes; …"). The goal is to nail the distinction between *one* sample statistic (a single number from one draw) and the *sampling distribution* (the spread of that statistic over many possible draws).
  book_section: 7.2 Sampling framework
  book_subsection: 7.2 Sampling framework (terminology and notation)
- ex_num: 46
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    sa  <- volcanoes |> filter(region == "South America Volcanic Regions") |>
      rep_slice_sample(n = 30, reps = 1000) |>
      group_by(replicate) |>
      summarize(xbar_sa = mean(elevation, na.rm = TRUE), .groups = "drop")

    mca <- volcanoes |> filter(region == "Middle America-Caribbean Volcanic Regions") |>
      rep_slice_sample(n = 30, reps = 1000) |>
      group_by(replicate) |>
      summarize(xbar_mca = mean(elevation, na.rm = TRUE), .groups = "drop")

    diffs <- sa |> inner_join(mca, by = "replicate") |>
      mutate(diff = xbar_sa - xbar_mca)

    sd(diffs$diff)
    sd(sa$xbar_sa)
    sd(mca$xbar_mca)
    sqrt(sd(sa$xbar_sa)^2 + sd(mca$xbar_mca)^2)
  prompt: |-
    **SE of a difference, checked numerically.** EX 7.25 built the sampling distribution of $\bar{X}_{SA} - \bar{X}_{MCA}$. The snippet here computes three numbers: $SD$ of the difference distribution, $SD$ of each region's $\bar{X}$ distribution alone, and $\sqrt{SD_{SA}^2 + SD_{MCA}^2}$. Run it. Is the SD of the difference closer to $SD_{SA}$, to $SD_{MCA}$, or to $\sqrt{SD_{SA}^2 + SD_{MCA}^2}$? In one sentence, why does *combining* two independent sources of sampling variation give a wider, not narrower, spread?
  book_section: 7.5 Sampling distribution in other scenarios
  book_subsection: 7.5.1 Sampling distribution for two samples (difference)
- ex_num: 47
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # your exploration here
  prompt: |-
    **Center of the two-sample sampling distribution.** The mean of the $\bar{X}_{SA} - \bar{X}_{MCA}$ sampling distribution should sit close to the *population* mean difference $\mu_{SA} - \mu_{MCA}$. The snippet computes both: the *population* difference (computed once over all volcanoes in each region) and the *mean of the sampling distribution* of differences. Compare them. Are they essentially equal? What property of the sample mean as an estimator are you observing here, applied to *differences* of means?
  book_section: 7.5 Sampling distribution in other scenarios
  book_subsection: 7.5.1 Sampling distribution for two samples (difference)

