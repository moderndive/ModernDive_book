  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    sim_se <- function(reps) {
      sd(replicate(reps, mean(sample(volcanoes$elevation, 30, replace = TRUE))))
    }
    reps_grid <- c(50, 200, 1000, 5000, 20000)
    se_estimates <- sapply(reps_grid, sim_se)
