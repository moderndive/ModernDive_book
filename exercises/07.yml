    Treat `exoplanets::planets$radius_earth` as a population. The distribution is heavily right-skewed. Take 1,000 samples of $n = 30$ and 1,000 of $n = 200$, and compare the two sampling distributions visually in one faceted chart.

    Getting both onto one chart means *stacking* the two sampling-distribution data frames into a single taller one. The tool for that is `dplyr::bind_rows()`, a function beyond the book's chapters (extension EX 3.58 introduced it), which takes two or more data frames with the same columns and stacks their rows. Here is the pattern, worked on the volcano sampling distributions you built in EX 7.9 and EX 7.11:

    ```r
    bind_rows(
      samp_dist_30  |> mutate(n = "n = 30"),
      samp_dist_100 |> mutate(n = "n = 100")
    )
    ```

    The `mutate()` calls first tag each row with its source, and that tag is exactly what `facet_wrap()` needs to draw one panel per sample size. Apply the same pattern to the two `planets` sampling distributions.
