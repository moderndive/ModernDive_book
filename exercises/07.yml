chapter_meta:
  coverage_note: |-
    **A note on coverage.** *Section 7.4 (the chocolate-almond activity for the sample mean) appears 0 here, but the volcano-elevation exercises EX7.5–EX7.17 deliberately mirror the same structure on a different population*, single sample, virtual replicates, sampling distribution, CLT, so 7.4 is *implicitly* exercised throughout the chapter. **Section 7.2** (vocabulary) is exercised by EX7.13 and EX7.45 (terminology paragraph). **Section 7.5.1** (two-sample sampling distribution) is exercised by EX7.25 plus EX7.46 (SE of a difference, checked numerically) and EX7.47 (center of the two-sample sampling distribution).

    Difficulty: ★ warm-up · ★★ standard · ★★★ critical thinking.
