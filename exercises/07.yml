  group: Setup and population statistics
  webr: |-
    ?volcanoes
    # The same page lives on the package website:
    # https://moderndive.github.io/volcanoes/reference/volcanoes.html
  prompt: |-
    **Meet the data.** This chapter's exercises treat `volcanoes` (from the `volcanoes` package) as a *population*, so start by learning exactly what that population is. Run `?volcanoes` (the same page lives on the package website at <https://moderndive.github.io/volcanoes/reference/volcanoes.html>) and answer from the documentation:

    - (a) What is the *observational unit*, and what real-world collection does the dataset cover: is it "all the world's volcanoes"?
    - (b) What does `elevation` measure, and in what units? What would a *negative* elevation mean?
    - (c) What does `last_eruption_year` record, and what do `NA` and *negative* values in it mean?

    Finish by confirming the row and column counts with `glimpse(volcanoes)`.
  book_section: '7.1 First activity: red balls'
  book_subsection: 7.1.1 Population statistics ($\mu$, $\sigma$, $p$)
