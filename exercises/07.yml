  prompt: |-
    **Cluster sampling vs stratified sampling.** Both are alternatives to simple random sampling. **Stratified** divides the population into groups and samples from *each* group (good for representativeness across groups). **Cluster** sampling picks whole groups at random and surveys *everyone* in the chosen groups (cheaper logistically, e.g., pick 20 schools rather than 1000 random students from 500 schools, then survey all the students in the chosen schools). In 2-3 sentences, give a realistic scenario where you'd choose cluster sampling over simple random sampling, and a different scenario where you'd choose stratified.
