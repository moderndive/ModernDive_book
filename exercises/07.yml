      summarize(xbar = mean(elevation), .groups = "drop")
    identical(x1, tidy_means$xbar)   # different style, same seed -> ?
  prompt: |-
    **`set.seed()` and reproducibility.** Any code that uses random number generation produces *different* numbers each time, unless you call `set.seed(N)` first, which makes the random sequence deterministic. Base R's `replicate()` is another way of doing the sampling (it repeats an expression a fixed number of times), but it doesn't extend as nicely from the tidyverse workflow the chapter uses. Run the snippet, which does the experiment both ways, each freshly seeded with `set.seed(76)`: twice with `replicate()` plus `sample()`, and once with `rep_slice_sample()`. Do the two `replicate()` runs match each other? Does the `rep_slice_sample()` result match the `replicate()` one, and should you *count* on two differently-written pieces of random code matching just because the seed matches? Why is reproducibility especially important in *published* statistical work?
