- ex_num: 33
  difficulty: 3
  group: Extensions
  webr: |-
    library(tidyr)
    # Imagine a column-name pattern like "score_pre" / "score_post" / "weight_pre" / "weight_post"
    fake <- tibble::tribble(
      ~id, ~score_pre, ~score_post, ~weight_pre, ~weight_post,
      1,   80,         85,          70,          72,
      2,   72,         78,          85,          84
    )
    fake |>
      pivot_longer(
        cols = -id,
        names_to = c("measure", "time"),
        names_pattern = "(.*)_(.*)"
      )
  prompt: |-
    **`pivot_longer(names_pattern = ...)`.** When column names pack multiple pieces of info (e.g., `score_pre` / `score_post`), a single capture-group regex passed to `names_pattern` splits each name into its own destination column, turning *two* dimensions of structure into *two* tidy columns in one pivot. Run the snippet, then describe in one sentence what the four output rows per `id` represent.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 34
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`pivot_wider(values_fn = ...)`.** When the cells you want to fill require *aggregation* (multiple input rows feed each output cell), pass an aggregation function to `values_fn`. Use it on `olympic_athletes` to build a wide table with one row per `noc` and columns for `Summer` and `Winter` counts at the 2024 Games. Why is `values_fn` necessary here, but not in the standard "long → wide" pivot from the chapter?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 35
  difficulty: 3
  group: Extensions
  webr: |-
    library(tidyr)
    nested <- olympic_athletes |>
      filter(games == "2024 Summer") |>
      group_by(noc) |>
      tidyr::nest()                # one row per noc, athletes packed into a list-column

    nested

    # Unpack one country's athletes back to a normal data frame:
    nested |> filter(noc == "USA") |> unnest(data)
  prompt: |-
    **List-columns with `nest()` / `unnest()`.** A *list-column* is a column where each cell holds an entire object (e.g., a smaller data frame). `nest()` collapses your data by group, `unnest()` expands it back. This pattern is the gateway to fitting *one model per group*, plotting *one chart per group*, or storing per-group artifacts alongside the metadata. Run the snippet above. Briefly: what kind of analysis becomes natural with nested data that's awkward with flat data?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 36
  difficulty: 2
  group: Extensions
  webr: |-
    library(readxl)
    # If you have an .xlsx file at hand:
    # df <- read_excel("path/to/your/file.xlsx", sheet = 1, skip = 0)
    # df
  prompt: |-
    **Reading Excel files with `readxl::read_excel()`.** Real-world data often arrives as `.xlsx` files with multiple sheets, merged-cell headers, and trailing notes rows. `read_excel("path.xlsx", sheet = 1, skip = 0)` is the workhorse, `sheet` picks which tab, `skip` discards header rows, `range = "B2:F100"` reads a sub-range. If you have an Excel file available, try reading it; otherwise, describe in 2 sentences when `read_excel()` would be the right choice over `read_csv()`.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 37
  difficulty: 2
  group: Extensions
  webr: |-
    library(janitor)
    messy <- tibble::tribble(
      ~`Country Code`, ~`Total Medals (2024)`, ~`Gold!!`,
      "USA",            126,                     40,
      "CHN",             91,                     40
    )
    messy |> clean_names()
  prompt: |-
    **Standardizing messy column names with `janitor::clean_names()`.** Imported data often has column names like `"Total Medals (2024)"` or `"Gold!!"`, readable by humans, painful to type in code. `janitor::clean_names()` rewrites every column name into snake_case ASCII (`total_medals_2024`, `gold`). Run it on the `messy` tibble. In a real workflow, the very first step after `read_csv()` or `read_excel()` is often `|> clean_names()`. Why?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 38
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Saving data with `readr::write_csv()`.** Once you've wrangled a dataset, you'll usually want to save the result for downstream work. `write_csv()` is the tidyverse-style writer (no row names, UTF-8 by default, fast). Save just the 2024 Summer medal table to a temp file and read it back to confirm the round-trip preserved the data. Briefly: why prefer `write_csv()` over base R's `write.csv()`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  difficulty: 3
  group: Extensions
  webr: |-
    library(tidyr)
    sparse <- olympic_athletes |>
      filter(sport == "Basketball", year %in% c(2016, 2020, 2024)) |>
      count(year, sex) |>
      complete(year, sex, fill = list(n = 0))
    sparse
  prompt: |-
    **`tidyr::complete()` for implicit missing combinations.** If your data lacks a row for some combination of variables (e.g., a Games where one sex didn't compete), summary tables silently skip those cells, a hidden form of missingness. `complete(year, sex, fill = list(n = 0))` fills in every (year × sex) pair, defaulting missing counts to 0. Run the snippet. Why is this safer than just plotting the original counts and assuming the gaps are zeros?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  difficulty: 2
  group: Extensions
  webr: |-
    library(tidyr)
    # Two ways to drop rows with NAs in specific columns:
    olympic_athletes |> filter(!is.na(height), !is.na(weight)) |> nrow()
    olympic_athletes |> drop_na(height, weight) |> nrow()
  prompt: |-
    **`drop_na()` vs `filter(!is.na())`.** Both remove rows with missing values; `drop_na(col1, col2)` is shorter and reads more clearly when you have many columns. `drop_na()` with no arguments drops rows with *any* NA, convenient but easy to misuse if you'd rather drop only by specific columns. Run both forms and confirm they return the same row count. When would `drop_na()` (no args) silently remove more rows than you intended?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  difficulty: 2
  group: Extensions
  webr: |-
    olympic_athletes |> nrow()
    olympic_athletes |> distinct() |> nrow()
    olympic_athletes |> distinct(name, .keep_all = TRUE) |> nrow()
  prompt: |-
    **`distinct()` for deduplication.** With no arguments, `distinct()` keeps only fully-unique rows. With column names, it deduplicates on those columns (and `.keep_all = TRUE` keeps the other columns from the first matching row). Run the three lines above. How many `olympic_athletes` rows are exact duplicates? How many *unique athletes* appear in the dataset (vs the row count, which is athlete-events)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  difficulty: 3
  group: Extensions
  prompt: |-
    **Long vs wide trade-offs.** Section 4.2 noted that "tidy" (long) format is what `dplyr`/`ggplot2` expect. But there are real cases where *wide* format is preferable. In 2-3 sentences each, give an example of when *wide* would be the right format for: **(a)** human reading (a printed summary table), **(b)** another tool (e.g., a stats procedure or external software), and **(c)** storage on disk (file size or query speed). For each, explain why wide beats long for that specific purpose.
  book_section: Extensions
  book_subsection: Extensions

