chapter_meta:
  coverage_note: |-
    **A note on coverage.** Section 4.4 is short (~40 lines) and conceptually straightforward (one umbrella `library()` call vs many), a single exercise (EX4.28) covers it cleanly. Section 4.3 (the Guatemala case study) is a worked example rather than new methodology; EX4.27 acts as a *comprehension* check on the pivoting structure used there.

    Difficulty stars on each exercise: ★ warm-up, ★★ standard application, ★★★ critical thinking. Click *show question* on any callout to reveal the prompt; the solution is always visible underneath.
