- ex_num: 11
  hash: "e4x0"
  difficulty: 2
  group: Scatterplots
  book_section: 2.3 Scatterplots
  book_subsection: 2.3 Scatterplots (`geom_point`)
  prompt: |-
    **Labeling a plot with `labs(...)`.** Section 2.3 built this jittered scatterplot of Envoy Airlines flight delays:

    ```r
    ggplot(data = envoy_flights, mapping = aes(x = dep_delay, y = arr_delay)) +
      geom_jitter(width = 30, height = 30)
    ```

    A plot's *title*, *axis labels*, and *caption* are added as one more layer with `labs(title = ..., x = ..., y = ..., caption = ...)`, a function the book uses behind the scenes but doesn't formally cover. Here it is applied to the Envoy chart:

    ```r
    ggplot(data = envoy_flights, mapping = aes(x = dep_delay, y = arr_delay)) +
      geom_jitter(width = 30, height = 30) +
      labs(
        title   = "Envoy Airlines flights that depart late tend to arrive late",
        x       = "Departure delay (minutes)",
        y       = "Arrival delay (minutes)",
        caption = "Source: envoy_flights (moderndive)"
      )
    ```

    **Your turn:** build a scatterplot of `weight` (y) vs `height` (x) for the Paris 2024 athletes (`olympic_athletes_2024`), then add a `labs(...)` layer of your own giving it a `title`, `x` and `y` axis labels *with units* (cm and kg), and a `caption` naming the data source. Why are good labels especially important when you share a plot with someone who can't see your code?
  webr: |-
    # Build the scatterplot, then add a labs() layer with title, x, y, and caption
    ggplot(olympic_athletes_2024, aes(x = height, y = weight)) +
      geom_point(alpha = 0.3)
