- ex_num: 46
  hash: "0ti2"
  difficulty: 3
  group: Extensions
  webr: |-
    # Sample down for a quick loess demo (loess on 300k rows is multi-minute):
    set.seed(76)
    oa_sample <- olympic_athletes |> slice_sample(n = 5000)

    base <- ggplot(oa_sample, aes(x = height, y = weight)) +
      geom_point(alpha = 0.2) + geom_smooth(method = "loess")

    # ylim() trims data outside the range BEFORE fitting, affects the smoother
    p_trim <- base + ylim(50, 120)

    # coord_cartesian() zooms AFTER fitting, smoother sees all data
    p_zoom <- base + coord_cartesian(ylim = c(50, 120))

    library(patchwork)
    p_trim + p_zoom
  prompt: |-
    **`ylim()` vs `coord_cartesian()`.** Both restrict the y-axis range, but `ylim()` *removes* points outside the range *before* statistics like `geom_smooth()` run, while `coord_cartesian(ylim = ...)` *zooms* the view *after* statistics run. Run the starter code below, which builds the `ylim()` version and the `coord_cartesian()` version side by side. Why does the smoother differ between the two panels?
  book_section: Extensions
  book_subsection: Extensions
