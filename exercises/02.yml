- ex_num: 46
  difficulty: 3
  group: Extensions
  webr: |-
    # Loess fitting is O(n^2); sample down to ~5000 rows for a quick render.
    set.seed(76)
    # your exploration here
  prompt: |-
    **Nonlinear smoothing with `loess`.** `geom_smooth(method = "loess")` draws a locally-fitted curve through the data, no equation required, handy for spotting *shape* before committing to a model. We sample down to 5000 rows before fitting because loess on the full 300k-row data takes *several minutes*. Where does the curve depart from a straight line? (This previews Chapter 5, which formally introduces *linear* regression with `method = "lm"`.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 47
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Interactive ggplots with `plotly::ggplotly()`.** A single function call turns any ggplot into an interactive widget, readers can hover for tooltips, zoom, and pan. Try it on a height-vs-weight scatter colored by `sport`. When is the interactive version genuinely more useful than a static one? When does it just add load time without adding insight?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 48
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Composing multiple plots with `patchwork`.** The `patchwork` package lets you arrange ggplots in arbitrary grids using `+` (side-by-side), `/` (stacked), and parentheses. Build a 2-on-top, 1-on-bottom layout showing histograms of `age`, `height`, and `weight`. Briefly, why is patchwork a better choice here than building a faceted plot with `facet_wrap()`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 49
  difficulty: 3
  group: Extensions
  webr: |-
    # Sample down for a quick loess demo (loess on 300k rows is multi-minute):
    set.seed(76)
    oa_sample <- olympic_athletes |> slice_sample(n = 5000)

    base <- ggplot(oa_sample, aes(x = height, y = weight)) +
      geom_point(alpha = 0.2) + geom_smooth(method = "loess")

    # ylim() trims data outside the range BEFORE fitting, affects the smoother
    p_trim <- base + ylim(50, 120)

    # coord_cartesian() zooms AFTER fitting, smoother sees all data
    p_zoom <- base + coord_cartesian(ylim = c(50, 120))

    library(patchwork)
    p_trim + p_zoom
  prompt: |-
    **`ylim()` vs `coord_cartesian()`.** Both restrict the y-axis range, but `ylim()` *removes* points outside the range *before* statistics like `geom_smooth()` run, while `coord_cartesian(ylim = ...)` *zooms* the view *after* statistics run. Run the comparison above. Why does the smoother differ between the two panels?
  book_section: Extensions
  book_subsection: Extensions
