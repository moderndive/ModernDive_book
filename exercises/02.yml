chapter_meta:
  empty_sections: 2.2 Five named graphs (5NG)
  empty_sections_after: 2.1 The grammar of graphics
  coverage_note: |-
    **A note on coverage.** Section 2.2 ("Five named graphs") is a 15-line transition. It lists the geoms covered next and has nothing to assess on its own; the *named graphs themselves* (Sections 2.3–2.8) carry all the practice.

    Difficulty stars on each exercise: ★ warm-up, ★★ standard application, ★★★ critical thinking. Click *show question* on any callout to reveal the prompt; the solution is always visible underneath.
