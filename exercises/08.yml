  webr: '# your exploration here'
  prompt: |-
    Open exploration: pick any numerical or proportion-style quantity from `volcanoes`, `olympic_athletes`, or `episodes`. All three tables are complete catalogs, so run the chapter's device: draw a seeded random sample (n = 50 to 100 rows), build a CI for your quantity from the sample (theory or bootstrap), then check it against the full-catalog truth. Interpret in plain language and write a 1–2 sentence finding.

    Good candidates: mean or median `elevation` in `volcanoes` (no missing values); the proportion of volcanoes with a recorded eruption in 2000 CE or later (about a fifth); mean `height` of `olympic_athletes` (drop the missing rows and say so); the proportion of athletes who medaled; mean `imdb_rating` of `episodes`; the proportion of episodes rated 8 or higher.

    Steer clear of: **identifiers** like `volcano_number` or the athlete `id` (an "average catalog number" estimates nothing about the world); **coordinates** like `latitude`/`longitude` (a mean latitude of volcanoes scattered across both hemispheres isn't a meaningful parameter); **huge-cardinality categoricals** like `country` in `volcanoes` (nearly 90 countries, most with only a handful of volcanoes, so any per-country proportion gets an unusably wide CI); and **years treated as plain numbers** like `last_eruption_year` (about 30% missing, and missing there means only *undated* activity is known — not "never erupted", since every volcano in this catalog is Holocene-active — so dropping those rows biases any "mean year" toward the better-documented, more recently active volcanoes).
  book_section: Critical thinking / synthesis (cross-section)
  book_subsection: Critical thinking / synthesis (CI interpretation, sample size,
    bootstrap concepts)
