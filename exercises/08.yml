- ex_num: 34
  difficulty: 2
  group: Extensions
  webr: |-
    xbar <- mean(volcanoes$elevation, na.rm = TRUE)
    se   <- sd(volcanoes$elevation, na.rm = TRUE) / sqrt(sum(!is.na(volcanoes$elevation)))
    c(lower = xbar - 1.96 * se, point = xbar, upper = xbar + 1.96 * se)
  prompt: |-
    **Normal-approximation CI by formula.** Chapter 8 built CIs by bootstrap simulation. The classical "theory-based" 95 % CI is $\bar{X} \pm 1.96 \times SE$, where $SE = s / \sqrt{n}$. Compute it for `volcanoes$elevation`. When does this normal-approximation CI agree closely with the bootstrap percentile CI from § 8.2? When would the two diverge?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 35
  difficulty: 2
  group: Extensions
  webr: |-
    successes <- sum(bob_ross$tree == 1)
    n <- nrow(bob_ross)
    prop.test(successes, n, conf.level = 0.95)
  prompt: |-
    **`prop.test()` for proportion CIs.** Base R's `prop.test(x, n)` constructs a theory-based (Wilson) CI for a single proportion. Run it on "fraction of Bob Ross episodes featuring a tree." Compare its CI to a bootstrap percentile CI from `infer` (from EX 8.x of the main exercises). Why is the Wilson CI usually preferred over the naive $\hat{p} \pm 1.96 \cdot \sqrt{\hat{p}(1-\hat{p})/n}$ formula, especially when $\hat{p}$ is near 0 or 1?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 36
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    big_two_names <- volcanoes |>
      count(region, sort = TRUE) |>
      head(2) |>
      pull(region)
    big_two <- volcanoes |> filter(region %in% big_two_names)

    boot_diff <- big_two |>
      specify(elevation ~ region) |>
      generate(reps = 500, type = "bootstrap") |>
      calculate(stat = "diff in means",
                order = big_two_names)

    boot_diff |> get_confidence_interval(level = 0.95, type = "percentile")
  prompt: |-
    **CI for a difference of means.** Chapter 8 covered CIs for *one* mean or proportion at a time. The same `infer` workflow handles *differences* — just specify `response ~ explanatory` and `calculate(stat = "diff in means")`. Build a 95 % CI for the difference in mean elevation between the two most common volcano regions. Why is a CI for a *difference* often the right summary when you want to compare two groups?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 37
  difficulty: 2
  group: Extensions
  webr: |-
    set.seed(76)
    boot <- volcanoes |>
      specify(response = elevation) |>
      generate(reps = 500, type = "bootstrap") |>
      calculate(stat = "mean")

    ci90 <- boot |> get_confidence_interval(level = 0.90, type = "percentile")
    ci95 <- boot |> get_confidence_interval(level = 0.95, type = "percentile")
    ci99 <- boot |> get_confidence_interval(level = 0.99, type = "percentile")
    list(ci90 = ci90, ci95 = ci95, ci99 = ci99)
  prompt: |-
    **Width-vs-confidence tradeoff.** Why don't we always use a 99.9 % CI? Because the price of higher confidence is a *wider* interval — less informative about the parameter. Build 90 %, 95 %, and 99 % CIs for `volcanoes$elevation` mean. Roughly how much wider is the 99 % CI than the 95 %? When in real reporting would 90 % be the right choice over 95 %?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 38
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    pop <- volcanoes |> filter(!is.na(elevation))
    mu  <- mean(pop$elevation)
    n   <- 50

    # For each of 200 simulated samples, build a 95% bootstrap CI and check coverage
    coverage_results <- replicate(200, {
      samp <- pop |> slice_sample(n = n)
      ci <- samp |>
        specify(response = elevation) |>
        generate(reps = 200, type = "bootstrap") |>
        calculate(stat = "mean") |>
        get_confidence_interval(level = 0.95, type = "percentile")
      mu >= ci$lower_ci & mu <= ci$upper_ci
    })
    mean(coverage_results)
  prompt: |-
    **Coverage simulation.** The "95 %" in a 95 % CI means — *if we drew many samples and built a CI from each, about 95 % of them would contain the true population mean.* The snippet draws 200 fresh samples from `volcanoes` and builds a bootstrap percentile CI from each (using the chapter's `infer` workflow). Why does the empirical coverage rate land near 95 % but not *exactly* at 95 %? What would make it drift further from 95 % (think — assumption violations or small per-sample $n$)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    boot <- volcanoes |>
      specify(response = elevation) |>
      generate(reps = 500, type = "bootstrap") |>
      calculate(stat = "mean")

    ci_pct <- boot |> get_confidence_interval(level = 0.95, type = "percentile")
    ci_se  <- boot |> get_confidence_interval(
                       level = 0.95, type = "se",
                       point_estimate = mean(volcanoes$elevation, na.rm = TRUE))
    list(percentile = ci_pct, se_method = ci_se)
  prompt: |-
    **Bootstrap SE method vs percentile method.** Chapter 8's bootstrap CIs used the **percentile method** (cut the bootstrap distribution at the 2.5 % and 97.5 % quantiles). An alternative is the **SE method** — $\bar{X} \pm 1.96 \times SE_{boot}$ — which uses the bootstrap *only* to estimate the SE and otherwise treats the sampling distribution as normal. Compute both and compare. When are they nearly identical? When would percentile be the better choice?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    boot_med <- volcanoes |>
      specify(response = elevation) |>
      generate(reps = 1000, type = "bootstrap") |>
      calculate(stat = "median")
    boot_med |> get_confidence_interval(level = 0.95, type = "percentile")
  prompt: |-
    **CI for a *median*.** Theory-based CIs for the mean rely on the CLT and the sample variance; for the *median*, there is no equally simple closed-form. The bootstrap percentile method works the same way — just calculate `stat = "median"`. Build a 95 % CI for the median elevation of `volcanoes`. Why is the bootstrap especially valuable for summaries other than the mean?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    pl <- planets |> filter(!is.na(radius_earth), !is.na(mass_earth))
    boot_cor <- replicate(500, {
      idx <- sample(seq_len(nrow(pl)), nrow(pl), replace = TRUE)
      cor(pl$radius_earth[idx], pl$mass_earth[idx])
    })
    quantile(boot_cor, c(0.025, 0.975))
  prompt: |-
    **Bootstrap CI for a correlation.** Like the median, a correlation coefficient doesn't have an easy closed-form CI — but a hand-rolled bootstrap does the job. The snippet bootstraps Pearson's correlation between `radius_earth` and `mass_earth` and returns a 95 % percentile CI. Does the CI exclude zero? What would that imply about the relationship?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  difficulty: 2
  group: Extensions
  webr: |-
    xbar <- mean(volcanoes$elevation, na.rm = TRUE)
    se   <- sd(volcanoes$elevation, na.rm = TRUE) / sqrt(sum(!is.na(volcanoes$elevation)))

    z_star <- 1.96
    moe <- z_star * se

    cat(sprintf("Point estimate: %.1f m\n", xbar))
    cat(sprintf("Margin of error: %.1f m (= %.2f × %.1f)\n", moe, z_star, se))
    cat(sprintf("95%% CI: (%.1f, %.1f)\n", xbar - moe, xbar + moe))
  prompt: |-
    **Margin of error vocabulary.** News reports often present a CI as "point estimate $\pm$ margin of error" — *"the candidate leads 52 % to 48 %, with a margin of error of $\pm 3$ percentage points."* The **margin of error (MOE)** is just $z^* \times SE$ — the *half-width* of a symmetric CI. Run the snippet, which explicitly decomposes the CI into $\bar{X} \pm \text{MOE}$. Why do news outlets prefer the MOE phrasing over the raw CI endpoints in their headlines?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 43
  difficulty: 3
  group: Extensions
  prompt: |-
    **Bayesian credible intervals — a one-paragraph contrast.** A frequentist 95 % CI is interpreted via the *procedure* — "if I built many CIs the same way, 95 % would contain the true parameter." A Bayesian **95 % credible interval** is interpreted via the *parameter* — "given the data and my prior beliefs, there's a 95 % probability the true parameter lies in this range." In 2-3 sentences, describe a context where the Bayesian interpretation would be more *useful* in plain-English communication with a non-statistical audience, and a context where you'd prefer the frequentist version (no Bayesian software setup required).
  book_section: Extensions
  book_subsection: Extensions

