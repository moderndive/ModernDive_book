chapter_meta:
  coverage_note: |-
    **A note on coverage.** Section 8.3 (Additional remarks about the bootstrap) is mostly *philosophical* — it explains *when* and *why* the bootstrap works rather than introducing new methodology. EX8.16 exercises Section 8.3.2 (*rate of convergence*) by simulation. The critical-thinking section bundles all the cross-cutting prompts (interpretation, sample-size effects, when-bootstrap-fails, synthesis).

    Difficulty: ★ warm-up · ★★ standard · ★★★ critical thinking.
exercises:
- ex_num: 1
  difficulty: 1
  group: Theory-based CIs
  webr: |-
    set.seed(76)
    samp <- volcanoes |> rep_slice_sample(n = 50) |> ungroup()

    samp |>
      summarize(
        xbar = mean(elevation, na.rm = TRUE),
        s    = sd(elevation, na.rm = TRUE),
        n    = sum(!is.na(elevation))
      ) |>
      mutate(
        lower = xbar - qt(0.975, df = n - 1) * s / sqrt(n),
        upper = xbar + qt(0.975, df = n - 1) * s / sqrt(n)
      )
  prompt: 'Take a single random sample of $n = 50$ from `volcanoes`. Compute $\bar{x}$,
    $s$, and a **theory-based 95% t-CI** for the mean `elevation`. Hint: `xbar ± qt(0.975,
    df = n-1) * s/sqrt(n)`.'
  book_section: 8.1 Tying the sampling distribution to estimation
  book_subsection: 8.1.4 The t distribution
- ex_num: 2
  difficulty: 2
  group: Theory-based CIs
  webr: |-
    mu <- mean(volcanoes$elevation, na.rm = TRUE)
    mu
  prompt: Recall $\mu \approx$ population-mean elevation from Chapter 7. Does your
    CI contain $\mu$? Why isn't this a guarantee?
  book_section: 8.1 Tying the sampling distribution to estimation
  book_subsection: 8.1.2 Normal distribution / 8.1.3 The confidence interval
- ex_num: 3
  difficulty: 1
  group: Theory-based CIs
  prompt: What is the **standard error** of $\bar{x}$ in EX8.1, expressed using only
