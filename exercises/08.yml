  hash: "8tko"
  difficulty: 3
  group: Extensions
  prompt: |-
    **Bayesian credible intervals: a conceptual contrast.** Everything in this chapter has been *frequentist*: probability describes how often a *procedure* succeeds across many hypothetical repetitions, so a frequentist 95 % CI is read "if I built many CIs the same way, about 95 % of them would contain the true parameter."

    There is a second school of statistical thought. A Bayesian analysis starts from a **prior**: a probability distribution, written down *before* seeing any data, that says which parameter values you consider more or less plausible (for example, "a coin's chance of heads is probably near 0.5" or "the average volcano elevation is probably somewhere between sea level and a few thousand meters"). The data then *update* the prior using **Bayes' rule** (the same idea as updating a belief after new evidence) into the **posterior**: a distribution describing what you believe about the parameter *after* seeing the data. In the Bayesian view the parameter itself gets a probability distribution, something frequentist methods deliberately avoid.

    A **95 % credible interval** is an interval containing 95 % of that posterior. It is read exactly the way most people *want* to read a CI: "given the data and my prior, there is a 95 % probability the true parameter lies in this range" (compare EX 8.5, where that sentence was *wrong* for a frequentist CI). With plenty of data and a mild prior, the two kinds of interval are usually numerically similar; they differ most visibly when the sample is small or the prior is strong, because then the prior's opinion still carries real weight in the posterior.

    In 2-3 sentences, describe a context where the Bayesian interpretation would be more *useful* in plain-English communication with a non-statistical audience, and a context where you'd prefer the frequentist version (no Bayesian software setup required).
  book_section: Extensions
  book_subsection: Extensions
