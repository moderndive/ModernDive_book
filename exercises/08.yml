chapter_meta:
  coverage_note: |-
    **A note on coverage.** Section 8.3 (Additional remarks about the bootstrap) is mostly *philosophical*. It explains *when* and *why* the bootstrap works rather than introducing new methodology. EX8.16 exercises Section 8.3.2 (*rate of convergence*) by simulation. The critical-thinking section bundles all the cross-cutting prompts (interpretation, sample-size effects, when-bootstrap-fails, synthesis).

    **A note on the data.** Every dataset in these exercises (`volcanoes`, `olympic_athletes`, `episodes`, `bob_ross`) is a *complete catalog*, effectively the population itself, so "estimating" a parameter you could compute directly would be incoherent. The estimation exercises therefore use a sample-then-reveal device throughout: draw a seeded random sample (like EX 8.1's $n = 50$ `samp`), build the CI from the sample alone, then check it against the population truth, a check no real study gets to run. (`exoplanetdata::planets` is the one exception: it is a genuine, though detection-biased, sample of the real population of planets.)

    Difficulty: ★ warm-up · ★★ standard · ★★★ critical thinking.
exercises:
- ex_num: 1
  hash: "qi6e"
  difficulty: 1
  group: Theory-based CIs
  webr: |-
    set.seed(2)   # the n = 50 sample the rest of this chapter reuses (see EX 8.45)
    # your code here
  prompt: |-
    The `volcanoes` data frame holds the complete catalog of Holocene volcanoes, so we can treat it as the *population* and do what a real study never can: sample from it now and check our answers against the truth later. Take a single random sample of $n = 50$ from `volcanoes`. Compute $\bar{x}$, $s$, and a **theory-based 95% t-CI** for the mean `elevation`. The chapter itself plugs in ready-made critical values like 1.96 and 1.98; `qt(0.975, df = ...)` is a new-to-us base R function (shown in Appendix A online) that computes the exact t critical value for your degrees of freedom.

    <details><summary>Need a hint?</summary>

    `xbar ± qt(0.975, df = n-1) * s/sqrt(n)`

    </details>
  book_section: 8.1 Tying the sampling distribution to estimation
  book_subsection: 8.1.4 The t distribution
