  prompt: |-
    **$R^2$, adjusted $R^2$, and the F-statistic: three whole-model summary numbers.** Beyond the per-coefficient regression table, a fitted `lm()` carries three numbers that describe the model as a whole:

    * $R^2$ (introduced in extension EX 5.47), the fraction of variance in $y$ that the fitted model explains. Adding any predictor (useful or not) can only *raise* $R^2$.
    * Adjusted $R^2$, same idea, but penalized for the number of predictors. Adding a *useless* predictor will typically *lower* this (EX 10.59 demonstrates).
    * F-statistic, the omnibus test that *at least one* slope is non-zero ($H_0$: all slopes simultaneously zero).

    The tidy way to retrieve them is `broom::glance(model)`, one of the `broom` tidiers from extension EX 5.45: it returns a one-row tibble of whole-model summaries (`r.squared`, `adj.r.squared`, `statistic`, `p.value`, and more), sparing you the `summary(lm(...))$fstatistic` gymnastics. Fit `lm(weight ~ height + sex, data = vball)` and pull all three from `glance()`'s output. What does the F-test's $p$-value tell you that the per-coefficient $p$-values don't?
