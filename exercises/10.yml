    Reasonable choices (pick a *single sport* first; pooling all sports mixes very different body-type populations, the aggregation trap of EX 10.53): `weight ~ height` for Swimming, Rowing, or Basketball; `height ~ year` for a sport of your choice (is it trending taller?); or `weight ~ age` within a sport. Note that `height` and `weight` are missing for roughly a quarter of rows, so filter with `!is.na()` first.

    Steer clear of: `id` (an arbitrary row label: a "slope per unit of id" means nothing); `medal` (86 % missing, because most athletes don't medal, and it's categorical anyway); and treating `year` as a *categorical* predictor (dozens of levels, one dummy coefficient each, instead of one interpretable slope).
