  webr: |-
    planets_lite <- planets |>
      filter(!is.na(radius_earth), !is.na(mass_earth), !is.na(discovery_method))
    top2 <- planets_lite |>
      count(discovery_method, sort = TRUE) |>
      head(2) |>
      pull(discovery_method)
    pl2 <- planets_lite |> filter(discovery_method %in% top2)

    set.seed(2024)
    observed_fit <- pl2 |>
      specify(mass_earth ~ radius_earth + discovery_method) |>
      fit()

    null_distn <- pl2 |>
      specify(mass_earth ~ radius_earth + discovery_method) |>
      hypothesize(null = "independence") |>
      generate(reps = 500, type = "permute") |>
      fit()

    null_distn |>
      get_p_value(obs_stat = observed_fit, direction = "two-sided")

    visualize(null_distn) +
      shade_p_value(obs_stat = observed_fit, direction = "two-sided")
