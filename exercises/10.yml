      labs(x = "Height (cm)", y = "Weight (kg)", color = "Sport")
  prompt: |-
    **Simpson's paradox in real data.** When you collapse across groups, the *pooled* slope can have the opposite sign (or a very different magnitude) than the *within-group* slope. The pattern is famous because it's *not* a math trick, it's the same data, summarized differently, telling different stories. Run the snippet on Curling + Volleyball: it compares the pooled and per-sport slopes numerically, then plots the two sports in different colors with each sport's own fitted line plus the pooled line (black, dashed) so you can *see* the aggregate line cutting a shallower path than either group's line. Briefly, which is the "true" story, and how would you decide *when* to report the pooled vs the per-group slope?
