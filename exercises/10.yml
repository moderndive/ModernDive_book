    # Pooled vs. within-sport slopes for Curling + Volleyball: collapsing the
    # two sports into one cloud mixes the between-sport gap into the slope, so
    # the pooled kg-per-cm slope comes out SHALLOWER than either within-sport slope.
    set.seed(76)
    library(olympicAthletes)
    sub <- olympic_athletes |>
      filter(sport %in% c("Curling", "Volleyball"),
             !is.na(height), !is.na(weight))

    pooled <- coef(lm(weight ~ height, data = sub))[2]
    per_sport <- sub |>
      group_by(sport) |>
      summarize(slope = coef(lm(weight ~ height))[2], .groups = "drop")
    list(pooled_slope = pooled, per_sport = per_sport)

    # Make the contrast visible: per-sport lines (colored) vs pooled line (black dashed)
    ggplot(sub, aes(x = height, y = weight)) +
      geom_point(aes(color = sport), alpha = 0.3) +
      geom_smooth(aes(color = sport), method = "lm", se = FALSE) +
