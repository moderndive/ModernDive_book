- ex_num: 43
  difficulty: 3
  group: Extensions
  webr: |-
    # m_b is the simple-LR weight-vs-height model from earlier in this chapter
    new_players <- data.frame(height = c(180, 200, 220))

    # Confidence interval: where might the MEAN weight at this height be?
    predict(m_b, newdata = new_players, interval = "confidence")
    # Prediction interval: where might an INDIVIDUAL player's weight at this height be?
    predict(m_b, newdata = new_players, interval = "prediction")
  prompt: |-
    **Prediction intervals: `predict(interval = "prediction")`.** The chapter's CI on the slope is uncertainty about the *line itself*. A **prediction interval** is uncertainty about an *individual new observation*, wider than the CI because it adds in the spread of individuals around the line. Run both forms and compare widths. In plain English, when would a stakeholder want the prediction interval rather than the confidence interval?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 44
  difficulty: 3
  group: Extensions
  webr: |-
    # Cook's distance flags points that disproportionately influence the fit
    cd <- cooks.distance(m_b)
    high_influence <- which(cd > 4 / length(cd))
    length(high_influence)        # how many "high-influence" rows?
    head(sort(cd, decreasing = TRUE))

    # Plot Cook's distance:
    plot(cd, type = "h", main = "Cook's distance",
         ylab = "D", xlab = "Observation")
    abline(h = 4 / length(cd), col = "red", lty = 2)
  prompt: |-
    **Cook's distance, leverage, and influential points.** Some observations matter more to the fitted line than others, a few high-leverage outliers can drag the slope dramatically. **Cook's distance** quantifies each observation's *influence* on the regression. Rule-of-thumb threshold, $D_i > 4/n$ flags a row for closer inspection. Run the snippet and note the count. What would you *do* with a high-influence observation? (Hint: it's not "delete it" reflexively.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 45
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Confidence band visualization with `geom_smooth(se = TRUE)`.** The chapter's slope CI lives in a regression-table row. Plotting it as a **shaded band around the fitted line** makes the same uncertainty visible to the eye. `geom_smooth(method = "lm", se = TRUE)` draws this band by default. Build it on `bball`. The band is narrowest at the centroid of the data and widest at the tails, why? (This is the visual analog of the Confidence-interval-on-the-mean pattern from EX 10.43.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 46
  difficulty: 3
  group: Extensions
  webr: |-
    # Bootstrap prediction interval for a NEW observation:
    set.seed(76)
    new_height <- 200
    boot_preds <- replicate(500, {
      s <- bball[sample(nrow(bball), nrow(bball), replace = TRUE), ]
      m <- lm(weight ~ height, data = s)
      pred_mean <- coef(m)[1] + coef(m)[2] * new_height
      # Add a residual draw to capture individual-level variation:
      pred_mean + sample(residuals(m), 1)
    })
    quantile(boot_preds, c(0.025, 0.975))
  prompt: |-
    **Bootstrap prediction interval (assumption-light).** Theory-based prediction intervals (EX 10.43) require LINE assumptions. A bootstrap PI gets the same kind of "individual-level" range without those assumptions, for each resample, refit the model, compute the point prediction at the new x, and add a random sampled residual to capture the individual-level scatter. Run the snippet for `height = 200`. Compare its width to the theory-based PI from EX 10.43.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 47
  difficulty: 3
  group: Extensions
  webr: |-
    # Build a binary outcome, "tall" (≥ 190 cm) yes/no:
    bball_log <- bball |> mutate(tall = ifelse(height >= 190, 1, 0))
    # Logistic regression: model the LOG-ODDS of being "tall" as a linear function of weight
    m_logit <- glm(tall ~ weight, data = bball_log, family = "binomial")
    get_regression_table(m_logit)
    # Set exponentiate = TRUE for ODDS RATIOS instead of log-odds coefficients:
    get_regression_table(m_logit, exponentiate = TRUE)
    # get_regression_points returns fitted PROBABILITIES + residuals on the probability scale:
    get_regression_points(m_logit) |> head()
  prompt: |-
    **Logistic regression with `glm()` (`moderndive`).** When the outcome is *binary* (yes/no, present/absent), linear regression is the wrong tool, predicted probabilities can fall outside $[0, 1]$. **Logistic regression**, fit with `glm(... family = "binomial")`, models the log-odds of the outcome and produces sensible probability predictions. The current `moderndive` package accepts `glm()` objects in all three `get_regression_*()` helpers, with `exponentiate = TRUE` giving you **odds ratios** instead of raw log-odds. Run the snippet. How does the interpretation of the slope change in this framework?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 48
  difficulty: 3
  group: Extensions
  webr: |-
    # AIC and BIC for model selection, lower is better. Both penalize complexity.
    m1 <- lm(weight ~ height, data = bball)
    m2 <- lm(weight ~ height + age, data = bball |> filter(!is.na(age)))
    m3 <- lm(weight ~ height + age + sex, data = bball |> filter(!is.na(age)))
    AIC(m1, m2, m3)
    BIC(m1, m2, m3)
  prompt: |-
    **AIC and BIC for model selection.** $R^2$ rewards complexity without penalty; **AIC** and **BIC** are alternative scores that *add* a penalty for each parameter. Both rules, "lower is better." BIC penalizes complexity more harshly than AIC (it tends to pick simpler models). Run the comparison on three nested `bball` models. Do AIC and BIC agree on which model wins? When would they disagree, and what would you do then?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 49
  difficulty: 3
  group: Extensions
  webr: |-
    # Construct a Simpson's paradox setup using bball:
    # Across all sports, taller athletes might weigh LESS per cm (slope < 1)
    # But within each sport, the per-cm slope is steeper (slope > 1)
    set.seed(76)
    library(olympicAthletes)
    sub <- olympic_athletes |>
      filter(sport %in% c("Gymnastics", "Basketball"),
             !is.na(height), !is.na(weight))

    pooled <- coef(lm(weight ~ height, data = sub))[2]
    per_sport <- sub |>
      group_by(sport) |>
      summarize(slope = coef(lm(weight ~ height))[2], .groups = "drop")
    list(pooled_slope = pooled, per_sport = per_sport)
  prompt: |-
    **Simpson's paradox in real data.** When you collapse across groups, the *pooled* slope can have the opposite sign (or a very different magnitude) than the *within-group* slope. The pattern is famous because it's *not* a math trick, it's the same data, summarized differently, telling different stories. Run the snippet on Gymnastics + Basketball. Briefly, which is the "true" story, and how would you decide *when* to report the pooled vs the per-group slope?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 50
  difficulty: 3
  group: Extensions
  webr: |-
    # In-formula transforms now work cleanly with moderndive's get_regression_* helpers
    m_log <- lm(log(weight) ~ height, data = bball)
    get_regression_table(m_log)         # slope interprets as % change in weight per cm
    get_regression_points(m_log) |>     # outcome column is sanitized to log_weight
      head()
  prompt: |-
    **Inference with in-formula transforms (`moderndive`).** Earlier, transforming the outcome (`log(weight)`) inside `lm()` could leak ugly column names like `` `log(weight)` `` into the `get_regression_points()` output. The current `moderndive` package handles this, the LHS transform is sanitized to a clean name like `log_weight`/`log_weight_hat`, and the `get_regression_table()` slope still has a valid CI you can interpret. Run the snippet. In one sentence, what does a slope of, say, 0.012 *mean* on a `log(weight)`-vs-height regression? (Hint: convert via $e^{0.012} \approx 1.012$ → about a 1.2 % change per cm.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 51
  difficulty: 3
  group: Extensions
  webr: |-
    # rlm() fits a robust regression (down-weights influential outliers).
    # We use the qualified MASS::rlm() instead of library(MASS), attaching
    # MASS would mask dplyr::select() in your downstream code.
    m_ols <- lm(weight ~ height, data = bball)
    m_rlm <- MASS::rlm(weight ~ height, data = bball)
    list(ols_slope  = coef(m_ols)["height"],
         rlm_slope  = coef(m_rlm)["height"])
  prompt: |-
    **Robust regression with `MASS::rlm()`.** When LINE diagnostics flag heavy tails or outliers (Ch 10 § 10.2.6), you have two options, (1) trust the bootstrap inference machinery, or (2) switch to an **estimator that's less sensitive to extreme values**. **`MASS::rlm()`** (robust linear model) iteratively down-weights observations with large residuals. Run both fits and compare slopes. When would you prefer `rlm()` over OLS, and what do you give up in exchange?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 52
  difficulty: 3
  group: Extensions
  webr: |-
