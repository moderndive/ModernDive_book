    Physically sensible predictors to pick from: `insolation_earth` (how much stellar energy the planet receives, in multiples of what Earth gets; note it's missing for about 30 % of planets, so filter `!is.na()` first), `star_temp_k`, `star_radius_solar`, `semi_major_axis_au` (orbital distance), or `orbital_period_days`.

