chapter_meta:
  coverage_note: |-
    **A note on coverage.** *Sections 10.1 (the simple-LR model) and 10.4 (the multiple-LR model) appear with 0 exercise rows above*: they are **conceptual setups** for the inference machinery that follows, and EX 10.27 ("What's *the population* in regression here?") plus the practical/interpretation block effectively quizzes those setup ideas.

    Difficulty: ★ warm-up · ★★ standard · ★★★ critical thinking.
