  prompt: |-
    **$R^2$, adjusted $R^2$, and the F-statistic: three whole-model summary numbers.** Beyond the per-coefficient regression table, `summary(lm(...))` reports three numbers that describe the model as a whole:

    * $R^2$, the fraction of variance in $y$ that the fitted model explains. Adding any predictor (useful or not) can only *raise* $R^2$.
    * Adjusted $R^2$, same idea, but penalized for the number of predictors. Adding a *useless* predictor will typically *lower* this (EX 55 demonstrates).
    * F-statistic, the omnibus test that *at least one* slope is non-zero ($H_0$: all slopes simultaneously zero).

    Fit `lm(weight ~ height + sex, data = bball)` and pull all three. What does the F-test's $p$-value tell you that the per-coefficient $p$-values don't?
