  book_section: Residual diagnostics (cross-cuts 5.1.3/5.2.3)
  book_subsection: Residual diagnostics & model fit (5.1.3 + 5.2.3)
- ex_num: 26
  difficulty: 3
  group: Correlation is not necessarily causation
  webr: '# your code here'
  prompt: Build a regression of `height` on `year` for `bball`. Report and interpret
