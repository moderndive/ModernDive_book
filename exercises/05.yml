  book_section: 5.3 Related topics
  book_subsection: 5.3.1 Correlation is not necessarily causation
- ex_num: 27
  difficulty: 3
  group: Correlation is not necessarily causation
  prompt: A reader sees your slope from EX5.26 and concludes "Olympic basketball *causes*
    people to grow taller every year." Use the chapter's discussion of **correlation
    vs causation** to refute this in 2–3 sentences.
  book_section: 5.3 Related topics
  book_subsection: 5.3.1 Correlation is not necessarily causation
- ex_num: 28
  difficulty: 3
  group: Correlation is not necessarily causation
  prompt: '*Sport* is plausibly a strong confounder of the all-athletes Height–Weight
    relationship. What''s a simple way to *control* for sport without fitting a multiple
    regression yet?'
  book_section: 5.3 Related topics
  book_subsection: 5.3.1 Correlation is not necessarily causation
- ex_num: 29
  difficulty: 2
  group: Best-fitting line
  webr: |-
    toy <- data.frame(x = c(1, 2, 3, 4), y = c(2, 4, 5, 9))
    # your code here
  prompt: 'Make the least-squares idea concrete on a tiny toy dataset: `x = c(1, 2,
    3, 4)`, `y = c(2, 4, 5, 9)`. (a) Fit `lm(y ~ x)` and read off the slope and intercept.
    (b) Compute the fitted values $\hat{y}_i$ and the residuals $y_i - \hat{y}_i$.
    (c) Sum the squared residuals (SSE). (d) *Without re-fitting*, replace the slope
    with `1.5` (keep the intercept from lm()) and recompute the SSE. Confirm it''s
    **larger** than the lm() SSE. Why must that be true for *any* slope you try?'
  book_section: 5.3 Related topics
  book_subsection: 5.3.2 Best-fitting line (least-squares)
- ex_num: 30
  difficulty: 2
  group: '`get_regression_*()` companion functions'
  webr: '# your code here'
  prompt: Re-fit `model_b <- lm(weight ~ height, data = bball)` and apply each of
    the three `moderndive` companion functions in turn — `get_regression_table()`,
    `get_regression_points()`, `get_regression_summaries()`. In a single sentence
    per function, name the *unit of information* each returns (i.e., one row per ____
    ?).
  book_section: 5.3 Related topics
  book_subsection: 5.3.3 `get_regression_*()` companion functions
