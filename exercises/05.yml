  book_section: Critical thinking / synthesis
  book_subsection: Critical thinking / synthesis
- ex_num: 37
  difficulty: 3
  group: Critical thinking and synthesis
  webr: '# your exploration here'
  prompt: 'Open exploration: pick any sport, fit a regression that tests a question
    you find interesting, interpret the coefficients, and write your finding as a
    one-sentence headline.'
  book_section: Critical thinking / synthesis
  book_subsection: Critical thinking / synthesis
- ex_num: 38
  difficulty: 2
  group: Extensions
  webr: |-
    library(moderndive)
    get_correlation(bball, weight ~ height)
    # Now with multiple right-hand-side predictors:
    get_correlation(bball, weight ~ height + age, wide = TRUE)
  prompt: |-
    **`get_correlation()` for multi-predictor correlations (`moderndive`).** Chapter 5 introduces correlation on one pair at a time. The current `moderndive` package extends `get_correlation()` to accept many predictors on the right-hand side, returning a tidy long tibble by default (one row per predictor) or a wide one with `wide = TRUE`. Try both forms on `bball`. Why is this more useful than calling `get_correlation()` separately for each predictor when you have many candidates?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  difficulty: 2
  group: Extensions
  webr: |-
    model_b <- lm(weight ~ height, data = bball)
    new_players <- data.frame(height = c(180, 200, 220))
    predict(model_b, newdata = new_players)
  prompt: |-
    **`predict()` for many new points at once.** EX 5.12 had you plug into the fitted equation by hand. R's built-in `predict()` does the same thing for any number of new rows in a single call. Build a small `new_players` data frame with three heights (e.g., 180, 200, 220 cm) and predict their weights. Why is `predict()` the right tool when you want to apply a fitted model to *many* new observations at once?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  difficulty: 3
  group: Extensions
  webr: |-
    model_b <- lm(weight ~ height, data = bball)
    new_players <- data.frame(height = c(180, 200, 220))
    predict(model_b, newdata = new_players, interval = "confidence")
  prompt: |-
    **Confidence intervals on the mean prediction.** `predict(..., interval = "confidence")` adds `lwr`/`upr` columns: the 95 % CI for the *mean* response at each new x value. (Chapter 10 will formally derive these.) Run the snippet. The CI is *narrow* at typical heights and *wider* at extreme ones — why?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  difficulty: 2
  group: Extensions
  webr: |-
    ggplot(bball, aes(x = height, y = weight)) +
      geom_point(alpha = 0.3) +
      geom_smooth(method = "loess", color = "red") +
      geom_smooth(method = "lm",    color = "steelblue")
  prompt: |-
    **`loess` vs `lm` smoothers.** `geom_smooth(method = "loess")` draws a locally-fitted curve that bends to follow the data; `geom_smooth(method = "lm")` draws the best straight line. Plot both on the basketball scatter and compare. Where do the two smoothers agree, and where does the loess curve depart from the line? What would that departure tell you about the appropriateness of a simple-LR model?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  difficulty: 3
  group: Extensions
  webr: |-
    cor.test(bball$height, bball$weight)
  prompt: |-
    **`cor.test()` for inference on a correlation.** Chapter 5 reports the *observed* correlation; `cor.test()` reports a 95 % CI and a p-value testing $H_0: \rho = 0$ — a preview of the inference machinery that arrives in Chapter 9. Run it on basketball Height and Weight. Briefly: what does it mean to "reject $\rho = 0$" in plain English here?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 43
  difficulty: 3
  group: Extensions
  webr: |-
    m_poly <- lm(weight ~ poly(height, 2), data = bball)
    get_regression_table(m_poly)
    get_regression_points(m_poly) |> head()
  prompt: |-
    **Polynomial regression with `poly()`.** Fitting a curve (instead of a line) is as simple as `lm(y ~ poly(x, 2))` — and the current `moderndive` package surfaces the original `x` column cleanly in `get_regression_points()` rather than the raw basis matrix. Try a degree-2 polynomial on basketball Height vs Weight. Does the quadratic term meaningfully change the fit vs the simple linear regression from EX 5.10?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 44
  difficulty: 3
  group: Extensions
  webr: |-
    m_with    <- lm(weight ~ height, data = bball)
    m_origin  <- lm(weight ~ height - 1, data = bball)   # forced through (0, 0)
    list(with_intercept    = get_regression_table(m_with),
         through_origin    = get_regression_table(m_origin))
  prompt: |-
    **Regression through the origin.** `lm(y ~ x - 1)` forces the intercept to be zero — meaning "predict 0 when x = 0." For basketball Height vs Weight, why is this a *terrible* idea? (Hint — what does "0 cm tall" predict, and is that even a meaningful interpolation?) When *would* through-the-origin be the right model?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 45
  difficulty: 2
  group: Extensions
  webr: |-
    model_b <- lm(weight ~ height, data = bball)
    get_regression_table(model_b)
    summary(model_b)
  prompt: |-
    **`summary(lm)` vs `get_regression_table()`.** `get_regression_table()` returns a clean tidy tibble — readable, plot-friendly, easy to filter. Base R's `summary()` prints a richer output with **residual quartiles**, the **F-statistic**, R², and adjusted R² (foreshadowing Ch 10). Run both. When would you reach for `summary()` instead of `get_regression_table()`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 46
  difficulty: 3
  group: Extensions
  webr: |-
    library(broom)
    model_b <- lm(weight ~ height, data = bball)
    tidy(model_b)       # one row per coefficient
    glance(model_b)     # one row per model (R², stats, AIC, BIC, ...)
    augment(model_b) |> head()   # data + fitted/residual/diagnostics
  prompt: |-
    **`broom` as an alternative tidier.** The `broom` package provides three tidiers that span the use cases of `moderndive`'s `get_regression_*()` family — `tidy()` for coefficients, `glance()` for one-row model summaries, `augment()` for per-observation fitted-and-residual tables. Run all three on `model_b`. How does `augment()` differ from `get_regression_points()`? When might you prefer `broom` over `moderndive`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 47
  difficulty: 3
  group: Extensions
  webr: |-
    library(moderndive)
    ggplot(bball, aes(x = sex, y = height)) +
      geom_categorical_model()
  prompt: |-
    **`geom_categorical_model()` for one-categorical-predictor regression (`moderndive`).** Chapter 5's `lm(height ~ sex)` produces *group means* — one estimate per level of the categorical predictor. `moderndive::geom_categorical_model()` is a custom ggplot geom that draws those fitted group means right on a scatter/boxplot of the raw data, with CI bands. Build the plot on `bball` for `height ~ sex`. How does this visualization make the regression fit *visible* in a way `get_regression_table()` alone doesn't?
  book_section: Extensions
  book_subsection: Extensions

