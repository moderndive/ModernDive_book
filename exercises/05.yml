chapter_meta:
  coverage_note: |-
    **A note on coverage.** The Setup/EDA bucket reviews dplyr+ggplot fundamentals before any modeling, these spill across 5.1.1 and 5.2.1 EDA subsections. Note: in the v2 reorganization, *inference for regression* (the regression table's standard errors / CIs / p-values, and model-fit measures such as R²) moved to **Chapter 10**, so Chapter 5 exercises read coefficients with `coef()` and use `get_regression_points()`; `get_regression_table()`/`get_regression_summaries()` appear only in this chapter's Extensions and in Chapter 10.

    Difficulty stars: ★ warm-up, ★★ standard application, ★★★ critical thinking.
