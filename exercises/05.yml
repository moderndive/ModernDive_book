  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 14
  difficulty: 2
  group: 'Simple linear regression: one categorical predictor'
  webr: '# your code here'
  prompt: Fit `model_sex <- lm(height ~ sex, data = bball)` and print `get_regression_table()`.
    Which sex level is the **baseline** (i.e., absorbed into the intercept)?
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 15
  difficulty: 2
  group: 'Simple linear regression: one categorical predictor'
  prompt: Interpret the **intercept** of `model_sex` in one sentence — what does it
    represent?
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 16
  difficulty: 2
  group: 'Simple linear regression: one categorical predictor'
  prompt: Interpret the **`sexM`** coefficient — what does it represent? Connect it
    to a difference of group means.
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 17
  difficulty: 3
  group: 'Simple linear regression: one categorical predictor'
  webr: '# your code here'
  prompt: Compute the two group means directly with `dplyr` (`group_by(sex) |> summarize(mean(height))`).
    Confirm that intercept = mean of baseline, and intercept + slope = mean of the
    other group.
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 18
  difficulty: 3
  group: 'Simple linear regression: one categorical predictor'
  webr: '# your code here'
  prompt: On the **full** `olympic_athletes` (drop missing `height`), fit `lm(height
    ~ season)`. Which Season has taller athletes on average?
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 19
  difficulty: 3
  group: 'Simple linear regression: one categorical predictor'
  webr: '# your code here'
  prompt: Filter to the **5 most-populous sports** (most athlete-rows). Fit `lm(height
    ~ sport)` and read the table — each non-baseline sport gets its own coefficient.
    Interpret one of them.
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.1 EDA / 5.2.2 Linear regression (categorical)
- ex_num: 20
  difficulty: 2
  group: Observed/fitted values and residuals
  webr: '# your code here'
  prompt: Use `get_regression_points(model_b)` to find the basketball athlete with
    the **largest positive residual** (most underpredicted) and the one with the **largest
    negative residual** (most overpredicted). Report their `height` and `weight`. In
    one sentence each, what does the sign of the residual mean for that specific athlete?
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.3 Observed/fitted values & residuals
- ex_num: 21
  difficulty: 3
  group: Observed/fitted values and residuals
  webr: '# your code here'
  prompt: Using `get_regression_points(model_b)`, compute the **sum** of the `residual`
    column. What value do you get (approximately)? Briefly, why is the sum of residuals
    forced to be (essentially) zero whenever the regression model includes an intercept?
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.3 Observed/fitted values & residuals
- ex_num: 22
  difficulty: 3
  group: 'Simple linear regression: one categorical predictor'
  webr: '# your code here'
  prompt: From `model_sex` (EX 5.14), pull `get_regression_points()`. Confirm that
    each athlete's `residual` equals their `height` *minus the group mean* for their
    `sex`. (Match the per-sex means you computed in EX 5.17.) Why must this be true
    for a regression with a single categorical predictor?
  book_section: 5.2 One categorical explanatory variable
  book_subsection: 5.2.3 Observed/fitted values & residuals (categorical)
- ex_num: 23
  difficulty: 2
  group: Residuals, diagnostics, and model fit
  prompt: Translate `model_b`'s R² into a *plain-English* sentence aimed at someone
