chapter_meta:
  coverage_note: |-
    **A note on coverage.** The Setup/EDA bucket reviews dplyr+ggplot fundamentals before any modeling — these spill across 5.1.1 and 5.2.1 EDA subsections.

    Difficulty stars: ★ warm-up, ★★ standard application, ★★★ critical thinking.
exercises:
- ex_num: 1
  difficulty: 1
  group: Setup and EDA
  webr: |-
    bball <- olympic_athletes |>
      filter(sport == "Basketball", !is.na(height), !is.na(weight))
    nrow(bball)
  prompt: Filter `olympic_athletes` to `sport == "Basketball"`, drop rows with missing
    `height` or `weight`, and save the result as `bball`. How many rows remain?
  book_section: Setup / EDA
  book_subsection: Setup and exploratory data analysis
- ex_num: 2
  difficulty: 1
  group: Setup and EDA
  webr: '# your code here'
  prompt: Compute summary statistics (mean, sd, min, max) for `height` and `weight`
    in `bball`.
  book_section: Setup / EDA
  book_subsection: Setup and exploratory data analysis
- ex_num: 3
  difficulty: 1
  group: Setup and EDA
  webr: |-
    ggplot(bball, aes(x = height, y = weight)) +
      geom_point(alpha = 0.3) +
      geom_smooth(method = "lm", se = FALSE)
  prompt: Build a scatterplot of `weight` (y) vs `height` (x) on `bball`. Roughly
    describe the relationship.
  book_section: Setup / EDA
  book_subsection: Setup and exploratory data analysis
- ex_num: 4
  difficulty: 2
  group: Setup and EDA
  webr: '# your code here'
  prompt: Compute `cor(bball$height, bball$weight)`. Interpret the value in one sentence.
  book_section: Setup / EDA
  book_subsection: Setup and exploratory data analysis
- ex_num: 5
  difficulty: 2
  group: Setup and EDA
  prompt: Why is plotting the bivariate scatter the right *first step* before fitting
    a regression line — even when you're confident the relationship is linear?
  book_section: Setup / EDA
  book_subsection: Setup and exploratory data analysis
- ex_num: 6
  difficulty: 2
  group: 'Simple linear regression: one numerical predictor'
  webr: |-
    model_b <- lm(weight ~ height, data = bball)
    get_regression_table(model_b)
  prompt: Fit `model_b <- lm(weight ~ height, data = bball)`. Use `get_regression_table(model_b)`
    to print the regression table.
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.1 EDA / 5.1.2 Simple linear regression
- ex_num: 7
  difficulty: 2
  group: 'Simple linear regression: one numerical predictor'
  prompt: Interpret the **slope** coefficient on `height`. Use units in your sentence.
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.1 EDA / 5.1.2 Simple linear regression
- ex_num: 8
  difficulty: 2
  group: 'Simple linear regression: one numerical predictor'
  prompt: Interpret the **intercept**. Why is the literal interpretation ("expected
    weight of an athlete 0 cm tall") misleading?
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.1 EDA / 5.1.2 Simple linear regression
- ex_num: 9
  difficulty: 3
  group: 'Simple linear regression: one numerical predictor'
  webr: '# your code here'
  prompt: Repeat EX5.6 for `sport == "Gymnastics"` and call the model `model_g`. Compare
    the two slopes — does Weight rise *faster* or *slower* with Height in gymnastics
    vs basketball?
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.1 EDA / 5.1.2 Simple linear regression
- ex_num: 10
  difficulty: 2
  group: Observed/fitted values and residuals
  webr: '# your code here'
  prompt: Use `get_regression_points(model_b)` to inspect fitted values and residuals.
    Print the first 5.
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.3 Observed/fitted values & residuals
- ex_num: 11
  difficulty: 2
  group: Observed/fitted values and residuals
  webr: get_regression_summaries(model_b)
  prompt: Use `get_regression_summaries(model_b)` and report **R²**. Interpret it
    in one sentence (in context).
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.3 Observed/fitted values & residuals
- ex_num: 12
  difficulty: 2
  group: Observed/fitted values and residuals
  webr: '# your code here'
  prompt: Use the model to **predict** the weight of a basketball athlete who is 200
    cm tall. Pull the intercept and slope from `get_regression_table(model_b)` and
    compute `intercept + slope * 200` by hand. (No need for any special prediction
    function — a fitted line is just `y = a + bx`.)
  book_section: 5.1 One numerical explanatory variable
  book_subsection: 5.1.3 Observed/fitted values & residuals
- ex_num: 13
  difficulty: 2
  group: 'Simple linear regression: one categorical predictor'
  webr: ggplot(bball, aes(x = sex, y = height)) + geom_boxplot()
  prompt: On `bball`, build side-by-side boxplots of `height` by `sex`. Which sex
