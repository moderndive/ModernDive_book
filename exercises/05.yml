chapter_meta:
  coverage_note: |-
    **A note on coverage.** The Setup/EDA bucket reviews dplyr+ggplot fundamentals before any modeling, these spill across 5.1.1 and 5.2.1 EDA subsections. Note: in the v2 reorganization, *inference for regression* (the regression table's standard errors / CIs / p-values) moved to **Chapter 10**, so Chapter 5 exercises read coefficients with `coef()` and use `get_regression_points()`. `get_regression_table()` appears only in this chapter's Extensions and in Chapter 10; R² and `get_regression_summaries()` are developed in no chapter; they live in extension exercises only, introduced in EX 5.47 and referenced from later chapters' extensions.

    Difficulty stars: ★ warm-up, ★★ standard application, ★★★ critical thinking.
exercises:
- ex_num: 1
  hash: "832s"
  difficulty: 1
  group: Setup and EDA
  webr: |-
    ?planets
    # The same page lives on the package website:
    # https://moderndive.github.io/exoplanetdata/reference/planets.html
  prompt: |-
    **Meet the data.** Before fitting anything, get to know the dataset this chapter's exercises revolve around: `planets` from the `exoplanetdata` package. Run `?planets` (the same page lives on the package website at <https://moderndive.github.io/exoplanetdata/reference/planets.html>) and answer from the documentation:

    - (a) What is the *observational unit*: what does one row represent, and where does the data come from?
    - (b) How many rows and variables should you expect?
    - (c) What do `radius_earth` and `mass_earth` measure, and in what units?
    - (d) This chapter uses `discovery_method` as a categorical variable: what does the documentation say it records?

    Finish by confirming your answer to (b) with `glimpse(planets)`.
  book_section: Setup / EDA
  book_subsection: Setup and exploratory data analysis
