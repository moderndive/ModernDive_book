- ex_num: 37
  hash: "tzas"
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`get_correlation()` for multi-predictor correlations (`moderndive`).** Chapter 5 introduces correlation on one pair at a time. The current `moderndive` package extends `get_correlation()` to accept many predictors on the right-hand side, returning a tidy long tibble by default (one row per predictor) or a wide one with `wide = TRUE`. Try both forms on `planets_lite` with `mass_earth ~ radius_earth + eq_temp_k`. Why is this more useful than calling `get_correlation()` separately for each predictor when you have many candidates?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 38
  hash: "zkkr"
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`predict()` for many new points at once.** EX 5.12 had you plug into the fitted equation by hand. R's built-in `predict()` does the same thing for any number of new rows in a single call. Build a small `new_planets` data frame with three radii (e.g., 1, 5, 15 Earth-radii) and predict their masses. Why is `predict()` the right tool when you want to apply a fitted model to *many* new observations at once?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  hash: "h666"
  difficulty: 3
  group: Extensions
  webr: |-
    model_mass_radius <- lm(mass_earth ~ radius_earth, data = planets_lite)
    new_planets <- data.frame(radius_earth = c(1, 5, 15))
    predict(model_mass_radius, newdata = new_planets, interval = "confidence")
  prompt: |-
    **Confidence intervals on the mean prediction.** `predict(..., interval = "confidence")` adds `lwr`/`upr` columns: the 95 % CI for the *mean* response at each new x value. (Chapter 10 will formally derive these.) Run the snippet. The CI is *narrow* at typical radii and *wider* at extreme ones, why?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  hash: "irh3"
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **`loess` vs `lm` smoothers.** `geom_smooth(method = "loess")` draws a locally-fitted curve that bends to follow the data; `geom_smooth(method = "lm")` draws the best straight line. Plot both on the `mass_earth` vs `radius_earth` scatter and compare. Where do the two smoothers agree, and where does the loess curve depart from the line, at the lower end, the upper end, or both? What would that departure tell you about the appropriateness of a simple-LR model? Then run a cheap sensitivity check: redraw the same two smoothers on `planets_lite |> filter(radius_earth < 25)` (`planets_lite` contains a handful of planets with far larger radii) and compare against the full-data version. What changes about each smoother, and what does that tell you about how much a few extreme points steer the fits?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  hash: "6eud"
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Bootstrap inference on a correlation with `infer`.** Chapter 5 reports the *observed* correlation; the `infer` package (which you'll meet fully in Chapter 8) lets you put a 95 % confidence interval around it by *bootstrapping*, resampling the planets with replacement many times. Using `specify(mass_earth ~ radius_earth) |> generate(reps = 1000, type = "bootstrap") |> calculate(stat = "correlation")`, build a bootstrap distribution of the radius-mass correlation and compute its 95 % CI with `get_confidence_interval()`. Briefly: what does it mean that the interval does *not* contain 0? (For more, the `infer` package's documentation website at <https://infer.tidymodels.org/> explains the specify/generate/calculate workflow with visual examples, a good companion as you preview Chapter 8.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  hash: "y1wt"
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Polynomial regression with `poly()`.** Fitting a curve (instead of a line) is as simple as `lm(y ~ poly(x, 2))`, and the current `moderndive` package surfaces the original `x` column cleanly in `get_regression_points()` rather than the raw basis matrix. Try a degree-2 polynomial on `mass_earth ~ radius_earth`. Does the quadratic term meaningfully change the R² (the share of variation in $y$ the model accounts for; EX 5.47 gives it a fuller treatment) vs the simple linear regression from EX 5.7, and what does your answer suggest about the right fix for this curve?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 43
  hash: "od9w"
  difficulty: 3
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Regression through the origin.** `lm(y ~ x - 1)` forces the intercept to be zero, meaning "predict 0 when x = 0." For the chapter's fertility model an intercept at `life_exp = 0` had no practical meaning (and EX 5.9's mass intercept was even negative), but for `mass_earth ~ radius_earth` the origin is *physically* meaningful, a planet of zero radius should have zero mass. Fit both `lm(mass_earth ~ radius_earth)` and `lm(mass_earth ~ radius_earth - 1)` and compare. Does the physically-sensible origin make through-the-origin the right model here? When *is* it appropriate?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 44
  hash: "vddy"
  difficulty: 2
  group: Extensions
  webr: |-
    model_mass_radius <- lm(mass_earth ~ radius_earth, data = planets_lite)
    get_regression_table(model_mass_radius)
    summary(model_mass_radius)
  prompt: |-
    **`summary(lm)` vs `get_regression_table()`.** `get_regression_table()` returns a clean tidy tibble, readable, plot-friendly, easy to filter. Base R's `summary()` prints a richer output with **residual quartiles**, the **F-statistic** (foreshadowing Ch 10), and R²/adjusted R² (introduced in extension EX 5.47). Run both. When would you reach for `summary()` instead of `get_regression_table()`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 45
  hash: "hx3y"
  difficulty: 3
  group: Extensions
  webr: |-
    library(broom)
    model_mass_radius <- lm(mass_earth ~ radius_earth, data = planets_lite)
    tidy(model_mass_radius)       # one row per coefficient
    glance(model_mass_radius)     # one row per model (R², stats, AIC, BIC, ...)
    augment(model_mass_radius) |> head()   # data + fitted/residual/diagnostics
  prompt: |-
    **`broom` as an alternative tidier.** The `broom` package provides three tidiers that span the use cases of `moderndive`'s `get_regression_*()` family, `tidy()` for coefficients, `glance()` for one-row model summaries, `augment()` for per-observation fitted-and-residual tables. Run all three on `model_mass_radius`. How does `augment()` differ from `get_regression_points()`? When might you prefer `broom` over `moderndive`?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 46
  hash: "h2kt"
  difficulty: 3
  group: Extensions
