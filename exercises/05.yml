  book_section: Residual diagnostics (cross-cuts 5.1.3/5.2.3)
  book_subsection: Residual diagnostics & model fit (5.1.3 + 5.2.3)
- ex_num: 25
  difficulty: 3
  group: Residuals, diagnostics, and model fit
  webr: |-
    olympic_athletes |>
      filter(!is.na(height), !is.na(weight)) |>
      ggplot(aes(x = height, y = weight)) +
      geom_point(alpha = 0.02) +
      geom_smooth(method = "lm", se = FALSE)
  prompt: What single piece of evidence would convince you that **a single straight
    line is *not* a good model** for `weight ~ height` on the full `olympic_athletes`
