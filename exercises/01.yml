- ex_num: 1
  hash: "67hq"
  difficulty: 1
  group: ~
  prompt: A classmate insists "R and RStudio are the same thing, RStudio is just
    a newer name for R." In 2–3 sentences, set them straight using an everyday analogy
    of your choice (car & dashboard, engine & cockpit, kitchen & recipe, whatever
    clicks for you). Be specific about which one *runs* the code and which one is
    the *interface* you actually click around in.
  book_section: 1.1 What are R and RStudio?
