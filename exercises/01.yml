- ex_num: 14
  hash: "cwzj"
  difficulty: 2
  group: Extensions
  prompt: |-
    **RStudio Projects.** A `.Rproj` file marks a folder as an RStudio *Project*, opening it sets R's working directory to that folder, scopes the History panel to it, and (importantly) makes scripts portable across machines because they reference files *relative* to the project root instead of absolute paths like `/Users/yourname/Downloads/...`.

    Create a new RStudio Project for your ModernDive work (`File → New Project → New Directory → New Project`). Save one script inside it that runs `library(olympicAthletes); glimpse(olympic_athletes)`. Close RStudio, reopen by double-clicking the `.Rproj` file, and re-run the script. Briefly: what changed about the working directory between the two sessions, and why does that matter when you share code with someone else?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 15
  hash: "f8jf"
  difficulty: 2
  group: Extensions
  webr: |-
    library(moderndive)
    library(nycflights23)
    tidy_summary(weather, na.rm = TRUE)
  prompt: |-
    **One-shot data exploration with `tidy_summary()`.** The `moderndive` package provides `tidy_summary()`, which produces a one-stop tibble of column-by-column summaries: type, level breakdowns for categoricals, min/quartiles/max for numerics. Run it on `weather` from `nycflights23` (the same package as the chapter's `flights`) — `weather` has a few missing values, so pass `na.rm = TRUE` so the summaries skip them. Compare its output to running `glimpse()` and `summary()` separately. Which of the three would you reach for first when meeting a new data frame for the first time?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 16
  hash: "buwh"
  difficulty: 2
  group: Extensions
  webr: |-
    library(moderndive)
    # On a large data frame, View() shows a random sample (default 1000 rows):
    View(olympic_athletes)
  prompt: |-
    **`View()` that works inside Quarto/R Markdown.** Base R's `utils::View()` errors in non-interactive contexts (when you knit/render a `.qmd` or `.Rmd`), which can break documents. `moderndive` exports a drop-in `View()` wrapper that behaves identically interactively but in non-interactive contexts renders the data inline as a scrollable table instead, so the document still builds. Because a large client-side table bogs down on very large data, in non-interactive contexts `View()` shows a **random sample of `n` rows** (default `1000`) when the data frame is larger, and prints a short message saying so. Run `View(olympic_athletes)` here and you'll get a representative 1,000-row sample of the ~315k rows rather than a slow table or a warning; use `full = TRUE` to see every row, `n = ...` to resize the sample, or `seed = ...` for a reproducible one. Briefly: when would you prefer the inline table over a static printed tibble in a Quarto report?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 17
  hash: "6a5h"
  difficulty: 2
  group: Extensions
  webr: |-
    library(conflicted)
    library(dplyr)
    library(MASS)        # also exports a select(), causing a conflict
    # filter(olympic_athletes, year == 2024)   # would error: ambiguous
    conflicts_prefer(dplyr::filter)
    conflicts_prefer(dplyr::select)
    head(filter(olympic_athletes, year == 2024))
  prompt: |-
    **Managing function masking with `conflicted`.** Here's a wrinkle the chapter doesn't cover: when two loaded packages export the same function name (e.g., `dplyr::filter` and `stats::filter`), R silently uses whichever package was loaded *most recently*, a behavior called **masking**. The `conflicted` package turns this silent behavior into a *loud* error and lets you declare your preferences. Try the starter snippet, note how `conflicts_prefer()` makes the choice explicit. When would you rather have a noisy error than silent overriding?
  book_section: Extensions
  book_subsection: Extensions


- ex_num: 18
  hash: "i3qs"
  difficulty: 1
  group: Booleans and comparisons
  webr: |-
    # Predict TRUE, FALSE, or an error for each line FIRST,
    # then uncomment and run them one at a time to check yourself.
    # 3 * 5 == 15
    # 10 <= 9
    # "R" != "r"
    # (2 + 3 == 5) & (10 < 4)
    # (2 + 3 == 5) | (10 < 4)
    # 7 = 7
  prompt: |-
    **Predict, then verify.** Section 1.2.1 introduces comparisons like `==`, `<=`, and `!=` plus the logical operators `&` ("and") and `|` ("or"). For each expression below, write down what R will return, `TRUE`, `FALSE`, or an *error*, **before** you run it. Then run each line in the console to check your predictions.

    (a) `3 * 5 == 15`
    (b) `10 <= 9`
    (c) `"R" != "r"`
    (d) `(2 + 3 == 5) & (10 < 4)`
    (e) `(2 + 3 == 5) | (10 < 4)`
    (f) `7 = 7`

    One of the six isn't a `TRUE`/`FALSE` question at all. Which one, and why does R react the way it does? (Hint: the chapter makes a point of the difference between `==` and `=`.)
  book_section: 1.2 How do I code in R?
  book_subsection: 1.2.1 Basic programming concepts and terminology
