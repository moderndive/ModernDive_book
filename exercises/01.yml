chapter_meta:
  coverage_note: |-
    **A note on coverage.** Chapter 1 is intentionally a warm-up set, the larger exercise sets begin in *Chapter 2*. Sections like *1.1 Installing R and RStudio* are largely procedural (a one-time setup walkthrough), so they're covered by a single conceptual prompt rather than a battery of code-based ones.

    Difficulty: ★ warm-up.
