- ex_num: 37
  difficulty: 3
  group: Extensions
  webr: |-
    # Side-by-side raw vs log scatterplots:
    library(patchwork)
    p_raw <- ggplot(planets_lite, aes(x = radius_earth, y = mass_earth)) +
      geom_point(alpha = 0.3) + labs(title = "Raw axes")
    p_log <- ggplot(planets_lite, aes(x = radius_earth, y = mass_earth)) +
      geom_point(alpha = 0.3) +
      scale_x_log10() + scale_y_log10() +
      labs(title = "log-log axes")
    p_raw + p_log

    # Compare R² for linear vs log-log models:
    m_lin <- lm(mass_earth ~ radius_earth, data = planets_lite)
    m_log <- lm(log10(mass_earth) ~ log10(radius_earth), data = planets_lite)
    c(linear = get_regression_summaries(m_lin)$r_squared,
      log    = get_regression_summaries(m_log)$r_squared)
  prompt: |-
    **Log transforms on skewed data (foreshadows Ch 11).** EX 6.4 noted that `planets_lite` has a long tail of gas giants stretching the axes. A common fix is the **log transformation** — `log10()` on both response and predictor. Run the side-by-side scatter, then refit the mass-vs-radius model with `log10()` on both sides. How does R² change, and what *structure* does the log-log scatter reveal that the raw scatter hides? You'll see `log10()` again as a methodology choice in Ch 11's Seattle house prices case study.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 38
  difficulty: 2
  group: Extensions
  webr: |-
    new_planets <- data.frame(insolation_earth = c(0.5, 1, 2), star_temp_k = 5800)
    predict(m_two, newdata = new_planets)
    predict(m_two, newdata = new_planets, interval = "confidence")
  prompt: |-
    **`predict()` for many new points + confidence bands.** EX 6.20 had you plug into the fitted equation by hand. `predict(m_two, newdata = new_planets)` does this for any number of new rows in one call. Adding `interval = "confidence"` returns `lwr`/`upr` columns giving a 95 % CI on the *mean* prediction at each new x. Run both forms for three hypothetical Earth-like exoplanets. How do the CI widths compare to what you'd expect at Earth-like values vs extreme ones?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 39
  difficulty: 3
  group: Extensions
  webr: |-
    s <- summary(m_two)
    list(r_squared       = s$r.squared,
         adj_r_squared   = s$adj.r.squared)
  prompt: |-
    **Adjusted R² and the cost of extra predictors.** § 6.2.4 used plain R² to compare nested models. Subtle issue — R² *never decreases* when you add a predictor, even pure random noise nudges it up by chance. **Adjusted R²** penalizes a model for using more predictors. Pull it from `summary(m_two)$adj.r.squared`. Then add a column of noise — `planets_temp |> mutate(noise = rnorm(n()))` — and refit a model including it. Did plain R² rise? Did adjusted R² rise or fall?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 40
  difficulty: 3
  group: Extensions
  webr: |-
    s <- summary(m_two)
    s$fstatistic     # F-statistic, df1, df2
    # Compute the model-level p-value from those three numbers:
    pf(s$fstatistic[1], s$fstatistic[2], s$fstatistic[3], lower.tail = FALSE)
  prompt: |-
    **An F-test for the whole model (foreshadows Ch 10).** Chapter 10 will give you a p-value for each *individual* regression coefficient. There's also one p-value attached to the *whole* multi-predictor model — the **F-test**, testing $H_0:$ "all slopes are zero" against $H_A:$ "at least one slope is non-zero." Pull the F-stat from `summary(m_two)$fstatistic` and compute its p-value. In plain English, what does this single p-value tell you about the model as a whole?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 41
  difficulty: 3
  group: Extensions
  webr: |-
    library(moderndive)
    library(plotly)
    plot_3d_regression(planets_temp, eq_temp_k ~ insolation_earth + star_temp_k)
  prompt: |-
    **3D scatter + regression plane with `plot_3d_regression()` (`moderndive`).** When you have *two numerical predictors*, the model isn't a line — it's a **plane** in 3D. `moderndive::plot_3d_regression()` builds an interactive 3D scatter with the fitted plane overlaid. Try it on `m_two`'s formula. Why is this visualization more informative than the side-by-side 2D scatters of each predictor against the response separately?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 42
  difficulty: 3
  group: Extensions
  webr: |-
    m_three <- lm(mass_earth ~ radius_earth + insolation_earth + eq_temp_k,
                  data = planets_lite |>
                    filter(!is.na(eq_temp_k), !is.na(insolation_earth)))
    get_regression_table(m_three)
  prompt: |-
    **Three or more predictors.** Multiple regression generalizes to *any* number of predictors — just keep adding terms with `+`. Fit `lm(mass_earth ~ radius_earth + insolation_earth + eq_temp_k)`. Interpret each slope using the chapter's *"holding the others constant"* phrasing. How does the `radius_earth` slope here compare to the simple-LR slope from EX 5.10 (`lm(mass_earth ~ radius_earth)`)?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 43
  difficulty: 3
  group: Extensions
  webr: |-
    m_poly2 <- lm(eq_temp_k ~ poly(insolation_earth, 2) + star_temp_k,
                  data = planets_temp)
    get_regression_table(m_poly2)
    c(linear = get_regression_summaries(m_two)$r_squared,
      quad   = get_regression_summaries(m_poly2)$r_squared)
    get_regression_points(m_poly2) |> head()
  prompt: |-
    **Polynomial terms in multiple regression.** `lm(y ~ poly(x1, 2) + x2)` fits a *curve* in `x1` while keeping a straight line in `x2`. Try a degree-2 polynomial on `insolation_earth` in the `m_two` model. Does R² improve? (The current `moderndive` package surfaces the *original* `insolation_earth` column in `get_regression_points()` output, not the raw basis matrix.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 44
  difficulty: 3
  group: Extensions
  webr: |-
    # Compute VIF for one predictor "by hand": regress it on the others, take R^2,
    # then VIF = 1 / (1 - R^2). The `car::vif()` function automates this; we
    # compute it manually so the formula is visible (and so the code runs
    # without an extra dependency).
    vif_manual <- function(model) {
      mf <- model.frame(model)
      predictors <- names(mf)[-1]                 # everything except the response
      sapply(predictors, function(p) {
        others  <- setdiff(predictors, p)
        formula_p <- as.formula(paste(p, "~", paste(others, collapse = " + ")))
        r2 <- summary(lm(formula_p, data = mf))$r.squared
        1 / (1 - r2)
      })
    }

    vif_manual(m_two)

    # For comparison, build a model where predictors are nearly collinear:
    pt2 <- planets_temp |>
      mutate(insol_copy = insolation_earth * 1.01 + 0.1)
    m_corr <- lm(eq_temp_k ~ insolation_earth + insol_copy, data = pt2)
    vif_manual(m_corr)
  prompt: |-
    **Multicollinearity and the variance inflation factor (VIF).** When two predictors are highly correlated with each other, regression can't tell which one is "doing the work" — coefficient estimates get unstable. The **VIF** for predictor $j$ is $1 / (1 - R^2_j)$, where $R^2_j$ is from a regression of predictor $j$ on the *other* predictors. Values $> 5$ (some say $> 10$) signal trouble. Run the snippet's `vif_manual(m_two)` (should be near 1) vs the corrupted `m_corr` (deliberately near-collinear, VIFs in the *millions*). What practical fix would you apply when one predictor has a high VIF? (In production code, `car::vif()` does the same calculation automatically.)
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 45
  difficulty: 3
  group: Extensions
  webr: |-
    # Stepwise selection picks predictors by AIC:
    full  <- lm(eq_temp_k ~ insolation_earth + star_temp_k + radius_earth,
                data = planets_temp |> filter(!is.na(radius_earth)))
    null  <- lm(eq_temp_k ~ 1,
                data = planets_temp |> filter(!is.na(radius_earth)))
    step(null, scope = formula(full), direction = "both", trace = 0)
  prompt: |-
    **`step()` for automated model selection — with a warning.** `step()` repeatedly adds/removes predictors to optimize an information criterion (AIC by default), automating model selection. Run it as above. **Why this is dangerous in practice** — the resulting model's p-values and CIs are *not* valid (the same data picked the model *and* tested it), and the algorithm has no domain knowledge. When *would* you use `step()`, and what should accompany it?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 46
  difficulty: 3
  group: Extensions
  webr: |-
    m_unscaled <- lm(eq_temp_k ~ insolation_earth + star_temp_k, data = planets_temp)
    m_scaled   <- lm(eq_temp_k ~ scale(insolation_earth) + scale(star_temp_k),
                     data = planets_temp)
    list(unscaled = get_regression_table(m_unscaled),
         scaled   = get_regression_table(m_scaled))
  prompt: |-
    **In-formula scaling for comparable coefficients.** With `lm(y ~ x1 + x2)`, the two slopes are in their *own* original units — you can't say which predictor "matters more" just by comparing slope magnitudes (1 unit of `insolation_earth` is *not* the same size as 1 unit of `star_temp_k`). Wrapping each predictor in `scale(...)` standardizes it to mean 0, SD 1 — making the slopes *directly comparable*. Run both. After scaling, which predictor has a larger effect-per-standard-deviation on equilibrium temperature?
  book_section: Extensions
  book_subsection: Extensions

