chapter_meta:
  coverage_note: |-
    **A note on coverage.** The critical-thinking prompts deliberately *cross-cut* the subsections (model selection, partial-slope interpretation, parallel-slopes vs interaction, sample-size effects on R²).

    Difficulty: ★ warm-up · ★★ standard · ★★★ critical thinking.
exercises:
- ex_num: 1
  difficulty: 1
  group: Setup and EDA
  webr: |-
    library(exoplanets)
    glimpse(planets)
  prompt: Run `glimpse(planets)`. How many planets and how many variables?
  book_section: Setup / EDA (chapter overview)
  book_subsection: Setup and chapter overview
