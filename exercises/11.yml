  prompt: |-
    **Out-of-sample model shoot-out.** EX 11.23 showed that the parallel-slopes and interaction models can disagree by tens of thousands of dollars on a *single* house, but one house can't settle which model *predicts* better. Settle it properly: rebuild EX 11.24's train-test split (`set.seed(76)` with the same calls gives you the *identical* split), fit **both** the interaction model `log10_price ~ log10_size * condition` and the parallel-slopes model `log10_price ~ log10_size + condition` on the training set, and compare their **test-set RMSEs in dollars**. Does the interaction model's extra flexibility earn its keep on houses neither model has seen? Report the gap between the two RMSEs, and be honest about whether it is large or small relative to the RMSEs themselves.
