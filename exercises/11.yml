- ex_num: 14
  difficulty: 3
  group: Extensions
  webr: |-
    # k-fold cross-validation for a regression model on the Seattle house prices data
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living))

    n <- nrow(house_sub)
    k <- 5
    folds <- sample(rep(1:k, length.out = n))

    cv_rmse <- function(fold_id) {
      train <- house_sub[folds != fold_id, ]
      test  <- house_sub[folds == fold_id, ]
      m     <- lm(log10(price) ~ sqft_living, data = train)
      pred  <- predict(m, newdata = test)
      sqrt(mean((log10(test$price) - pred)^2))
    }

    fold_rmses <- sapply(1:k, cv_rmse)
    cat(sprintf("Fold RMSEs: %s\n", paste(round(fold_rmses, 3), collapse = ", ")))
    cat(sprintf("Mean RMSE across folds: %.3f\n", mean(fold_rmses)))
  prompt: |-
    **k-fold cross-validation.** Chapter 11's case study reported $R^2$ on the *training* data, but a model with high training $R^2$ can predict *new* data poorly (the model has "memorized" the training set). **Cross-validation** evaluates how a model generalizes, randomly split the data into $k$ folds, train on $k-1$ of them, test on the held-out fold, repeat for all $k$ folds, and report the *average* out-of-sample error. Run the 5-fold CV snippet. Why is the mean fold RMSE a *more honest* estimate of how the model will perform on truly new houses than the in-sample $R^2$?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 15
  difficulty: 3
  group: Extensions
  webr: |-
    # Simpler alternative, single train/test split
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living))

    n     <- nrow(house_sub)
    train_idx <- sample(seq_len(n), size = 0.8 * n)
    train <- house_sub[ train_idx, ]
    test  <- house_sub[-train_idx, ]

    m <- lm(log10(price) ~ sqft_living, data = train)

    # Training R²:
    summary(m)$r.squared
    # Held-out test RMSE:
    sqrt(mean((log10(test$price) - predict(m, newdata = test))^2))
  prompt: |-
    **Train/test split.** A simpler alternative to full $k$-fold CV, hold out a *single* chunk (typically 20–30 %) as the **test set**, train on the rest, evaluate on the held-out. One fit, one number out. Cheaper than $k$-fold but noisier (you get one estimate, not $k$). Run the 80/20 split on the Seattle data. Compare the training $R^2$ to the test RMSE. When would a single split be sufficient vs. when would you want full $k$-fold?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 16
  difficulty: 3
  group: Extensions
  webr: |-
    # Demonstrate overfitting with high-order polynomials
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living)) |>
      slice_sample(n = 200)   # small sample to make overfitting visible

    train_idx <- sample(seq_len(200), 160)
    train <- house_sub[ train_idx, ]
    test  <- house_sub[-train_idx, ]

    rmses <- sapply(1:12, function(d) {
      m <- lm(log10(price) ~ poly(sqft_living, d), data = train)
      train_rmse <- sqrt(mean(residuals(m)^2))
      test_rmse  <- sqrt(mean((log10(test$price) - predict(m, newdata = test))^2))
      c(degree = d, train_rmse = train_rmse, test_rmse = test_rmse)
    }) |> t() |> as.data.frame()

    rmses
  prompt: |-
    **Overfitting demonstration.** Add too many predictors (or too high a polynomial degree) and your model will *memorize* the training data, driving the training RMSE down, while predicting badly on new data. Run the snippet, which fits polynomials of degree 1 through 12 on a small training set and tracks training vs test RMSE at each degree. At what degree does the test RMSE *bottom out*? At what degree does training RMSE keep falling while test RMSE *rises*? That's overfitting in action.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 17
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # your exploration here
  prompt: |-
    **In-sample $R^2$ vs out-of-sample RMSE.** Training $R^2$ rewards "how much variance does the model explain in the *training* data." Test RMSE rewards "how accurately can the model *predict* new observations." For a published model, *both* are worth reporting, the $R^2$ describes the explanatory fit, the test RMSE describes the predictive accuracy. The snippet reports both. Why is the *test* RMSE (not training RMSE) the right number to use when comparing *predictive* models?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 18
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # your exploration here
  prompt: |-
    **Communicating uncertainty visually.** A regression line alone tells the story of the *point* prediction, but readers also need to see the *range of plausible outcomes*. Build a plot with two layered bands, a narrow **confidence band** for the mean (Ch 10 EX 10.45) and a wider **prediction band** for individual houses (Ch 10 EX 10.43). When publishing the Seattle case study results, why is the *prediction band* often the more honest visualization for a stakeholder asking "how much should I expect to pay?"
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 19
  difficulty: 2
  group: Extensions
  webr: |-
    # sessionInfo() prints R version, OS, loaded packages, and their versions.
    # Reviewers and future-you can use this to reproduce your analysis exactly.
    sessionInfo()
  prompt: |-
    **Reproducibility: `sessionInfo()`, `renv`, version control.** A published statistical analysis should be **reproducible**, anyone with the data should be able to re-run the code and get the same numbers. Three pillars, **(1)** `sessionInfo()` prints your R version, OS, and every loaded package's version at the end of your script, so reviewers know your exact environment. **(2)** The `renv` package snapshots package versions into a project-local lockfile, so collaborators can install the *same* package versions you used. **(3)** **Version control** (git) tracks every change to the code itself. Run `sessionInfo()` now. In 2-3 sentences, why is reproducibility especially important in the context of the case-study workflow you walked through in Chapter 11?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 20
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Scaffolded warm-up to the Seattle case study: log-transform on `price`.** Section 11.1's EDA flagged that raw `price` is strongly right-skewed, a long tail of expensive homes pulls the mean above the median and makes the histogram hard to read. The chapter's fix was a `log10()` transform. Build both plots, raw `price` and `log10(price)`, side by side. (a) Describe what changes about the histogram's shape under the transform. (b) Why is a *symmetric* (less skewed) outcome variable a better starting point for linear regression than a heavily right-skewed one?
  book_section: '11.1 Case study: Seattle house prices'
  book_subsection: 11.1.1 EDA, log transformation of the outcome
- ex_num: 21
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Scaffolded warm-up: predict a single Seattle house price by hand.** Section 11.1.4 walks through making predictions from the fitted parallel-slopes model. Fit `lm(log10(price) ~ sqft_living + condition, data = house_prices)` and pull the table with `get_regression_table()`. Using only the **intercept**, the **`sqft_living`** slope, and the **`condition3`** offset, compute (by hand from the coefficient table) the predicted $\log_{10}(\text{price})$ for a 2,000 sqft, condition-3 house. Then take $10^{\widehat{\log_{10}(\text{price})}}$ to back-transform to *dollars*. Why must you exponentiate at the end rather than read the dollar prediction directly off the table?
  book_section: '11.1 Case study: Seattle house prices'
  book_subsection: 11.1.4 Making predictions from the fitted model

