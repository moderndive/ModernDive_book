- ex_num: 23
  hash: "s8z1"
  difficulty: 2
  group: Extensions
  webr: '# your exploration here'
  prompt: |-
    **Scaffolded warm-up: predict a single Seattle house price by hand, then reconcile two models.** Section 11.2.4 walks through making predictions from the fitted *interaction* model, and the chapter's Learning check LC11.2 has you predict from the parallel-slopes model on `log10_size`; this exercise pushes past both.

