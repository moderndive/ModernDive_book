- ex_num: 16
  hash: "acjw"
  difficulty: 3
  group: Extensions
  webr: |-
    # k-fold cross-validation for a regression model on the Seattle house prices data
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living))

    n <- nrow(house_sub)
    k <- 5
    folds <- sample(rep(1:k, length.out = n))

    cv_rmse <- function(fold_id) {
      train <- house_sub[folds != fold_id, ]
      test  <- house_sub[folds == fold_id, ]
      m     <- lm(log10(price) ~ sqft_living, data = train)
      pred  <- predict(m, newdata = test)
      sqrt(mean((log10(test$price) - pred)^2))
    }

    fold_rmses <- sapply(1:k, cv_rmse)
    cat(sprintf("Fold RMSEs: %s\n", paste(round(fold_rmses, 3), collapse = ", ")))
    cat(sprintf("Mean RMSE across folds: %.3f\n", mean(fold_rmses)))
  prompt: |-
    **k-fold cross-validation.** Extension EX 5.47 introduced $R^2$ as a summary of how well a model fits *the data it was fit to*, and Chapter 11's case study likewise evaluated its model only on the data it was fit to. But a model that fits its training data well can still predict *new* data poorly (the model has "memorized" the training set). **Cross-validation** evaluates how a model generalizes, randomly split the data into $k$ folds, train on $k-1$ of them, test on the held-out fold, repeat for all $k$ folds, and report the *average* out-of-sample error. Run the 5-fold CV snippet. Why is the mean fold RMSE a *more honest* estimate of how the model will perform on truly new houses than the in-sample $R^2$?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 17
  hash: "nzfq"
  difficulty: 3
  group: Extensions
  webr: |-
    # Simpler alternative, single train/test split
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living))

    n     <- nrow(house_sub)
    train_idx <- sample(seq_len(n), size = 0.8 * n)
    train <- house_sub[ train_idx, ]
    test  <- house_sub[-train_idx, ]

    m <- lm(log10(price) ~ sqft_living, data = train)

    # Training R²:
    summary(m)$r.squared
    # Held-out test RMSE:
    sqrt(mean((log10(test$price) - predict(m, newdata = test))^2))
  prompt: |-
    **Train/test split.** A simpler alternative to full $k$-fold CV, hold out a *single* chunk (typically 20–30 %) as the **test set**, train on the rest, evaluate on the held-out. One fit, one number out. Cheaper than $k$-fold but noisier (you get one estimate, not $k$). Run the 80/20 split on the Seattle data. Compare the training $R^2$ to the test RMSE. When would a single split be sufficient vs. when would you want full $k$-fold?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 18
  hash: "290l"
  difficulty: 3
  group: Extensions
  webr: |-
    # Demonstrate overfitting with high-order polynomials
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living)) |>
      slice_sample(n = 2000)   # enough data that low-degree fits win and high degrees overfit

    train_idx <- sample(seq_len(2000), 1600)
    train <- house_sub[ train_idx, ]
    test  <- house_sub[-train_idx, ]

    rmses <- sapply(1:12, function(d) {
      m <- lm(log10(price) ~ poly(sqft_living, d), data = train)
      train_rmse <- sqrt(mean(residuals(m)^2))
      test_rmse  <- sqrt(mean((log10(test$price) - predict(m, newdata = test))^2))
      c(degree = d, train_rmse = train_rmse, test_rmse = test_rmse)
    }) |> t() |> as.data.frame()

    rmses
  prompt: |-
    **Overfitting demonstration.** Add too many predictors (or too high a polynomial degree) and your model will *memorize* the training data, driving the training RMSE down, while predicting badly on new data. Run the snippet, which fits polynomials of degree 1 through 12 on a training set and tracks training vs test RMSE at each degree. At what degree does the test RMSE *bottom out*? At what degree does training RMSE keep falling while test RMSE *rises*? That's overfitting in action.
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 19
  hash: "jmpb"
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    hp <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living), !is.na(bedrooms))
    train_idx <- sample(seq_len(nrow(hp)), size = floor(0.8 * nrow(hp)))
    train <- hp[ train_idx, ]
    test  <- hp[-train_idx, ]

    m <- lm(log10(price) ~ sqft_living + bedrooms, data = train)
    c(train_r_squared = summary(m)$r.squared,
      test_rmse = sqrt(mean((log10(test$price) - predict(m, newdata = test))^2)))
  prompt: |-
    **In-sample $R^2$ vs out-of-sample RMSE.** Training $R^2$ rewards "how much variance does the model explain in the *training* data." Test RMSE rewards "how accurately can the model *predict* new observations." For a published model, *both* are worth reporting, the $R^2$ describes the explanatory fit, the test RMSE describes the predictive accuracy. The snippet reports both. Why is the *test* RMSE (not training RMSE) the right number to use when comparing *predictive* models?
  book_section: Extensions
  book_subsection: Extensions
