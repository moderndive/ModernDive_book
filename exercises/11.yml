  webr: |-
    # sessionInfo() prints R version, OS, loaded packages, and their versions.
    # Reviewers and future-you can use this to reproduce your analysis exactly.
    sessionInfo()
  prompt: |-
    **Reproducibility: `sessionInfo()`, `renv`, version control.** A published statistical analysis should be **reproducible**, anyone with the data should be able to re-run the code and get the same numbers. Three pillars, **(1)** `sessionInfo()` prints your R version, OS, and every loaded package's version at the end of your script, so reviewers know your exact environment. **(2)** The `renv` package snapshots package versions into a project-local lockfile, so collaborators can install the *same* package versions you used. **(3)** **Version control** (git) tracks every change to the code itself. Run `sessionInfo()` now. In 2-3 sentences, why is reproducibility especially important in the context of the case-study workflow you walked through in Chapter 11?
  book_section: Extensions
  book_subsection: Extensions
