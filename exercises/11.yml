    - (b) Now predict the *same* house from the chapter's interaction model (`log10_price ~ log10_size * condition`, remember to feed it `log10(2000)`). The two dollar figures disagree. By how much, and which prediction do you trust more for this house? Justify using what the chapter showed about the two models.
