- ex_num: 14
  hash: "9ukr"
  difficulty: 3
  group: 'Case-study mechanics: the interaction model'
  webr: '# your exploration here'
  prompt: |-
    **Scaffolded case-study mechanics: reading the interaction model's lines.** Section 11.2.3 settles on the chapter's centerpiece: an *interaction* model in log-log space. Rebuild it exactly as the chapter does, first `mutate()` the two transformed variables `log10_price = log10(price)` and `log10_size = log10(sqft_living)`, then fit `price_interaction <- lm(log10_price ~ log10_size * condition, data = house_prices)` and pull `get_regression_table(price_interaction)`. (A scope note that carries through this chapter's `house_prices` exercises: the dataset is every recorded Seattle-area sale in its 2014-2015 window rather than a sample from a longer list of sales, so per EX 10.27 read the table's standard errors, CIs, and p-values in Section 10.1's data-generating-process sense, the sales are realizations of the Seattle market's price-setting process, and the inference is about that process.)

    - (a) Write out the fitted equation $\widehat{\log_{10}(\text{price})} = b_0 + b_1 \cdot \log_{10}(\text{size})$ for *two* groups: the baseline condition-1 houses, and the condition-5 houses (combine the baseline intercept and slope with the `condition-5` and `log10_size:condition-5` offsets).
    - (b) Both axes are log10-scaled, so the slope acts on *multiplicative* changes: what does the positive `log10_size:condition-5` slope offset tell you about how the size-price relationship differs for condition-5 houses compared to condition-1 houses?
    - (c) Using the full-precision coefficients from `coef(price_interaction)` rather than the rounded printed table (the table rounds to 3 decimals, and any rounding in a coefficient gets amplified once that coefficient sits in an exponent), compute for each of the two groups the factor by which the model predicts `price` is *multiplied* when a house's size *doubles*: $10^{b_1 \cdot \log_{10}(2)} = 2^{b_1}$. Which group's predicted price is more sensitive to size, and by how much for a doubling?
  book_section: '11.2 Case study: Seattle house prices'
  book_subsection: 11.2.3 Regression modeling, the interaction model
