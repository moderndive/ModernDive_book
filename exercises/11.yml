chapter_meta:
  coverage_note: |-
    **A note on coverage.** *Chapter 11 is intentionally a smaller, more open-ended exercise set*, the chapter's two case studies are *worked examples*, not a methodology rollout. EX11.1 and EX11.2 cover the Seattle case-study arc as *synthesis* prompts (EX11.1 the modeling/inference synthesis; EX11.2 the four-step *replication* on a new dataset), with EX11.22 and EX11.23 added as **scaffolded warm-ups** on the chapter's log-transform and prediction-by-hand steps. The seven storytelling-craft prompts (EX11.3–EX11.9) all map to **Section 11.3**'s principles, headline, chart honesty, audience, research-note structure, takeaway. The closing four prompts (EX11.10–EX11.13) revisit whole-book synthesis (pipelines, reproducibility, scope, cross-dataset comparison).

    These prompts are by design open-ended. *Answers will vary; the rubrics and exemplars below are illustrative.*

    **A note on the chapter's inference device.** The five exercise datasets are complete catalogs, so (as in EX 10.1/10.2 and the Chapter 8 and 9 volcano exercises) EX 11.1 and EX 11.2 draw one seeded sample, infer from it, and reveal the full-catalog slope to check the capture. The book's own Section 11.2 inference runs on all of `house_prices`; the exercises replicating it (EX 11.14, EX 11.20) carry EX 10.27's data-generating-process reading (sales as realizations of the Seattle market process), and EX 11.15's permutation test needs no sampling story at all, its randomness comes from the shuffles. The prediction and validation extensions (EX 11.16 to EX 11.19, EX 11.24 to EX 11.26) score out-of-sample error, which is coherent on any fixed dataset.
  data_note: |-
    **Data source (`episodes`, from the `steves` package).** Source: Rick Steves' Europe (compiled dataset). Note: This dataset was created from public sources for teaching purposes and is not an official or verified Rick Steves' Europe dataset.
exercises:
- ex_num: 1
  hash: "srph"
  difficulty: 3
  group: 'Case study: Seattle house prices (modeling + inference)'
  webr: '# your code here'
  prompt: |-
    **Connect modeling to inference**: pick two numerical variables from any of the
    five exercise datasets (`olympic_athletes`, `episodes`, `bob_ross`, `planets`,
    `volcanoes`), fit a regression, build a **CI for the slope**, and write
    a one-paragraph synthesis: what's the slope, is it significantly different from
    zero, and what's the practical interpretation?

    One wrinkle before you infer: each of these datasets is a *complete catalog* of
    what it covers (every episode, every catalogued volcano), so a CI computed from
    the full data has nothing left to estimate. Use the device EX 10.1 and EX 10.2
    introduced for the volleyball catalog: treat the full data as the population,
    set a seed and draw a random sample of about half the rows with `slice_sample()`,
    fit the model and build the slope CI **on the sample**, then compute the
    full-data slope directly and check whether your interval captured it.

    Reasonable pairs: `imdb_rating ~ season` in `episodes` (a pair this book hasn't
    modeled yet; 8 of the 159 episodes lack a rating, so filter with
    `!is.na(imdb_rating)` first); `mass_earth ~ radius_earth` in `planets` (Chapter
    5's pair); or `eq_temp_k ~ insolation_earth` in `planets` (each is missing for
    about 26-30% of planets, filter first). Chapter 10 already worked `weight ~
    height` hard for volleyball athletes, so give that pair a rest here.

    Steer clear of: identifier columns (`volcanoes$volcano_number` runs from about
    210,010 to 390,847, it's a catalog label, so a "slope per unit of volcano number"
    means nothing; likewise `episodes$tvmaze_id`), and treating a `year` column as
    the outcome, a regression "predicting the year" from a physical measurement
    answers no real question.
  book_section: '11.2 Case study: Seattle house prices'
  book_subsection: 11.2.3 Regression modeling / 11.2.5 Inference (synthesis)
