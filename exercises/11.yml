- ex_num: 24
  hash: "ttsp"
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    hp <- house_prices |>
      mutate(id          = row_number(),
             log10_price = log10(price),
             log10_size  = log10(sqft_living))
    # train: slice_sample(prop = 0.8); test: anti_join(train, by = "id")
  prompt: |-
    **Train-test split: honest prediction error.** EX 11.17 ran a ready-made 80/20 split on the *simple* model and read off its log-scale numbers; now build the split **yourself** with dplyr tools and put it to work on the chapter's *interaction* model, scored in **dollars**, the units a homebuyer cares about. (The motivation is the same: evaluating a model on the data it was fit to is like grading students on the exact questions they studied from.) With `set.seed(76)`, tag each row of `house_prices` with an `id` using `row_number()` (which numbers the rows 1, 2, 3, ...), draw a random 80% **training set** with `slice_sample(prop = 0.8)` (a dplyr verb that keeps a random sample of rows, here 80% of them), and form the 20% **test set** with `anti_join(hp, train, by = "id")` (a dplyr join that keeps only the rows whose `id` does *not* appear in the training set). Refit the chapter's interaction model `log10_price ~ log10_size * condition` on the **training set only**, predict $\log_{10}(\text{price})$ for both sets, and compute each set's **RMSE in dollars**: back-transform each prediction with `10^()`, then apply `sqrt(mean((price - predicted_price)^2))`. Which of the two RMSEs is the honest estimate of how the model will perform on houses it has never seen, and why do we *usually* expect that one to be the larger of the two? (Run the code before answering: this dataset has a surprise in store.)
  book_section: Extensions
