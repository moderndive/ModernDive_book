- ex_num: 16
  hash: "acjw"
  difficulty: 3
  group: Extensions
  webr: |-
    # k-fold cross-validation for a regression model on the Seattle house prices data
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living))

    n <- nrow(house_sub)
    k <- 5
    folds <- sample(rep(1:k, length.out = n))

    cv_rmse <- function(fold_id) {
      train <- house_sub[folds != fold_id, ]
      test  <- house_sub[folds == fold_id, ]
      m     <- lm(log10(price) ~ sqft_living, data = train)
      pred  <- predict(m, newdata = test)
      sqrt(mean((log10(test$price) - pred)^2))
    }

    # purrr::map_dbl(): apply cv_rmse() to each fold id, get one RMSE per fold
    fold_rmses <- purrr::map_dbl(1:k, cv_rmse)
    cat(sprintf("Fold RMSEs: %s\n", paste(round(fold_rmses, 3), collapse = ", ")))
    cat(sprintf("Mean RMSE across folds: %.3f\n", mean(fold_rmses)))
  prompt: |-
    **k-fold cross-validation.** Extension EX 5.47 introduced $R^2$ as a summary of how well a model fits *the data it was fit to*, and Chapter 11's case study likewise evaluated its model only on the data it was fit to. But a model that fits its training data well can still predict *new* data poorly (the model has "memorized" the training set). **Cross-validation** evaluates how a model generalizes, randomly split the data into $k$ folds, train on $k-1$ of them, test on the held-out fold, repeat for all $k$ folds, and report the *average* out-of-sample error. Run the 5-fold CV snippet on the Seattle `house_prices` data from Section 11.2's case study. Two of its tools have appeared before: `predict(m, newdata = ...)` (Chapter 5's Extension EX 5.38) gets a fitted model's predictions on new rows, and `purrr::map_dbl(1:k, cv_rmse)` (the mapper met in Chapter 8's Extension EX 8.45) applies `cv_rmse()` to each fold number and returns one RMSE per fold. Why is the mean fold RMSE a *more honest* estimate of how the model will perform on truly new houses than the in-sample $R^2$?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 17
  hash: "nzfq"
  difficulty: 3
  group: Extensions
  webr: |-
    # Simpler alternative, single train/test split
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living))

    n     <- nrow(house_sub)
    train_idx <- sample(seq_len(n), size = 0.8 * n)
    train <- house_sub[ train_idx, ]
    test  <- house_sub[-train_idx, ]

    m <- lm(log10(price) ~ sqft_living, data = train)

    # Training R², from broom::glance()'s one-row model summary:
    broom::glance(m) |> pull(r.squared)
    # Held-out test RMSE:
    sqrt(mean((log10(test$price) - predict(m, newdata = test))^2))
  prompt: |-
    **Train/test split.** A simpler alternative to full $k$-fold CV, hold out a *single* chunk (typically 20–30 %) as the **test set**, train on the rest, evaluate on the held-out. One fit, one number out. Cheaper than $k$-fold but noisier (you get one estimate, not $k$). Run the 80/20 split on the same Seattle `house_prices` data as EX 11.16 (the snippet reads the training $R^2$ from `broom::glance(m)`, the one-row whole-model summary tibble met in Chapter 5's Extension EX 5.45, piped into `pull(r.squared)`). Compare the training $R^2$ to the test RMSE. When would a single split be sufficient vs. when would you want full $k$-fold?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 18
  hash: "290l"
  difficulty: 3
  group: Extensions
  webr: |-
    # Demonstrate overfitting with high-order polynomials
    set.seed(76)
    house_sub <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living)) |>
      slice_sample(n = 2000)   # enough data that low-degree fits win and high degrees overfit

    train_idx <- sample(seq_len(2000), 1600)
    train <- house_sub[ train_idx, ]
    test  <- house_sub[-train_idx, ]

    # purrr::map_dfr(): apply the recipe to each degree, row-bind the results
    rmses <- purrr::map_dfr(1:12, function(d) {
      m <- lm(log10(price) ~ poly(sqft_living, d), data = train)
      tibble(degree     = d,
             train_rmse = sqrt(mean(residuals(m)^2)),
             test_rmse  = sqrt(mean((log10(test$price) - predict(m, newdata = test))^2)))
    })
    rmses

    # Make the U-shape visible (log y-axis: the worst test RMSEs are orders of
    # magnitude above the best)
    rmses |>
      pivot_longer(-degree, names_to = "set", values_to = "rmse") |>
      ggplot(aes(x = degree, y = rmse, color = set)) +
      geom_line() + geom_point() +
      scale_y_log10() +
      labs(x = "Polynomial degree", y = "RMSE (log scale)")
  prompt: |-
    **Overfitting demonstration.** Add too many predictors (or too high a polynomial degree) and your model will *memorize* the training data, driving the training RMSE down, while predicting badly on new data. Run the snippet: on a seeded 2,000-house subsample of the same Seattle `house_prices` data as EX 11.16 and EX 11.17, it fits polynomials of degree 1 through 12 of `sqft_living` on a training set and tracks training vs test RMSE at each degree, collecting one row per degree with `purrr::map_dfr()` (the purrr row-binder first explained in EX 9.19). It then plots both RMSE curves against degree; `scale_y_log10()`, the y-axis sibling of EX 6.36's `scale_x_log10()`, keeps the exploding test RMSEs on screen. At what degree does the test RMSE *bottom out*? At what degree does training RMSE keep falling while test RMSE *rises*? That's overfitting in action. Close with a decision and a plain-English conclusion: which degree would you ship, and why?
  book_section: Extensions
  book_subsection: Extensions
- ex_num: 19
  hash: "jmpb"
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    hp <- house_prices |>
      filter(!is.na(price), !is.na(sqft_living), !is.na(bedrooms))
    train_idx <- sample(seq_len(nrow(hp)), size = floor(0.8 * nrow(hp)))
    train <- hp[ train_idx, ]
    test  <- hp[-train_idx, ]

    m <- lm(log10(price) ~ sqft_living + bedrooms, data = train)
    c(train_r_squared = broom::glance(m) |> pull(r.squared),
      test_rmse = sqrt(mean((log10(test$price) - predict(m, newdata = test))^2)))
  prompt: |-
    **In-sample $R^2$ vs out-of-sample RMSE.** Training $R^2$ rewards "how much variance does the model explain in the *training* data." Test RMSE rewards "how accurately can the model *predict* new observations." For a published model, *both* are worth reporting, the $R^2$ describes the explanatory fit, the test RMSE describes the predictive accuracy. The snippet fits the two-predictor model `lm(log10(price) ~ sqft_living + bedrooms)` on a seeded 80/20 train/test split of the Seattle `house_prices` data and reports both numbers, reading the training $R^2$ from `broom::glance()` as in EX 11.17. Why is the *test* RMSE (not training RMSE) the right number to use when comparing *predictive* models?
  book_section: Extensions
  book_subsection: Extensions
