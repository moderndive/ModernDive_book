- ex_num: 26
  hash: "kfcv"
  difficulty: 3
  group: Extensions
  webr: |-
    set.seed(76)
    # Assign folds by shuffling: sample(rep(1:5, length.out = n()))
    # Then loop over folds 1-5: train on the other four, test on the held-out fold.
  prompt: |-
    **5-fold cross-validation, built by hand.** EX 11.16 ran ready-made 5-fold CV machinery on the *simple* model; here you build that machinery yourself, for the *interaction* model and scored in dollars. Recall why CV exists. A single train-test split (EX 11.24) has two weaknesses: one fifth of your data never helps fit the model, and the RMSE you get depends on the luck of the draw (which mansions happened to land in the test set?). **k-fold cross-validation** fixes both. Split the houses into $k = 5$ equal "folds" and give each fold one turn as the test set, training on the other four. With `set.seed(76)`, assign each house a fold number by shuffling `sample(rep(1:5, length.out = n()))` (`rep(..., length.out = n())` recycles 1 through 5 across all the rows; `sample(...)` then shuffles those labels randomly). For each fold, fit the chapter's interaction model on the other four folds and compute the test RMSE in dollars (EX 11.24's formula) on the held-out fold. A base `for()` loop is the clearest tool for "repeat this once per fold". Report the five fold RMSEs and their mean, then make the spread visible: plot the five fold RMSEs as points with `geom_point()`, add a solid horizontal line at their mean with `geom_hline()`, and a dashed one at EX 11.24's single-split test RMSE. Then answer:

    - (a) how much do the five RMSEs vary, and what does that spread tell you that a single train-test split can't?
    - (b) why does giving every house exactly one turn in the test set make cross-validation a better use of the data than a single split?
  book_section: Extensions
  book_subsection: Extensions
