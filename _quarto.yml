project:
  type: book
  output-dir: docs
  post-render: scripts/post-render-cleanup.sh
  resources:
    - extras/regression-plane.html
    - extras/regression-plane-ISLR2.html
    - extras/labs.html
    - 404.html
    - robots.txt

book:
  title: "Statistical Inference via Data Science"
  subtitle: "A ModernDive into R and the Tidyverse (Second Edition)"
  author: "Chester Ismay, Albert Y. Kim, and Arturo Valdivia"
  date: today
  description: "An open-source and fully-reproducible electronic textbook for teaching statistical inference using tidyverse data science tools."
  repo-url: https://github.com/moderndive/ModernDive_book/
  repo-branch: v2
  repo-actions: [edit, source, issue]
  favicon: images/logos/favicons/favicon.ico
  # Per-page social-share metadata. Quarto generates OpenGraph + Twitter-card
  # tags for every chapter using the chapter's title and the book-level
  # `description` as defaults. Per-chapter overrides can be added to a
  # chapter's YAML frontmatter (`description:` / `image:`) when needed.
  site-url: https://moderndive.com/v2/
  open-graph:
    image: images/logos/v2_cover.jpg
    locale: en_US
  twitter-card:
    image: images/logos/v2_cover.jpg
    card-style: summary
    creator: '\@ismayc'
    site: '\@moderndive'
  chapters:
    - index.qmd
    - 00-foreword.qmd
    - 00-preface.qmd
    - part: "Introduction"
      chapters:
        - 01-getting-started.qmd
    - part: "Data Science with tidyverse"
      chapters:
        - 02-visualization.qmd
        - 03-wrangling.qmd
        - 04-tidy.qmd
    - part: "Statistical Modeling with moderndive"
      chapters:
        - 05-regression.qmd
        - 06-multiple-regression.qmd
    - part: "Statistical Inference with infer"
      chapters:
        - 07-sampling.qmd
        - 08-confidence-intervals.qmd
        - 09-hypothesis-testing.qmd
        - 10-inference-for-regression.qmd
    - part: "Conclusion"
      chapters:
        - 11-tell-your-story-with-data.qmd
  appendices:
    - 91-appendixA.qmd
    - 92-appendixB.qmd
    - 93-appendixC.qmd
    - 94-appendixD.qmd
    - 95-appendixE.qmd
    - 96-glossary.qmd
    - 99-references.qmd

bibliography: [bib/books.bib, bib/packages.bib, bib/articles.bib]

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    include-in-header:
      - _includes/mathjax-assistive.html
      - _includes/analytics.html
      - _includes/contrast-toggle.html
      - _includes/code-text-size.html
    include-before-body: _includes/logo.html
    include-after-body: _includes/glossary-popover.html
    lightbox: true
    citations-hover: true     # popup preview when hovering [@cite]
    reading-time: true        # "≈ N min read" badge per chapter
    code-link: true           # function names link to their pkg docs
    code-annotations: hover   # `# <1>` annotations expand on hover
    # Tell search engines this is the canonical V2 URL (helps disambiguate from
    # the V1 site at moderndive.com/). Quarto emits <link rel="canonical">
    # on every rendered page using `site-url` as the base.
    canonical-url: true

crossref:
  fig-title: FIGURE
  tbl-title: TABLE
  chapters: true

filters:
  - webr
  # First-occurrence-per-chapter glossary auto-linking
  # (see _extensions/glossary-autolink/glossary-autolink.lua).
  - glossary-autolink
  # ARIA landmark attributes on .learncheck / .announcement / .review
  # callouts (Quarto's built-in callouts already have them).
  - aria-callouts

webr:
  show-startup-message: false
  # Pin webR to 0.6.0 (ships R 4.6.0). The moderndive r-universe dev build that
  # exports View() is only compiled to wasm for R 4.6.0; on the older 0.5.x
  # series (R 4.5.1) that binary is incompatible, so webR silently falls back to
  # the CRAN moderndive 0.7.0 (no View) and `moderndive::View()` errors.
  version: "0.6.0"
  packages:
    - ggplot2
    - dplyr
    - tidyr
    - readr            # gzipped CSV reads for GitHub-only dataset mirrors
    - moderndive
    - nycflights23
    - fivethirtyeight
    - patchwork
    - infer
  cell-options:
    editor-font-scale: 0.85
